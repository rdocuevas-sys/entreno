<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de entrenamiento — casa</title>
<meta name="description" content="Plan de entrenamiento y alimentación — registro diario de cargas, comidas y medidas.">
<meta name="theme-color" content="#14201C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="mobile-web-app-capable" content="yes">

<style>
  /* ---- tipografías locales: van en el repo para que la app funcione sin señal ---- */
  @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;
    src:url(fonts/barlow-condensed-500.woff2) format('woff2')}
  @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;
    src:url(fonts/barlow-condensed-600.woff2) format('woff2')}
  @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;
    src:url(fonts/barlow-condensed-700.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;
    src:url(fonts/ibm-plex-mono-500.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;
    src:url(fonts/ibm-plex-mono-600.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;
    src:url(fonts/inter-var.woff2) format('woff2')}
</style>

<style>
  :root{
    --paper:#EDF0EE;
    --card:#FFFFFF;
    --ink:#14201C;
    --ink-2:#4C5B55;
    --ink-3:#8896901a;
    --line:#D3DAD6;
    --pine:#1E5F4E;
    --pine-lt:#E4EFEA;
    --slate:#2C4A63;
    --amber:#B87614;
    --rust:#9E4B31;
    --r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.5;
    padding-bottom:40px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 14px}

  /* ---- header ---- */
  header{
    background:var(--ink);color:#EDF0EE;
    padding:18px 0 0;
    position:sticky;top:0;z-index:50;
    box-shadow:0 2px 14px rgba(20,32,28,.18);
  }
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:26px;letter-spacing:.04em;
    text-transform:uppercase;margin:0;
  }
  .brand span{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    color:#8FA79C;letter-spacing:.06em;
  }
  nav{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    background:none;border:0;color:#8FA79C;
    font-family:'Barlow Condensed',sans-serif;
    font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 14px;cursor:pointer;white-space:nowrap;
    border-bottom:3px solid transparent;
  }
  nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--pine)}
  nav button:focus-visible{outline:2px solid #6FB39C;outline-offset:-4px}

  /* ---- shared ---- */
  h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;letter-spacing:.03em;
     text-transform:uppercase;margin:22px 0 4px;font-weight:700}
  .lede{color:var(--ink-2);font-size:13.5px;margin:0 0 16px;max-width:62ch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
        padding:14px;margin-bottom:12px}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
           text-transform:uppercase;color:var(--ink-2)}
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  button.act{
    font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase;
    background:var(--pine);color:#fff;border:0;border-radius:8px;
    padding:10px 16px;cursor:pointer;
  }
  button.act:active{transform:translateY(1px)}
  button.ghost{background:none;color:var(--pine);border:1.5px solid var(--pine)}
  button.mini{padding:6px 10px;font-size:13px}
  input,select,textarea{
    font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:7px;
    padding:9px 10px;width:100%;
  }
  input[type=number]{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--pine);outline-offset:-1px;border-color:var(--pine)}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);
        text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:560px){.g4{grid-template-columns:1fr 1fr}}

  /* ---- day picker ---- */
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{
    flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:9px;
    padding:9px 13px;cursor:pointer;text-align:left;min-width:112px;
  }
  .day b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:17px;
         letter-spacing:.04em;text-transform:uppercase}
  .day small{color:var(--ink-2);font-size:11px}
  .day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .day[aria-pressed="true"] small{color:#8FA79C}
  /* días ya entrenados esta semana */
  .day.hecho{background:var(--pine-lt);border-color:var(--pine)}
  .day.hecho b{color:var(--pine)}
  .day.hecho[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
  .day.hecho[aria-pressed="true"] b{color:#fff}
  .aviso-dia{background:var(--pine-lt);border-left:3px solid var(--pine);
             padding:10px 13px;border-radius:0 8px 8px 0;font-size:13.5px;margin-bottom:12px}

  /* ---- exercise ---- */
  .ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      margin-bottom:10px;overflow:hidden}
  .ex-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;
           user-select:none;background:none;border:0;width:100%;text-align:left;font:inherit}
  .ex-idx{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2);
          border:1px solid var(--line);border-radius:5px;padding:3px 6px;flex:0 0 auto}
  .ex-name{flex:1;font-weight:600;font-size:15px;line-height:1.3}
  .ex-name em{display:block;font-style:normal;font-family:'IBM Plex Mono',monospace;
              font-size:11px;color:var(--pine);letter-spacing:.04em;margin-top:2px}
  .chev{color:var(--ink-2);font-size:13px;transition:transform .18s}
  .ex[data-open="1"] .chev{transform:rotate(90deg)}
  .ex-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
  .ex[data-open="1"] .ex-body{display:block}
  .ex.done .ex-idx{background:var(--pine);color:#fff;border-color:var(--pine)}

  .frames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}
  .frames.one{grid-template-columns:1fr;max-width:280px;margin-inline:auto}
  .frame{background:var(--pine-lt);border-radius:8px;padding:4px;position:relative}
  .frame figcaption{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--pine);text-align:center;padding:2px 0 5px
  }
  .frame svg{display:block;width:100%;height:auto}
  .demo{display:inline-block;margin-top:10px;font-family:'IBM Plex Mono',monospace;
        font-size:11.5px;letter-spacing:.03em;color:var(--slate);text-decoration:none;
        border-bottom:1.5px solid var(--slate);padding-bottom:1px}
  .demo:hover{color:var(--pine);border-color:var(--pine)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;
          font-size:10.5px;color:var(--ink-2);margin:2px 0 4px}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
  .cue{font-size:13.5px;color:var(--ink-2);margin:6px 0 0;padding-left:12px;
       border-left:2px solid var(--pine)}

  table.sets{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  table.sets th{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;
                text-transform:uppercase;color:var(--ink-2);font-weight:500;
                text-align:center;padding:4px 2px}
  table.sets td{padding:3px 2px}
  table.sets input{padding:8px 4px;text-align:center}
  .prev{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate);
        background:#EAF0F5;border-radius:5px;padding:4px 8px;display:inline-block;margin-top:8px}

  /* ---- bars ---- */
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;background:var(--pine);border-radius:99px;transition:width .3s}
  .bar i.over{background:var(--amber)}
  .stat b{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;
          display:block;font-variant-numeric:tabular-nums}
  .stat small{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}

  table.tbl{width:100%;border-collapse:collapse;font-size:13px;
            font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  table.tbl th{background:var(--ink);color:#fff;font-size:10px;letter-spacing:.05em;
               text-transform:uppercase;padding:7px 5px;font-weight:600;text-align:right}
  table.tbl th:first-child,table.tbl td:first-child{text-align:left}
  table.tbl td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  .pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
        letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;
        background:var(--pine-lt);color:var(--pine)}
  .pill.warn{background:#FBF0DC;color:var(--amber)}
  .pill.bad{background:#F7E6E1;color:var(--rust)}
  .note{background:#FBF0DC;border-left:3px solid var(--amber);padding:11px 13px;
        border-radius:0 8px 8px 0;font-size:13.5px;margin-bottom:12px}
  /* ---- cierre de sesión: guardar y ver qué quedó guardado ---- */
  .guardar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
           background:var(--pine-lt);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .guardar button{flex:0 0 auto}
  .gstat{font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.5;
         color:var(--pine);flex:1 1 160px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);
         background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;
         opacity:0;transition:.25s;z-index:99;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .hide{display:none}
  /* ---- aviso de versión nueva ---- */
  .upd{position:fixed;left:12px;right:12px;bottom:14px;z-index:98;
       background:var(--pine);color:#fff;border-radius:var(--r);
       padding:12px 14px;display:flex;align-items:center;gap:12px;
       box-shadow:0 6px 22px rgba(20,32,28,.28);
       transform:translateY(120px);opacity:0;transition:.28s;pointer-events:none}
  .upd.on{transform:translateY(0);opacity:1;pointer-events:auto}
  .upd p{margin:0;font-size:13.5px;flex:1}
  .upd button{background:#fff;color:var(--pine);border:0;border-radius:8px;
              padding:9px 14px;font:600 13px 'Inter',sans-serif;cursor:pointer}
  @media(min-width:700px){.upd{left:auto;right:18px;width:380px}}
  /* ---- cronómetro de descanso ---- */
  /* El aviso de versión nueva vive en la misma esquina: si los dos aparecen
     juntos, el aviso sube y el cronómetro se queda abajo, a mano del pulgar. */
  .upd.subido{bottom:96px}
  .crono{position:fixed;left:12px;right:12px;bottom:14px;z-index:98;
         background:var(--ink);color:#fff;border-radius:var(--r);
         padding:10px 14px;display:flex;align-items:center;gap:10px;
         box-shadow:0 6px 22px rgba(20,32,28,.28);
         transform:translateY(120px);opacity:0;transition:.28s;pointer-events:none}
  .crono.on{transform:translateY(0);opacity:1;pointer-events:auto}
  .crono-t{font-family:'IBM Plex Mono',monospace;font-size:26px;font-variant-numeric:tabular-nums;
           letter-spacing:.02em;min-width:74px}
  .crono-e{flex:1;font-size:12px;line-height:1.35;opacity:.75}
  .crono button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;
                padding:8px 11px;font:600 12.5px 'Inter',sans-serif;cursor:pointer}
  .crono button:active{transform:translateY(1px)}
  /* al llegar a cero deja de ser un cronómetro y pasa a ser un aviso */
  .crono.listo{background:var(--rust)}
  .crono.listo .crono-e{opacity:.95}
  @media(min-width:700px){.crono{left:auto;right:18px;width:380px}}
  /* ---- descanso, sugerencia e historial dentro del ejercicio ---- */
  .fila-ex{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
  .sug{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--pine);
       background:var(--pine-lt);border-radius:6px;padding:5px 9px;line-height:1.5}
  .hist{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .hist table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
  .hist td{padding:3px 0;vertical-align:top;color:var(--ink-2)}
  .hist td:first-child{width:64px;color:var(--slate);white-space:nowrap}
  hr{border:0;border-top:1px solid var(--line);margin:18px 0}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="brand">
      <h1>Plan de entrenamiento</h1>
      <span id="hdrTargets">—</span>
    </div>
    <nav id="nav" role="tablist"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast"></div>
<div class="upd" id="upd" role="status">
  <p><b>Hay una versión nueva.</b> Tus registros no se tocan.</p>
  <button id="btnUpd">Actualizar</button>
</div>
<div class="crono" id="crono" role="timer" aria-live="off">
  <span class="crono-t" id="cronoT">0:00</span>
  <span class="crono-e" id="cronoE"></span>
  <button id="btnCrono30">+30 s</button>
  <button id="btnCronoX">Listo</button>
</div>

<script>
/* ============================================================
   1. DIBUJO DE EJERCICIOS  (SVG generado, sin imágenes externas)
   ============================================================ */
const VB = '0 0 200 152';
const I = 'var(--ink)';
const R = 'var(--rust)';
function ln(a,b,w,c,op){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c||I}" stroke-width="${w||5}" stroke-linecap="round"${op?` opacity="${op}"`:''}/>`}
function cir(c,r,fill,w,st){return `<circle cx="${c[0]}" cy="${c[1]}" r="${r}" fill="${fill||'none'}" stroke="${st||I}" stroke-width="${w===undefined?3.5:w}"/>`}
function box(x,y,w,h,fill,rot,cx,cy){
  const t = rot?` transform="rotate(${rot} ${cx} ${cy})"`:'';
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${fill||'#fff'}" stroke="${I}" stroke-width="3"${t}/>`}
function floor(y){y=y||142;return ln([6,y],[194,y],2.5,I,.4)}
function mat(){return box(24,136,152,7,'#fff')}
function bench(x,y,w){return box(x,y,w,9,'#fff')+ln([x+9,y+9],[x+9,142],4)+ln([x+w-9,y+9],[x+w-9,142],4)}
function guide(a,b){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${R}" stroke-width="2" stroke-dasharray="5 4" opacity=".7"/>`}

/* --- flecha de recorrido --- */
function arrow(a,b,bend){
  bend=bend||0;
  const mx=(a[0]+b[0])/2+bend, my=(a[1]+b[1])/2;
  const ang=Math.atan2(b[1]-my,b[0]-mx), h=7.5;
  const p1=[b[0]-h*Math.cos(ang-.45), b[1]-h*Math.sin(ang-.45)];
  const p2=[b[0]-h*Math.cos(ang+.45), b[1]-h*Math.sin(ang+.45)];
  return `<path d="M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}" fill="none" stroke="${R}" stroke-width="2.8" stroke-linecap="round"/>`
       + `<path d="M${p1[0]} ${p1[1]} L${b[0]} ${b[1]} L${p2[0]} ${p2[1]}" fill="none" stroke="${R}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`;
}

/* --- equipamiento --- */
function plate(c){return cir(c,11,'var(--pine)',3)+cir(c,3,'#fff',0)}
function dbS(c){return box(c[0]-6,c[1]-9,12,18,'var(--pine)')}
function dbF(c){return box(c[0]-8,c[1]-5,16,10,'var(--pine)')}
function barF(a,b){return ln(a,b,6)+box(a[0]-4,a[1]-11,8,22,'var(--pine)')+box(b[0]-4,b[1]-11,8,22,'var(--pine)')}
function equip(kind,p,view){
  if(!kind) return '';
  if(view==='F'){
    if(kind==='dbF') return dbF(p.hL)+dbF(p.hR);
    if(kind==='barF') return barF(p.hL,p.hR);
    return '';
  }
  if(kind==='plate') return plate(p.hn);
  if(kind==='dbS')   return dbS(p.hn);
  if(kind==='dbS2')  return dbS(p.hn)+dbS([p.hn[0]+24,p.hn[1]]);
  /* De perfil, una mancuerna con agarre neutro (palma hacia adentro) se ve
     a lo largo, no de canto: por eso va la forma horizontal. */
  if(kind==='dbH')   return dbF(p.hn);
  /* Las dos manos dibujadas por separado, cada una con su mancuerna. */
  if(kind==='dbDual')return dbS(p.hn)+(p.hn2?dbS(p.hn2):'');
  return '';
}

/* --- figuras --- */
function figS(j,ghost){
  const op = ghost?.22:null, c = ghost?'#9AA8A2':I, w=ghost?1:undefined;
  let s = ln(j.hp,j.sh,7,c,op)+ln(j.sh,j.hd,4.5,c,op)
        + ln(j.sh,j.el,5,c,op)+ln(j.el,j.hn,5,c,op)
        + ln(j.hp,j.kn,6,c,op)+ln(j.kn,j.ft,6,c,op);
  if(j.kn2) s += ln(j.hp,j.kn2,6,c,op)+ln(j.kn2,j.ft2,6,c,op);
  if(j.el2) s += ln(j.sh,j.el2,5,c,op)+ln(j.el2,j.hn2,5,c,op);
  s += ghost ? cir(j.hd,8.5,'none',2,'#9AA8A2') : cir(j.hd,8.5,'#fff');
  if(!ghost && j.fc) s += cir([j.hd[0]+j.fc[0]*5.5, j.hd[1]+j.fc[1]*5.5],2,I,0);
  return ghost?`<g opacity=".55">${s}</g>`:s;
}
function figF(j,ghost){
  const op = ghost?.22:null, c = ghost?'#9AA8A2':I;
  let s = ln(j.hp,j.sh,7,c,op)+ln(j.sh,j.hd,4.5,c,op)+ln(j.sL,j.sR,6,c,op)
        + ln(j.sL,j.eL,5,c,op)+ln(j.eL,j.hL,5,c,op)
        + ln(j.sR,j.eR,5,c,op)+ln(j.eR,j.hR,5,c,op)
        + ln(j.hp,j.kL,6,c,op)+ln(j.kL,j.fL,6,c,op)
        + ln(j.hp,j.kR,6,c,op)+ln(j.kR,j.fR,6,c,op);
  s += ghost ? cir(j.hd,8.5,'none',2,'#9AA8A2') : cir(j.hd,8.5,'#fff');
  if(!ghost) s += cir([j.hd[0]-3,j.hd[1]-1],1.7,I,0)+cir([j.hd[0]+3,j.hd[1]-1],1.7,I,0);
  return ghost?`<g opacity=".55">${s}</g>`:s;
}
function svg(inner){return `<svg viewBox="${VB}" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`}

/* --- catálogo --- */
const UP=[0,-1], DN=[0,1], LT=[-1,0], RT=[1,0];
const EX = {

/* --- render de un cuadro --- */
function frame(key,idx){
  const e=EX[key]; if(!e) return '';
  const solo = e.p.length===1;
  let s = e.bg?e.bg():'';
  if(idx===0 && e.bgA) s+=e.bgA();
  if(idx===1 && e.bgB) s+=e.bgB();
  if(e.custom) return svg(s+e.custom()+(e.guideTop?e.guideTop():''));
  const me=e.p[idx], other=solo?null:e.p[1-idx];
  if(other){
    s += (e.v==='F'?figF(other,1):figS(other,1));
  }
  s += equip(e.eq,me,e.v);
  s += (e.v==='F'?figF(me):figS(me));
  if(e.post) s += e.post(me);
  if(e.ar) e.ar.forEach(a=>{ s+=arrow(a[0],a[1],a[2]); });
  return svg(s);
}
function frames(key){
  const e=EX[key]; if(!e) return null;
  return e.p.length===1?[frame(key,0)]:[frame(key,0),frame(key,1)];
}

/* ============================================================
   3. ESTADO Y ALMACENAMIENTO
   ============================================================ */
const KEY = 'entreno:v1';
const DEF = {
  cfg:{alt:190,peso:90,edad:33,sexo:1,act:1.55,def:0.17,prot:2.1,gr:0.85,inicio:''},
  semana:1,      /* solo respaldo: la semana de verdad sale de la fecha, ver semanaDe() */
  fuerza:[],   // {f,sem,dia,ej,serie,kg,reps,rir}
  cardio:[],   // {f,sem,tipo,min,int,kcal,nota}
  comida:[],   // {f,sem,tipo,kcal,p,c,g,agua,ayuno,adh,txt,nota}
  medidas:[]   // {sem,f,peso,cint,cintE,cad,pecho,brazo,muslo,nota}
};
let S = JSON.parse(JSON.stringify(DEF));
let storageOK = true;

async function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) S = Object.assign(JSON.parse(JSON.stringify(DEF)), JSON.parse(raw));
  }catch(e){ /* sin datos previos o sin almacenamiento */ }
  /* el cfg guardado reemplaza entero al de fábrica: hay que reponer las claves
     nuevas o quedan en undefined */
  S.cfg = Object.assign(JSON.parse(JSON.stringify(DEF.cfg)), S.cfg||{});
  if(!fechaMs(S.cfg.inicio)){
    /* Primera vez con semanas automáticas. El plan empezó el día del registro
       más antiguo que exista; si no hay ninguno, hoy. No se toca ningún dato:
       solo se fija la referencia desde la que se cuentan las semanas. */
    const fechas = [...S.fuerza,...S.cardio,...S.comida,...S.medidas]
      .map(x=>x.f).filter(f=>!isNaN(fechaMs(f))).sort();
    S.cfg.inicio = fechas[0] || hoy();
    saveNow();
  }
}
let saveT=null;
function saveNow(){
  clearTimeout(saveT); saveT=null;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){
    if(storageOK){ storageOK=false; toast('Sin guardado automático — usa Exportar'); }
  }
  refrescarGuardado();   /* que el "Guardando…" alcance a decir "Guardado" */
}
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(saveNow, 600);
}
/* si cierras la app justo después de escribir, el guardado pendiente no se pierde */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && saveT) saveNow(); });
window.addEventListener('pagehide',()=>{ if(saveT) saveNow(); });
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200);
}
/* Fecha LOCAL, no UTC. Con toISOString() todo lo anotado después de las 20:00
   en Chile quedaba con la fecha del día siguiente, y al entrenar al otro día
   se sobreescribía la sesión de la noche anterior. */
const hoy = ()=>{
  const d = new Date();
  const dos = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${dos(d.getMonth()+1)}-${dos(d.getDate())}`;
};
const nz = v => (v===''||v===null||v===undefined||isNaN(v))?0:+v;

/* ---- la semana sale de la fecha, no de un número que hay que acordarse de subir ----
   Antes cada registro se estampaba con el número que estuviera puesto en Ajustes.
   El día que se te olvidaba subirlo, dos semanas de entrenamiento caían en la misma
   fila del Resumen (volumen duplicado, la Lectura comparando contra la semana
   equivocada) y las medidas del lunes siguiente sobreescribían las del anterior,
   porque solo cabe una fila por semana. Ahora la semana se calcula desde la fecha
   de cada registro y el número guardado ya no se lee. */
const fechaMs = f => { const p=String(f||'').split('-');
  return p.length===3 ? new Date(+p[0],+p[1]-1,+p[2]).getTime() : NaN; };  /* local, nunca UTC */
function lunesDe(ms){
  const d=new Date(ms); const dow=(d.getDay()+6)%7;   /* 0 = lunes */
  d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); return d.getTime();
}
/* La semana del plan corre de lunes a domingo: si empezaste un miércoles, esa
   semana sigue siendo la 1 y la 2 parte el lunes siguiente. */
function semanaDe(f){
  const a=fechaMs(S.cfg.inicio), b=fechaMs(f);
  if(isNaN(a)||isNaN(b)) return nz(S.semana)||1;
  return Math.max(1, Math.round((lunesDe(b)-lunesDe(a))/604800000)+1);
}
const semanaHoy = () => semanaDe(hoy());

/* ---- un solo peso ----
   El de Ajustes movía los objetivos de calorías y proteína; el de Medidas era el
   semanal. Anotar el peso donde corresponde no recalculaba nada y terminabas
   comiendo para un peso viejo. Manda la última medición; el de Ajustes queda
   como punto de partida mientras no hayas medido. */
function pesoActual(){
  const con = S.medidas.filter(x=>nz(x.peso)>0 && fechaMs(x.f));
  if(!con.length) return nz(S.cfg.peso);
  return nz(con.slice().sort((a,b)=>fechaMs(a.f)-fechaMs(b.f)).pop().peso);
}
function pesoMedido(){
  const con = S.medidas.filter(x=>nz(x.peso)>0 && fechaMs(x.f));
  if(!con.length) return null;
  return con.slice().sort((a,b)=>fechaMs(a.f)-fechaMs(b.f)).pop();
}

/* ---- objetivos calculados ---- */
function targets(){
  const c=S.cfg, peso=pesoActual();
  const tmb = 10*peso + 6.25*c.alt - 5*c.edad + (c.sexo==1?5:-161);
  const tdee = tmb*c.act;
  const kcal = Math.round(tdee*(1-c.def));
  const p = Math.round(peso*c.prot);
  const g = Math.round(peso*c.gr);
  const ch = Math.round((kcal - p*4 - g*9)/4);
  return {tmb:Math.round(tmb),tdee:Math.round(tdee),kcal,p,g,ch,
          alto:Math.round(kcal*1.12), bajo:Math.round(kcal*0.85),
          perdida:((tdee-kcal)*7/7700).toFixed(2)};
}

const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fechaCorta = f => { const p=String(f).split('-'); return `${+p[2]}-${MESES[+p[1]-1]}`; };
const coma = n => String(n).replace('.',',');

/* ============================================================
   3b. CRONÓMETRO DE DESCANSO
   ------------------------------------------------------------
   Cuenta contra una hora de término, no restando de a un segundo:
   el navegador frena los temporizadores cuando la app queda en
   segundo plano, y un contador que resta se atrasaría justo
   mientras descansas con el teléfono guardado.
   ============================================================ */
let cronoFin=0, cronoTick=null, cronoEj='', cronoAviso=false;

/* '2-3 min' descansa 2 min: el rango bajo ya alcanza, y si quieres más
   está el +30 s. '45 s' son 45 segundos. '—' no lleva cronómetro. */
function segsDescanso(txt){
  if(!txt || txt==='—') return 0;
  const m = String(txt).match(/\d+/);
  if(!m) return 0;
  return /min/.test(txt) ? +m[0]*60 : +m[0];
}
const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

function iniciarDescanso(segs, ej){
  cronoFin = Date.now() + segs*1000;
  cronoEj = ej||''; cronoAviso = false;
  const c=document.getElementById('crono');
  c.classList.add('on'); c.classList.remove('listo');
  document.getElementById('upd').classList.add('subido');
  pintarCrono();
  clearInterval(cronoTick);
  cronoTick = setInterval(pintarCrono, 250);
}
function pintarCrono(){
  const restan = Math.round((cronoFin - Date.now())/1000);
  const c=document.getElementById('crono');
  document.getElementById('cronoT').textContent = mmss(Math.max(0,restan));
  if(restan>0){
    document.getElementById('cronoE').textContent = cronoEj ? `Descanso · ${cronoEj}` : 'Descanso';
    return;
  }
  document.getElementById('cronoE').textContent = 'Listo — va la siguiente serie';
  c.classList.add('listo');
  if(!cronoAviso){
    cronoAviso = true;
    if(navigator.vibrate) navigator.vibrate([220,120,220]);
  }
  if(restan < -25) cerrarDescanso();   /* no se queda tapando la pantalla */
}
function cerrarDescanso(){
  clearInterval(cronoTick); cronoTick=null;
  document.getElementById('crono').classList.remove('on','listo');
  document.getElementById('upd').classList.remove('subido');
}

/* ============================================================
   3c. QUÉ PESO TOCA HOY, Y CÓMO VIENE EL EJERCICIO
   ============================================================ */
/* Tope de repeticiones del rango prescrito. Devuelve null cuando el rango no
   se mide en repeticiones (planchas, "al fallo"): ahí no hay peso que sugerir. */
function topeReps(r){
  if(!r || /fallo/i.test(r) || /\bs\b|min/.test(r)) return null;
  const nums = String(r).match(/\d+/g);
  if(!nums) return null;
  return +nums[nums.length>1?1:0];
}
/* La regla del propio plan: si en TODAS las series llegaste al tope del rango
   con el RIR pedido o menos, sube un escalón; si no, repites el mismo peso.
   Sin sesiones anteriores no sugiere nada — no se inventa un punto de partida. */
function sugerencia(e){
  const rows = S.fuerza.filter(x=>x.ej===e.n && (nz(x.kg)>0||nz(x.reps)>0));
  if(!rows.length) return null;
  const f = rows[rows.length-1].f;
  if(f===hoy()) return null;                       /* hoy ya lo estás haciendo */
  const ult = rows.filter(x=>x.f===f).sort((a,b)=>a.serie-b.serie);
  const hechas = ult.map(x=>`${coma(x.kg||0)}×${x.reps||0}`).join('  ·  ');
  const tope = topeReps(e.r);
  const kgs = ult.map(x=>nz(x.kg)).filter(k=>k>0);
  if(tope===null || !kgs.length) return {f, hechas, txt:null};
  const kg = Math.max(...kgs);
  const llego = ult.length >= (e.s||1)
    && ult.every(x=>nz(x.reps)>=tope
        && (x.rir===''||x.rir===undefined||nz(x.rir)<=(e.rir===undefined?99:e.rir)));
  /* Con mancuernas no existe el medio kilo: se sube al siguiente par que tengas. */
  const conMancuerna = /mancuerna|goblet/i.test(e.n) || /Elevaciones laterales/i.test(e.n);
  return {f, hechas, sube:llego,
    txt: llego
      ? (conMancuerna ? 'sube al siguiente escalón de mancuerna' : `sube a ${coma(kg+2.5)} kg`)
      : `repite ${coma(kg)} kg`};
}
function historialHTML(ej){
  const rows = S.fuerza.filter(x=>x.ej===ej && (nz(x.kg)>0||nz(x.reps)>0));
  if(!rows.length) return `<p class="prev">Todavía no hay sesiones registradas de este ejercicio.</p>`;
  const porFecha = {};
  rows.forEach(x=>{ (porFecha[x.f]=porFecha[x.f]||[]).push(x); });
  const fechas = Object.keys(porFecha).sort().reverse().slice(0,8);
  return `<table>${fechas.map(f=>{
    const s = porFecha[f].slice().sort((a,b)=>a.serie-b.serie);
    return `<tr><td>${fechaCorta(f)}</td><td>${s.map(x=>`${coma(x.kg||0)}×${x.reps||0}`).join('  ·  ')}</td></tr>`;
  }).join('')}</table>${fechas.length===8?`<p class="prev">Se muestran las últimas 8 sesiones.</p>`:''}`;
}

const TABS=[['hoy','Entrenar'],['comida','Comida'],['medidas','Medidas'],['resumen','Resumen'],['ajustes','Ajustes']];
let tab='hoy', dia='A';

function render(){
  const t=targets();

/* ---------- ENTRENAR ---------- */
/* Qué día toca. La app abría siempre en el A y había que elegir a mano, sin
   memoria de cuándo entrenaste ni de qué hiciste. */
function ultimaSesion(){
  const con = S.fuerza.filter(x=>nz(x.reps)>0 && x.dia);
  if(!con.length) return null;
  const f = con.map(x=>x.f).sort().pop();
  return {f, dia: con.filter(x=>x.f===f)[0].dia};
}
function diaSugerido(){
  const u = ultimaSesion();
  if(!u) return 'A';
  if(u.f===hoy()) return u.dia;          /* si hoy ya empezaste, quédate en ese */
  const i = DAYS.findIndex(d=>d.id===u.dia);
  return i<0 ? 'A' : DAYS[(i+1)%DAYS.length].id;
}
function diasHechosSemana(){
  const sem = semanaHoy();
  return new Set(S.fuerza.filter(x=>nz(x.reps)>0 && semanaDe(x.f)===sem).map(x=>x.dia));
}
function avisoDelDia(){
  const u = ultimaSesion();
  if(!u) return `Primera sesión. Parte por el <b>día A</b> y la app va aprendiendo tu ritmo.`;
  if(u.f===hoy()) return `Hoy estás en el <b>día ${u.dia}</b>, ya anotado.`;
  const dias = Math.round((fechaMs(hoy())-fechaMs(u.f))/86400000);
  const cuando = dias===1 ? 'ayer' : dias<=0 ? 'recién' : `hace ${dias} días`;
  const descanso = dias>=5 ? ` Llevas ${dias} días sin entrenar: baja un poco la carga en el primer ejercicio.` : '';
  return `Última sesión ${cuando} (${fechaCorta(u.f)}), día ${u.dia}. Hoy te toca el <b>día ${diaSugerido()}</b>.${descanso}`;
}
function todaySet(ej,i){
  return S.fuerza.find(x=>x.f===hoy() && x.ej===ej && x.serie===i) || {};
}
function vHoy(){
  const list = PLAN[dia];
  let h = `<h2>Sesión de hoy</h2>
  <p class="lede">Elige el día, abre cada ejercicio para ver la técnica y anota tus series. Se va guardando solo mientras escribes; al terminar, aprieta <b>Guardar sesión</b> abajo y ahí ves qué quedó registrado.</p>
  <div class="aviso-dia">${avisoDelDia()}</div>
  <div class="days">`;
  const hechos = diasHechosSemana();
  DAYS.forEach(d=>{
    const ok = hechos.has(d.id);
    h+=`<button class="day${ok?' hecho':''}" data-day="${d.id}" aria-pressed="${dia===d.id}">
      <b>Día ${d.id} · ${d.name}${ok?' ✓':''}</b><small>${d.sub}</small></button>`;
  });
  h+=`</div>`;

  list.forEach((e,idx)=>{
    const drawn = frames(e.d);
    const nSets = e.s||1;
    let done=0;
    for(let i=1;i<=nSets;i++){ if(nz(todaySet(e.n,i).reps)>0) done++; }
    h+=`<article class="ex${done===nSets?' done':''}" data-open="0" data-ex="${idx}">
      <button class="ex-head" data-toggle="${idx}">
        <span class="ex-idx">${e.cardio?'CAR':String(idx+1).padStart(2,'0')}</span>
        <span class="ex-name">${e.n}<em>${e.s>1?e.s+' series · ':''}${e.r}${e.rir!==undefined?' · RIR '+e.rir:''}${e.rest&&e.rest!=='—'?' · '+e.rest:''}</em></span>
        <span class="chev">▸</span>
      </button>
      <div class="ex-body">`;
    if(drawn){
      h+= drawn.length===1

  h+=`<div class="guardar">

  </div>`;
  h+=`<div class="note"><b>Progresión.</b> Cuando completes el rango alto de repeticiones en todas las series con RIR 2, sube 2,5 a 5 kg la próxima sesión y vuelve al rango bajo. Cada 6 semanas, una semana de descarga con la mitad de las series.</div>`;
  h+=`<div class="note"><b>Cuando ya no puedas sumar peso.</b> Tienes 90 kg en total, así que en hip thrust y peso muerto vas a topar mucho antes que en el resto: ahí el peso deja de ser la palanca. Cuando pase, en este orden — <b>1)</b> sube al tope del rango de repeticiones; <b>2)</b> baja en 4 segundos y haz 2 de pausa en el punto difícil; <b>3)</b> alarga el recorrido: peso muerto y rumano parado sobre un disco, con la barra partiendo más abajo; <b>4)</b> pásalo a una pierna, que con el mismo peso vuelve a ser duro. Recién después de eso, más series.</div>`;
  return h;
}

let filaMedidas = null;
function vMedidas(){

  const hallada = S.medidas.find(x=>semanaDe(x.f)===sem);

  const m = hallada || {};

      <div class="stat"><b>${dP}</b><small>Δ peso vs semana anterior</small></div>

  if(S.medidas.length){
    h+=`<h2>Historial</h2><div class="scroll"><table class="tbl"><thead><tr>
      <th>Sem</th><th>Fecha</th><th>Peso</th><th>Cintura</th><th>Pecho</th><th>Brazo</th></tr></thead><tbody>`;

/* ---------- RESUMEN ---------- */
function weekAgg(w){
  const f=S.fuerza.filter(x=>semanaDe(x.f)===w);
  const vol=f.reduce((a,x)=>a+nz(x.kg)*nz(x.reps),0);
  const ses=new Set(f.filter(x=>nz(x.reps)>0).map(x=>x.f)).size;
  const c=S.cardio.filter(x=>semanaDe(x.f)===w);
  const min=c.reduce((a,x)=>a+nz(x.min),0);
  const co=S.comida.filter(x=>semanaDe(x.f)===w && nz(x.kcal)>0);
  const avg=(k)=>co.length?Math.round(co.reduce((a,x)=>a+nz(x[k]),0)/co.length):null;
  const m=S.medidas.find(x=>semanaDe(x.f)===w);
  return {w,ses,vol:Math.round(vol),min,dias:co.length,
          kcal:avg('kcal'),p:avg('p'),c:avg('c'),g:avg('g'),
          adh:co.length?(co.reduce((a,x)=>a+nz(x.adh),0)/co.length).toFixed(1):null,
          peso:m?m.peso:null, cint:m?m.cint:null};
}
function vResumen(){
  const weeks=[...new Set([...S.fuerza,...S.cardio,...S.comida,...S.medidas]
    .map(x=>semanaDe(x.f)).concat([semanaHoy()]))].filter(x=>x).sort((a,b)=>a-b);
  const rows=weeks.map(weekAgg);
  let h=`<h2>Resumen semanal</h2>
  <p class="lede">Se arma solo con lo que vas cargando. Exporta al final de cada semana y pásame el texto para ajustar el plan.</p>
  <div class="scroll"><table class="tbl"><thead><tr>
    <th>Sem</th><th>Ses.</th><th>Volumen kg</th><th>Cardio min</th><th>Días com.</th>
    <th>Kcal/día</th><th>Prot/día</th><th>Adher.</th><th>Peso</th><th>Cintura</th>
  </tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const p=rows[i-1];
    const dp=(p&&r.peso&&p.peso)?(r.peso-p.peso).toFixed(1):'';
    const dc=(p&&r.cint&&p.cint)?(r.cint-p.cint).toFixed(1):'';
    h+=`<tr><td>${r.w}</td><td>${r.ses||''}</td><td>${r.vol||''}</td><td>${r.min||''}</td>
      <td>${r.dias||''}</td><td>${r.kcal??''}</td><td>${r.p??''}</td><td>${r.adh??''}</td>
      <td>${r.peso??''}${dp?` <small>(${dp>0?'+':''}${dp})</small>`:''}</td>
      <td>${r.cint??''}${dc?` <small>(${dc>0?'+':''}${dc})</small>`:''}</td></tr>`;
  });
  h+=`</tbody></table></div>`;

  /* La lectura mira la última semana CON DATOS y la compara con la anterior
     que también los tenga. Antes miraba rows[rows.length-1], que es la semana
     en curso y está vacía recién empezada: el diagnóstico decía "sin alertas"
     pasara lo que pasara. */
  const t=targets();
  const conDatos = rows.filter(r=>r.ses>0 || r.dias>0 || r.peso!=null);
  const last = conDatos[conDatos.length-1];
  const prev = conDatos[conDatos.length-2];
  if(last){
    let diag=[];
    if(last.p!==null && last.p < t.p*0.9) diag.push(['bad','Proteína bajo el objetivo. Es el problema número uno: sin ella, el déficit se come el músculo.']);
    if(last.adh!==null && +last.adh<3) diag.push(['warn','Adherencia baja. Antes de exigirte más, hay que simplificar el plan.']);
    if(prev){
      if(last.peso&&prev.peso&&(prev.peso-last.peso)>1) diag.push(['warn','Bajaste más de 1 kg esta semana. Demasiado rápido: sube unas 250 kcal.']);
      if(last.vol&&prev.vol&&last.vol<prev.vol*0.95) diag.push(['warn','El volumen de fuerza cayó. Suele ser déficit muy agresivo o poco sueño.']);
      if(last.peso&&prev.peso&&Math.abs(last.peso-prev.peso)<0.2&&last.cint&&prev.cint&&last.cint<prev.cint) diag.push(['ok','Peso estable y cintura bajando: estás en plena recomposición. No cambies nada.']);
    }
    if(!diag.length) diag.push(['ok','Sin alertas con los datos cargados. Sigue así y revisamos en una semana.']);
    h+=`<h2>Lectura — semana ${last.w}</h2><div class="card">`;
    diag.forEach(d=>h+=`<p style="margin:0 0 10px"><span class="pill ${d[0]==='ok'?'':d[0]}">${d[0]==='ok'?'Bien':d[0]==='warn'?'Ojo':'Corregir'}</span> ${d[1]}</p>`);
    h+=`</div>`;
  }

  h+=`<h2>Exportar</h2>
  <p class="lede">Copia este texto y pégamelo en el chat para que analicemos la semana y ajustemos cargas y calorías.</p>
  <div class="card">
    <button class="act" id="btnExp">Generar resumen</button>
    <button class="act ghost" id="btnJson" style="margin-left:8px">Datos completos (JSON)</button>
    <textarea id="expOut" rows="10" class="hide" style="margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:12px"></textarea>
  </div>
  <h2>Restaurar</h2>
  <p class="lede">Si cambiaste de teléfono o se borraron los datos del navegador, pega acá el respaldo JSON que guardaste antes.</p>
  <div class="card">
    <button class="act ghost" id="btnImp">Restaurar respaldo</button>
    <div id="impBox" class="hide" style="margin-top:12px">
      <textarea id="impIn" rows="6" placeholder="Pega aquí el JSON del respaldo" style="font-family:'IBM Plex Mono',monospace;font-size:12px"></textarea>
      <button class="act" id="btnImpGo" style="margin-top:8px">Cargar estos datos</button>
    </div>
  </div>`;
  return h;
}
function expText(){
  const t=targets();
  const weeks=[...new Set([...S.fuerza,...S.cardio,...S.comida].map(x=>semanaDe(x.f)))].sort((a,b)=>a-b);
  let o=`RESUMEN DE ENTRENAMIENTO\n`;
  o+=`Perfil: ${S.cfg.alt} cm · ${pesoActual()} kg · ${S.cfg.edad} años\n`;
  o+=`Objetivos: ${t.kcal} kcal / ${t.p} g prot / ${t.ch} g carb / ${t.g} g grasa\n\n`;
  weeks.forEach(w=>{
    const r=weekAgg(w);
    o+=`--- SEMANA ${w} ---\n`;
    o+=`Sesiones: ${r.ses} · Volumen: ${r.vol} kg · Cardio: ${r.min} min\n`;
    o+=`Nutrición (${r.dias} días): ${r.kcal??'-'} kcal · ${r.p??'-'} g prot · ${r.c??'-'} g carb · ${r.g??'-'} g grasa · adherencia ${r.adh??'-'}\n`;
    o+=`Peso: ${r.peso??'-'} kg · Cintura: ${r.cint??'-'} cm\n`;
    const ejs=[...new Set(S.fuerza.filter(x=>semanaDe(x.f)===w&&nz(x.reps)>0).map(x=>x.ej))];
    ejs.forEach(e=>{
      const st=S.fuerza.filter(x=>semanaDe(x.f)===w&&x.ej===e&&nz(x.reps)>0);
      o+=`  ${e}: ${st.map(x=>`${x.kg||0}×${x.reps}${x.rir!==''&&x.rir!==undefined?'@'+x.rir:''}`).join(', ')}\n`;
    });
    o+=`\n`;
  });
  return o;
}

        <option value="1.375" ${c.act==1.375?'selected':''}>Ligera (3 días)</option>
        <option value="1.55" ${c.act==1.55?'selected':''}>Activa (4-5 días)</option>
        <option value="1.725" ${c.act==1.725?'selected':''}>Muy activa (6 días)</option></select></div>
      <div><label>Déficit</label><select data-cfg="def">
        <option value="0.1" ${c.def==0.1?'selected':''}>10 % suave</option>
        <option value="0.17" ${c.def==0.17?'selected':''}>17 % recomendado</option>
        <option value="0.25" ${c.def==0.25?'selected':''}>25 % agresivo</option></select></div>
      <div><label>Proteína g/kg</label><input type="number" step="0.1" data-cfg="prot" value="${c.prot}"></div>
      <div><label>Grasa g/kg</label><input type="number" step="0.05" data-cfg="gr" value="${c.gr}"></div>
      <div><label>Primer día del plan</label><input type="date" data-inicio="1" value="${c.inicio||''}"></div>
    </div>
    <p class="lede" style="margin:12px 0 0" id="pesoSemana">${pesoSemanaTxt()}</p>
  </div>
  <div class="card grid g3" id="statsAjustes">${statsAjustesHTML()}</div>
  <div class="note">Entre 0,4 y 0,8 kg por semana es la zona correcta. Más rápido que eso y una parte de lo que pierdes es músculo, justo lo que estamos tratando de construir.</div>
  <h2>Datos</h2>
  <div class="card">
    <button class="act ghost" id="btnReset">Borrar todos mis registros</button>
    <p class="lede" style="margin:10px 0 0">Elimina entrenamientos, comidas y medidas de este dispositivo. No se puede deshacer.</p>
  </div>`;
}

/* ============================================================
   4b. REFRESCOS EN EL SITIO
   ------------------------------------------------------------
   No se puede llamar a render() mientras alguien está escribiendo:
   rehacer el HTML destruye el campo, se pierde el foco y el número
   queda a medias (escribir 2380 kcal terminaba guardando 32, y 89,4
   de peso terminaba en 8 kg). Estas funciones actualizan solo lo
   que depende del dato, sin tocar los campos.
   ============================================================ */
function refrescarCabecera(){
  const t=targets();
  document.getElementById('hdrTargets').textContent =
    `${t.kcal} kcal · ${t.p} g proteína · semana ${semanaHoy()}`;
}
function refrescarComida(){
  const lk=document.getElementById('lblKcal'); if(!lk) return;
  const t=targets();
  const d=S.comida.find(x=>x.f===hoy())||{};
  const pct=(v,o)=>Math.min(100,Math.round(nz(v)/o*100));
  const objKcal = d.tipo==='Alto'?t.alto : d.tipo==='Bajo'?t.bajo : t.kcal;
  lk.textContent = `Calorías · objetivo ${objKcal}`;
  const bk=document.getElementById('barKcal');
  bk.style.width = pct(d.kcal,objKcal)+'%';
  bk.className = nz(d.kcal)>objKcal*1.05?'over':'';
  document.getElementById('lblProt').textContent = `Proteína · objetivo ${t.p} g`;
  document.getElementById('barProt').style.width = pct(d.p,t.p)+'%';
}
function refrescarAjustes(){
  const c=document.getElementById('statsAjustes');
  if(c) c.innerHTML = statsAjustesHTML();
  const p=document.getElementById('pesoSemana');
  if(p) p.innerHTML = pesoSemanaTxt();
  refrescarCabecera();
}
/* Qué hay anotado HOY en el día que está abierto. Cuenta solo lo que tiene
   repeticiones (o minutos): un peso escrito sin reps todavía no es una serie. */
function resumenSesion(){
  const f = hoy();
  const nombres = new Set(PLAN[dia].map(e=>e.n));
  const series = S.fuerza.filter(x=>x.f===f && nombres.has(x.ej) && nz(x.reps)>0);
  const cardio = S.cardio.filter(x=>x.f===f && nombres.has(x.tipo) && nz(x.min)>0);
  return {series:series.length, ejercicios:new Set(series.map(x=>x.ej)).size,
          cardio:cardio.reduce((a,x)=>a+nz(x.min),0)};
}
function textoGuardado(){
  const r = resumenSesion();
  if(!r.series && !r.cardio) return `Día ${dia} · nada anotado todavía`;
  const partes = [];
  if(r.series) partes.push(`${r.series} serie${r.series===1?'':'s'} en ${r.ejercicios} ejercicio${r.ejercicios===1?'':'s'}`);
  if(r.cardio) partes.push(`${r.cardio} min de cardio`);
  return `${saveT?'Guardando…':'Guardado ✓'} Día ${dia} · ${partes.join(' · ')}`;
}
function refrescarGuardado(){
  const el=document.getElementById('gStat');
  if(el) el.textContent = textoGuardado();
}

/* ============================================================
   5. EVENTOS
   ============================================================ */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(b.dataset.day){ dia=b.dataset.day; render(); return; }
  if(b.dataset.toggle!==undefined){
    const a=b.closest('.ex'); a.dataset.open = a.dataset.open==='1'?'0':'1'; return;
  }
  if(b.id==='btnExp'){ const o=document.getElementById('expOut');
    o.value=expText(); o.classList.remove('hide'); o.select(); toast('Listo — copia y pégalo en el chat'); return; }
  if(b.id==='btnJson'){ const o=document.getElementById('expOut');
    o.value=JSON.stringify(S); o.classList.remove('hide'); o.select(); toast('Copia de seguridad completa'); return; }
  if(b.id==='btnImp'){ document.getElementById('impBox').classList.toggle('hide');
    document.getElementById('impIn').focus(); return; }
  if(b.id==='btnImpGo'){ importar(); return; }
  if(b.id==='btnReset'){
    if(confirm('¿Borrar todos los registros? No se puede deshacer.')){
      S=Object.assign(JSON.parse(JSON.stringify(DEF)),{cfg:S.cfg}); save(); render(); toast('Registros borrados');
    } return;
  }
  if(b.dataset.rest){ iniciarDescanso(+b.dataset.rest, b.dataset.restej); return; }
  if(b.dataset.hist!==undefined){
    const caja = b.closest('.ex').querySelector(`[data-histbox="${b.dataset.hist}"]`);
    const abierta = !caja.classList.contains('hide');
    if(abierta){ caja.classList.add('hide'); b.textContent='Historial'; return; }
    /* se arma al abrirla para que muestre lo de recién, no lo del render */
    caja.innerHTML = historialHTML(PLAN[dia][+b.dataset.hist].n);
    caja.classList.remove('hide'); b.textContent='Ocultar historial';
    return;
  }
  if(b.id==='btnCrono30'){ cronoFin += 30000; cronoAviso=false;
    document.getElementById('crono').classList.remove('listo');
    if(!cronoTick) cronoTick=setInterval(pintarCrono,250);
    pintarCrono(); return; }
  if(b.id==='btnCronoX'){ cerrarDescanso(); return; }
  if(b.id==='btnGuardar'){
    saveNow();                       /* sin esperar los 600 ms del guardado automático */
    const r=resumenSesion();
    toast(r.series||r.cardio
      ? `Día ${dia} guardado — ${r.series} serie${r.series===1?'':'s'}`
      : 'Todavía no hay nada anotado para guardar');
    return;
  }
  if(b.id==='btnUpd'){ aplicarActualizacion(); return; }
});

/* ---- restaurar respaldo ---- */
function importar(){
  const txt = document.getElementById('impIn').value.trim();
  if(!txt){ toast('Pega primero el JSON del respaldo'); return; }
  let d;
  try{ d = JSON.parse(txt); }
  catch(e){ toast('Eso no es un JSON válido — cópialo completo'); return; }
  const listas = ['fuerza','cardio','comida','medidas'];
  if(!d || typeof d!=='object' || Array.isArray(d) || !listas.some(k=>Array.isArray(d[k]))){
    toast('El respaldo no tiene la forma esperada'); return;
  }
  const n = listas.reduce((a,k)=>a+(Array.isArray(d[k])?d[k].length:0),0);
  const tengo = listas.reduce((a,k)=>a+S[k].length,0);
  const aviso = `Vas a cargar ${n} registro${n===1?'':'s'} (${listas.map(k=>`${Array.isArray(d[k])?d[k].length:0} ${k}`).join(', ')}).`
    + (tengo ? `\n\nEsto REEMPLAZA ${tengo===1?'el registro':'los '+tengo+' registros'} que tienes ahora. No se puede deshacer.` : '')
    + '\n\n¿Continuar?';
  if(!confirm(aviso)) return;
  const base = JSON.parse(JSON.stringify(DEF));
  S = Object.assign(base, d);
  listas.forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
  S.cfg = Object.assign(JSON.parse(JSON.stringify(DEF.cfg)), d.cfg||{});
  S.semana = +d.semana || 1;
  if(isNaN(fechaMs(S.cfg.inicio))){
    /* respaldo viejo, sin fecha de inicio: se toma el registro más antiguo */
    const fechas = [...S.fuerza,...S.cardio,...S.comida,...S.medidas]
      .map(x=>x.f).filter(f=>!isNaN(fechaMs(f))).sort();
    S.cfg.inicio = fechas[0] || hoy();
  }
  saveNow(); render(); toast(`Restaurados ${n} registros`);
}

document.addEventListener('input',e=>{
  const el=e.target; const v=el.value;
  if(el.dataset.ej){
    const {ej,s,fld}=el.dataset;
    let row=S.fuerza.find(x=>x.f===hoy()&&x.ej===ej&&x.serie===+s);
    if(!row){ row={f:hoy(),sem:semanaHoy(),dia,ej,serie:+s,kg:'',reps:'',rir:''}; S.fuerza.push(row); }
    row[fld]=v; row.sem=semanaHoy(); save();
    const art=el.closest('.ex');
    const total=art.querySelectorAll('table.sets tbody tr').length;
    let done=0; art.querySelectorAll('input[data-fld=reps]').forEach(i=>{if(nz(i.value)>0)done++});
    art.classList.toggle('done',done===total);
    refrescarGuardado();
    return;
  }
  if(el.dataset.car){
    const tipo=el.dataset.car, fld=el.dataset.fld;
    let row=S.cardio.find(x=>x.f===hoy()&&x.tipo===tipo);
    if(!row){ row={f:hoy(),sem:semanaHoy(),tipo,min:'',int:'',kcal:''}; S.cardio.push(row); }
    row[fld]=v; row.sem=semanaHoy(); save(); refrescarGuardado(); return;
  }
  if(el.dataset.com){
    let row=S.comida.find(x=>x.f===hoy());
    if(!row){ row={f:hoy(),sem:semanaHoy()}; S.comida.push(row); }
    row[el.dataset.com]=v; row.sem=semanaHoy(); save();
    if(['kcal','p','tipo'].includes(el.dataset.com)) refrescarComida();
    return;
  }
  if(el.dataset.med){
    let row=filaMedidas;
    if(!row){ row={sem:semanaHoy(),f:hoy()}; S.medidas.push(row); filaMedidas=row; }
    const k=el.dataset.med;
    row[k]= k==='f'? v : (v===''?'':+v);
    row.sem = semanaDe(row.f);
    save();
    if(k==='peso') refrescarCabecera();   /* el peso mueve kcal y proteína */
    return;
  }
  if(el.dataset.cfg){
    if(v==='') return;              /* campo a medio borrar: no se guarda un 0 */
    S.cfg[el.dataset.cfg]=+v; save(); refrescarAjustes(); return;
  }
  if(el.dataset.inicio){
    if(isNaN(fechaMs(v))) return;      /* fecha a medio escribir: no se guarda */
    S.cfg.inicio = v; save(); refrescarAjustes(); return;
  }
});

/* ============================================================
   9. SERVICE WORKER — instalación offline y actualizaciones
   ============================================================ */
let swEnEspera = null;

function mostrarActualizacion(w){
  swEnEspera = w;
  document.getElementById('upd').classList.add('on');
}
function aplicarActualizacion(){
  const b = document.getElementById('btnUpd');
  b.textContent = 'Actualizando…'; b.disabled = true;
  if(swEnEspera) swEnEspera.postMessage({type:'SKIP_WAITING'});
  else location.reload();
}

async function registrarSW(){
  if(!('serviceWorker' in navigator)) return;
  /* si ya había un controlador, un cambio de controlador significa versión nueva.
     En la primera instalación no lo hay, y ahí NO hay que recargar. */
  const habiaControlador = !!navigator.serviceWorker.controller;
  try{
    const reg = await navigator.serviceWorker.register('sw.js');

    if(reg.waiting && habiaControlador) mostrarActualizacion(reg.waiting);

    reg.addEventListener('updatefound', ()=>{
      const nuevo = reg.installing; if(!nuevo) return;
      nuevo.addEventListener('statechange', ()=>{
        if(nuevo.state === 'installed' && navigator.serviceWorker.controller){
          mostrarActualizacion(nuevo);
        }
      });
    });

    let recargando = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(!habiaControlador || recargando) return;
      recargando = true; location.reload();
    });

    /* busca versión nueva al volver a la app, como mucho una vez cada 5 minutos */
    let ultima = Date.now();
    const buscar = ()=>{
      if(document.visibilityState !== 'visible') return;
      if(Date.now() - ultima < 5*60*1000) return;
      ultima = Date.now(); reg.update().catch(()=>{});
    };
    document.addEventListener('visibilitychange', buscar);
    setInterval(buscar, 30*60*1000);
  }catch(e){ /* sin service worker la app funciona igual, solo que sin modo sin conexión */ }
}

(async function init(){ await load(); dia = diaSugerido(); render(); registrarSW(); })();
</script>
