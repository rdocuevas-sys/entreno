/* Fecha LOCAL, no UTC. Con toISOString() todo lo anotado después de las 20:00
   en Chile quedaba con la fecha del día siguiente, y al entrenar al otro día
   se sobreescribía la sesión de la noche anterior. */
const hoy = ()=>{
  const d = new Date();
  const dos = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${dos(d.getMonth()+1)}-${dos(d.getDate())}`;
};
const nz = v => (v===''||v===null||v===undefined||isNaN(v))?0:+v;

/* Sumar días sobre la FECHA, no sobre los milisegundos. Chile cambia la hora en
   septiembre: restar 7×86.400.000 ms cruzando ese domingo corre el borde una
   hora y deja fuera (o mete de más) el registro de un día entero. */
const masDias = (f,n)=>{
  const p=String(f).split('-');
  const d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n);
  const dos=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${dos(d.getMonth()+1)}-${dos(d.getDate())}`;
};

/* ---- la semana sale de la fecha, no de un número que hay que acordarse de subir ----
   Antes cada registro se estampaba con el número que estuviera puesto en Ajustes.
   El día que se te olvidaba subirlo, dos semanas de entrenamiento caían en la misma
   fila del Resumen (volumen duplicado, la Lectura comparando contra la semana
   equivocada) y las medidas del lunes siguiente sobreescribían las del anterior,
   porque solo cabe una fila por semana. Ahora la semana se calcula desde la fecha
   de cada registro y el número guardado ya no se lee. */
const fechaMs = f => { const p=String(f||'').split('-');
  return p.length===3 ? new Date(+p[0],+p[1]-1,+p[2]).getTime() : NaN; };  /* local, nunca UTC */
function lunesDe(ms){
  const d=new Date(ms); const dow=(d.getDay()+6)%7;   /* 0 = lunes */
  d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); return d.getTime();
}
/* La semana del plan corre de lunes a domingo: si empezaste un miércoles, esa
   semana sigue siendo la 1 y la 2 parte el lunes siguiente. */
function semanaDe(f){
  const a=fechaMs(S.cfg.inicio), b=fechaMs(f);
  if(isNaN(a)||isNaN(b)) return nz(S.semana)||1;
  return Math.max(1, Math.round((lunesDe(b)-lunesDe(a))/604800000)+1);
}
const semanaHoy = () => semanaDe(hoy());

/* ---- un solo peso ----
   El de Ajustes movía los objetivos de calorías y proteína; el de Medidas era el
   semanal. Anotar el peso donde corresponde no recalculaba nada y terminabas
   comiendo para un peso viejo. Manda la última medición; el de Ajustes queda
   como punto de partida mientras no hayas medido. */
function pesoMedido(){
  const con = S.medidas.filter(x=>nz(x.peso)>0 && fechaMs(x.f));
  if(!con.length) return null;
  return con.slice().sort((a,b)=>fechaMs(a.f)-fechaMs(b.f)).pop();
}
/* Media de los pesajes en [desde, hasta). Las fechas son ISO, así que se
   comparan como texto y no hay que volver a pasar por milisegundos. */
function mediaPeso(desde, hasta){
  const v = S.medidas.filter(x=>nz(x.peso)>0 && fechaMs(x.f) && x.f>=desde && x.f<hasta)
                     .map(x=>nz(x.peso));
  return v.length ? {media:+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2), n:v.length} : null;
}
/* ---- la tendencia, no el número del día ----
   Pesándose a diario, "hoy contra ayer" es agua: un kilo entre dos mañanas
   seguidas es normal y no significa nada. Lo que se compara es la MEDIA de los
   últimos 7 días contra la de los 7 anteriores. La ventana termina en el último
   pesaje y no en hoy, para que no se vacíe si pasa unos días sin pesarse. */
function tendenciaPeso(){
  const u = pesoMedido(); if(!u) return null;
  const fin = masDias(u.f, 1);
  const a = mediaPeso(masDias(fin,-7), fin);
  const b = mediaPeso(masDias(fin,-14), masDias(fin,-7));
  return {hasta:u.f, ult:nz(u.peso), a, b,
          dif:(a&&b)? +(a.media-b.media).toFixed(2) : null};
}
/* Para calorías y proteína manda la MEDIA de la semana, no el último pesaje:
   con pesaje diario el objetivo saltaría 30 kcal de un día para otro por el
   agua de anoche. */
function pesoActual(){
  const t = tendenciaPeso();
  if(!t) return nz(S.cfg.peso);
  return t.a ? t.a.media : t.ult;
}
/* ---- lo que muestra cada semana del Resumen ----
   Con varios registros por semana ya no vale "el primero que aparezca". El peso
   es la MEDIA de los pesajes de esa semana; las cintas, el último valor anotado
   de cada una por separado, porque te pesas a diario pero te mides el lunes. */
function medidaSemana(w){
  const rs = S.medidas.filter(x=>fechaMs(x.f) && semanaDe(x.f)===w)
                      .sort((a,b)=>fechaMs(a.f)-fechaMs(b.f));
  const ps = rs.filter(x=>nz(x.peso)>0).map(x=>nz(x.peso));
  const out = {peso: ps.length ? +(ps.reduce((a,b)=>a+b,0)/ps.length).toFixed(2) : null,
               pesajes: ps.length};
  ['cint','cintE','cad','pecho','brazo','muslo'].forEach(k=>{
    out[k]=null;
    for(let i=rs.length-1;i>=0;i--) if(nz(rs[i][k])>0){ out[k]=nz(rs[i][k]); break; }
  });
  return out;
}

/* ---- objetivos calculados ---- */
function targets(){
  const c=S.cfg, peso=pesoActual();
  const tmb = 10*peso + 6.25*c.alt - 5*c.edad + (c.sexo==1?5:-161);
  const tdee = tmb*c.act;
  const kcal = Math.round(tdee*(1-c.def));
  const p = Math.round(peso*c.prot);
  const g = Math.round(peso*c.gr);
  const ch = Math.round((kcal - p*4 - g*9)/4);
  return {tmb:Math.round(tmb),tdee:Math.round(tdee),kcal,p,g,ch,
          alto:Math.round(kcal*1.12), bajo:Math.round(kcal*0.85),
          perdida:((tdee-kcal)*7/7700).toFixed(2)};
}

const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fechaCorta = f => { const p=String(f).split('-'); return `${+p[2]}-${MESES[+p[1]-1]}`; };
const coma = n => String(n).replace('.',',');
const un = n => (n===null||n===undefined||n==='')?n:+(+n).toFixed(1);   /* un decimal para leer */

/* ============================================================
   3b. CRONÓMETRO DE DESCANSO
   ------------------------------------------------------------
   Cuenta contra una hora de término, no restando de a un segundo:
   el navegador frena los temporizadores cuando la app queda en
   segundo plano, y un contador que resta se atrasaría justo
   mientras descansas con el teléfono guardado.
   ============================================================ */
let cronoFin=0, cronoTick=null, cronoEj='', cronoAviso=false, cronoModo='descanso';

/* '2-3 min' descansa 2 min: el rango bajo ya alcanza, y si quieres más
   está el +30 s. '45 s' son 45 segundos. '—' no lleva cronómetro. */
function segsDescanso(txt){
  if(!txt || txt==='—') return 0;
  const m = String(txt).match(/\d+/);
  if(!m) return 0;
  return /min/.test(txt) ? +m[0]*60 : +m[0];
}
/* Los ejercicios de aguante prescriben TIEMPO, no repeticiones ('45-60 s',
   '30 s x lado'): ahí el cronómetro tiene que medir la serie, no el descanso.
   Se toma el extremo bajo del rango, igual que en el descanso; para pasarse
   está el +30 s. */
function segsAguante(r){
  if(!r) return 0;
  const t = String(r);
  if(!/\bs\b|segundo/.test(t)) return 0;
  const m = t.match(/\d+/);
  return m ? +m[0] : 0;
}
const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

/* ---- alarma audible ----
   El aviso era solo vibración, y con el teléfono en el suelo o con la
   vibración apagada no se nota — que es justo lo que pasó aguantando una
   plancha. El AudioContext se crea DENTRO del click que arranca el
   cronómetro: los navegadores móviles no dejan sonar audio que no venga de
   un gesto del usuario, así que crearlo al cargar la página no serviría. */
let audioCtx = null;
function prepararAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!audioCtx && AC) audioCtx = new AC();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){ audioCtx = null; }   /* sin audio la vibración sigue avisando */
}
function pitido(veces){
  if(!audioCtx) return;
  try{
    const t0 = audioCtx.currentTime;
    for(let i=0;i<(veces||3);i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t = t0 + i*0.3;
      o.type = 'sine'; o.frequency.setValueAtTime(880, t);
      /* Rampa en vez de encender y apagar de golpe: un gain que salta de 0 a
         1 suena como un chasquido, no como un pitido. */
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.4, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+0.24);
    }
  }catch(e){}
}

function iniciarCrono(segs, ej, modo){
  cronoFin = Date.now() + segs*1000;
  cronoEj = ej||''; cronoAviso = false; cronoModo = modo||'descanso';
  const c=document.getElementById('crono');
  c.classList.add('on'); c.classList.remove('listo');
  document.getElementById('upd').classList.add('subido');
  pintarCrono();
  clearInterval(cronoTick);
  cronoTick = setInterval(pintarCrono, 250);
}
function pintarCrono(){
  const restan = Math.round((cronoFin - Date.now())/1000);
  const c=document.getElementById('crono');
  document.getElementById('cronoT').textContent = mmss(Math.max(0,restan));
  const serie = cronoModo==='serie';
  if(restan>0){
    document.getElementById('cronoE').textContent =
      (serie?'Aguanta':'Descanso') + (cronoEj?` · ${cronoEj}`:'');
    return;
  }
  document.getElementById('cronoE').textContent = serie
    ? 'Se acabó la serie — suelta y descansa'
    : 'Listo — va la siguiente serie';
  c.classList.add('listo');
  if(!cronoAviso){
    cronoAviso = true;
    pitido(serie?4:3);
    if(navigator.vibrate) navigator.vibrate([220,120,220,120,220]);
  }
  if(restan < -25) cerrarDescanso();   /* no se queda tapando la pantalla */
}
function cerrarDescanso(){
  clearInterval(cronoTick); cronoTick=null;
  document.getElementById('crono').classList.remove('on','listo');
  document.getElementById('upd').classList.remove('subido');
}

/* ============================================================
   3c. QUÉ PESO TOCA HOY, Y CÓMO VIENE EL EJERCICIO
   ============================================================ */
/* Tope de repeticiones del rango prescrito. Devuelve null cuando el rango no
   se mide en repeticiones (planchas, "al fallo"): ahí no hay peso que sugerir. */
function topeReps(r){
  if(!r || /fallo/i.test(r) || /\bs\b|min/.test(r)) return null;
  const nums = String(r).match(/\d+/g);
  if(!nums) return null;
  return +nums[nums.length>1?1:0];
}
/* La regla del propio plan: si en TODAS las series llegaste al tope del rango
   con el RIR pedido o menos, sube un escalón; si no, repites el mismo peso.
   Sin sesiones anteriores no sugiere nada — no se inventa un punto de partida. */
/* Cuando no hay peso no se escribe "0×10": en la plancha o en el suelo pélvico
   ese 0 no es un dato, es ruido que hay que aprender a ignorar. */
const serieTxt = x => nz(x.kg)>0 ? `${coma(x.kg)}×${x.reps||0}` : `${x.reps||0}`;
function sugerencia(e){
  const rows = S.fuerza.filter(x=>x.ej===e.n && (nz(x.kg)>0||nz(x.reps)>0));
  if(!rows.length) return null;
  const f = rows[rows.length-1].f;
  if(f===hoy()) return null;                       /* hoy ya lo estás haciendo */
  const ult = rows.filter(x=>x.f===f).sort((a,b)=>a.serie-b.serie);
  const hechas = ult.map(serieTxt).join('  ·  ');
  const tope = topeReps(e.r);
  const kgs = ult.map(x=>nz(x.kg)).filter(k=>k>0);
  if(tope===null || !kgs.length) return {f, hechas, txt:null};
  const kg = Math.max(...kgs);
  const llego = ult.length >= (e.s||1)
    && ult.every(x=>nz(x.reps)>=tope
        && (x.rir===''||x.rir===undefined||nz(x.rir)<=(e.rir===undefined?99:e.rir)));
  /* Con mancuernas no existe el medio kilo: se sube al siguiente par que tengas. */
  const conMancuerna = /mancuerna|goblet/i.test(e.n) || /Elevaciones laterales/i.test(e.n);
  /* La pila de una máquina o una polea sube de a lo que traiga ese modelo
     (2,5, 5 o 7 kg), así que tampoco se le inventa la cifra. */
  const conPila = /máquina|polea|prensa|hack|jalón|contractor|smith|silla romana/i.test(e.n);
  return {f, hechas, sube:llego,
    txt: llego
      ? (conPila ? 'sube un escalón de la pila' : conMancuerna ? 'sube al siguiente escalón de mancuerna' : `sube a ${coma(kg+2.5)} kg`)
      : `repite ${coma(kg)} kg`};
}
/* ============================================================
   3d. GRÁFICOS
   ------------------------------------------------------------
   SVG generado a mano, sin ninguna librería: la app tiene que abrir
   igual sin señal. Un dato por gráfico y con su propia escala —
   meter dos métricas distintas en un mismo lienzo con dos ejes se
   lee mal y termina engañando.
   ============================================================ */
function grafico(puntos, opt){
  opt = opt||{};
  const P = (puntos||[]).filter(p=>!isNaN(fechaMs(p.f)) && nz(p.v)>0)
                        .sort((a,b)=>fechaMs(a.f)-fechaMs(b.f));
  if(P.length<2) return `<div class="graf"><div class="graf-t"><span>${opt.titulo||''}</span></div>
    <p class="prev">${opt.vacio||'Con dos registros o más aparece la curva.'}</p></div>`;
  const W=300, H=94, mL=6, mR=6, mT=12, mB=18;
  const xs=P.map(p=>fechaMs(p.f)), ys=P.map(p=>nz(p.v));
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  /* ---- la línea de objetivo entra en el RANGO ----
     Si el objetivo queda fuera de y0..y1 se dibuja pegado al borde o fuera del
     recuadro, y una referencia que no se ve es peor que ninguna: la curva
     parecería estar sobre el objetivo cuando va muy por debajo. */
  const obj = nz(opt.objetivo)>0 ? nz(opt.objetivo) : null;
  if(obj!==null){ y0=Math.min(y0,obj); y1=Math.max(y1,obj); }
  if(y1===y0){ y0-=1; y1+=1; }                 /* todo igual: no dividir por cero */
  const m=(y1-y0)*0.15; y0-=m; y1+=m;
  const px=v=> mL + (x1===x0?0.5:(v-x0)/(x1-x0))*(W-mL-mR);
  const py=v=> mT + (1-(v-y0)/(y1-y0))*(H-mT-mB);
  const pts=P.map(p=>[px(fechaMs(p.f)), py(nz(p.v))]);
  /* ---- media móvil ----
     Pesándose casi a diario la línea cruda es un serrucho de ±1 kg de agua, y
     lo que hay que poder leer es la tendencia, no el pesaje de esta mañana.
     ⚠La ventana se corre sobre la FECHA (masDias) y NUNCA restando
     milisegundos: el 6 de septiembre Chile cambia la hora y restar
     7×86.400.000 ms cruzando ese domingo corre el borde una hora y deja fuera
     (o mete de más) el registro de un día entero.
     Con menos de 4 pesajes no se dibuja: la media de dos puntos no es una
     tendencia, es la misma línea con otro nombre. */
  const MM = (opt.media && P.length>=4) ? P.map(p=>{
    const desde = masDias(p.f, -(opt.media-1));
    const v = P.filter(q=>q.f>=desde && q.f<=p.f).map(q=>nz(q.v));
    return [px(fechaMs(p.f)), py(v.reduce((a,b)=>a+b,0)/v.length)];
  }) : null;
  const primero=ys[0], ultimo=ys[ys.length-1];
  const dif=+(ultimo-primero).toFixed(1);
  /* ---- qué número va arriba a la derecha ----
     En peso y cintura, cuánto se movió de punta a punta: eso es el progreso.
     En lo que come NO: comparar lo que comió el primer día contra el último
     día no dice nada —salía «0 kcal» con siete días anotados— porque el dato
     de un día es ruido. Ahí va la MEDIA de los últimos días contra el
     objetivo, que es la cifra con la que se decide subir o bajar calorías. */
  const ventana = opt.media || 7;
  const desdeM = masDias(P[P.length-1].f, -(ventana-1));
  const ult = ys.filter((v,i)=>P[i].f>=desdeM);
  const mediaUlt = ult.length ? +(ult.reduce((a,b)=>a+b,0)/ult.length).toFixed(ys.some(v=>v%1)?1:0) : null;
  /* ---- cuándo se colorea la diferencia ----
     En peso y cintura bajar es bueno y subir es malo, y ahí el color informa.
     En calorías no: pasarse y quedarse corto son igual de malos, así que
     pintar «+300 kcal» de rojo o de verde sería mentir. Con `neutro` el
     número se muestra sin juzgarlo y quien juzga es la línea de objetivo. */
  /* la referencia punteada: el objetivo si lo hay, y si no el primer valor */
  const ref = obj!==null ? obj : primero;
  /* sin repetir la unidad: el título ya dice si son calorías o gramos, y con
     ella el encabezado no cabe en 414 px y «kcal» cae solo a la línea de abajo */
  const refTxt = obj!==null ? ` · objetivo ${coma(obj)}` : '';
  let bien, cifra;
  if(obj!==null && mediaUlt!==null){
    cifra = `media ${ventana} d: ${coma(mediaUlt)} ${opt.unidad||''}`;
    /* se marca en rojo solo quedarse corto, y con el MISMO umbral que ya usa
       la Lectura semanal (90 % del objetivo): dos avisos de lo mismo con
       umbrales distintos es peor que uno solo */
    /* el umbral se redondea igual que la cifra que se muestra: 188×0,9 da
       169.20000000000002 en coma flotante, así que una media de 169,2 —el
       umbral clavado— salía marcada en rojo contra el número que la propia
       pantalla estaba mostrando */
    bien = opt.neutro ? null : (mediaUlt >= +(obj*0.9).toFixed(1));
  }else{
    cifra = `${dif>0?'+':''}${coma(dif)} ${opt.unidad||''}`;
    bien = (opt.neutro || dif===0) ? null : (opt.bajarEsBueno ? dif<0 : dif>0);
  }
  return `<div class="graf">
    <div class="graf-t"><span>${opt.titulo||''}${refTxt}</span>
      <span class="graf-d ${bien===null?'':(bien?'bien':'mal')}">${cifra}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.titulo||'evolución'}: de ${coma(primero)} a ${coma(ultimo)}${obj!==null?`, objetivo ${coma(obj)}`:''}">
      <line x1="${mL}" y1="${py(ref).toFixed(1)}" x2="${W-mR}" y2="${py(ref).toFixed(1)}"
            stroke="var(${obj!==null?'--pine-md':'--line'})" stroke-width="1" stroke-dasharray="4 4"/>
      <polyline points="${pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}"
                fill="none" stroke="var(${MM?'--pine-md':'--pine'})" stroke-width="${MM?1.5:2.5}"
                stroke-linecap="round" stroke-linejoin="round"/>
      ${MM?`<polyline points="${MM.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}"
                fill="none" stroke="var(--pine)" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>`:''}
      ${pts.map((p,i)=>{const u=i===pts.length-1;
        /* con pesaje diario los puntos se pisan unos con otros: pasado cierto
           número queda solo la línea y el punto de hoy */
        if(!u && pts.length>20) return '';
        return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${u?4:2.6}"
          fill="${u?'var(--pine)':'#fff'}" stroke="var(${u||!MM?'--pine':'--pine-md'})" stroke-width="2"/>`;}).join('')}
      <text x="${mL}" y="${H-4}" font-size="10" font-family="monospace" fill="var(--slate)">${fechaCorta(P[0].f)} · ${coma(primero)}</text>
      <text x="${W-mR}" y="${H-4}" font-size="10" font-family="monospace" fill="var(--slate)" text-anchor="end">${fechaCorta(P[P.length-1].f)} · ${coma(ultimo)}</text>
    </svg>
    ${MM
      ? `<p class="pieilu" style="margin:1px 0 0">${obj!==null
          ? `Gruesa: la media de ${opt.media} días. Punteada: tu objetivo.`
          : `Línea gruesa: la media de ${opt.media} días, que es la que hay que mirar. La clara y los puntos son cada ${opt.cada||'pesaje'}.`}</p>`
      : (obj!==null?`<p class="pieilu" style="margin:1px 0 0">La punteada es tu objetivo.</p>`:'')}
  </div>`;
}

function historialHTML(ej){
  const rows = S.fuerza.filter(x=>x.ej===ej && (nz(x.kg)>0||nz(x.reps)>0));
  if(!rows.length) return `<p class="prev">Todavía no hay sesiones registradas de este ejercicio.</p>`;
  const porFecha = {};
  rows.forEach(x=>{ (porFecha[x.f]=porFecha[x.f]||[]).push(x); });
  const todas = Object.keys(porFecha).sort();
  /* La curva es el peso máximo de cada sesión. En los de peso corporal no hay
     kilos que graficar, así que ahí no se dibuja nada. */
  const curva = todas.map(f=>({f, v:Math.max(...porFecha[f].map(x=>nz(x.kg)))}));
  const graf = curva.some(p=>p.v>0)
    ? grafico(curva, {titulo:'Peso máximo por sesión', unidad:'kg',
        vacio:'Con dos sesiones aparece la curva de carga.'})
    : '';
  const fechas = todas.slice().reverse().slice(0,8);
  return graf + `<table>${fechas.map(f=>{
    const s = porFecha[f].slice().sort((a,b)=>a.serie-b.serie);
    return `<tr><td>${fechaCorta(f)}</td><td>${s.map(serieTxt).join('  ·  ')}</td></tr>`;
  }).join('')}</table>${fechas.length===8?`<p class="prev">Se muestran las últimas 8 sesiones.</p>`:''}`;
}

/* ---------- ENTRENAR ---------- */
/* Qué día toca. La app abría siempre en el A y había que elegir a mano, sin
   memoria de cuándo entrenaste ni de qué hiciste. */
function ultimaSesion(){
  const con = S.fuerza.filter(x=>nz(x.reps)>0 && x.dia);
  if(!con.length) return null;
  const f = con.map(x=>x.f).sort().pop();
  return {f, dia: con.filter(x=>x.f===f)[0].dia};
}
/* La última sesión de un día de la RUEDA, que no es lo mismo que la última
   sesión a secas: el día F es suelto y entrenarlo no puede correr el turno.
   Si contara, hacer kettlebell un martes te saltaría el día de piernas. */
function ultimaSesionRot(){
  const fijos = new Set(DIAS_ROT.map(d=>d.id));
  const con = S.fuerza.filter(x=>nz(x.reps)>0 && fijos.has(x.dia));
  if(!con.length) return null;
  const f = con.map(x=>x.f).sort().pop();
  return {f, dia: con.filter(x=>x.f===f)[0].dia};
}
function diaSugerido(){
  const u = ultimaSesion();
  if(u && u.f===hoy()) return u.dia;     /* si hoy ya empezaste, quédate en ese */
  const r = ultimaSesionRot();
  if(!r) return 'A';
  const i = DIAS_ROT.findIndex(d=>d.id===r.dia);
  return i<0 ? 'A' : DIAS_ROT[(i+1)%DIAS_ROT.length].id;
}
function diasHechosSemana(){
  const sem = semanaHoy();
  return new Set(S.fuerza.filter(x=>nz(x.reps)>0 && semanaDe(x.f)===sem).map(x=>x.dia));
}
function avisoDelDia(){
  const u = ultimaSesion();
  if(!u) return `Primera sesión. Parte por el <b>día A</b> y la app va aprendiendo tu ritmo.`;
  if(u.f===hoy()) return `Hoy estás en el <b>día ${u.dia}</b>, ya anotado.`;
  const dias = Math.round((fechaMs(hoy())-fechaMs(u.f))/86400000);
  const cuando = dias===1 ? 'ayer' : dias<=0 ? 'recién' : `hace ${dias} días`;
  const descanso = dias>=5 ? ` Llevas ${dias} días sin entrenar: baja un poco la carga en el primer ejercicio.` : '';
  const suelto = esDiaSuelto(u.dia) ? ' (el suelto)' : '';
  return `Última sesión ${cuando} (${fechaCorta(u.f)}), día ${u.dia}${suelto}. Hoy te toca el <b>día ${diaSugerido()}</b>.${descanso}`;
}
function todaySet(ej,i){
  return S.fuerza.find(x=>x.f===hoy() && x.ej===ej && x.serie===i) || {};
}
/* El cardio de hoy se busca por DÍA, no por nombre: el nombre ahora lo elige
   él y cambia. La segunda búsqueda rescata los registros viejos, que se
   guardaron con el nombre prescrito y sin día — al primer cambio se les
   estampa el día y quedan en el modelo nuevo. Se busca en dos pasos a
   propósito: un solo find con un OR devolvería el que aparezca primero en la
   lista, no el del día que estás mirando. */
function filaCardio(){
  return S.cardio.find(x=>x.f===hoy() && x.dia===dia)
      || S.cardio.find(x=>x.f===hoy() && x.dia===undefined && /^CARDIO/.test(String(x.tipo||'')))
      || {};
}
const cardioSugerido = d => ((PLAN[d]||[]).find(e=>e.cardio)||{}).sug || '';
/* Los registros viejos guardaron el nombre PRESCRITO ('CARDIO — remo suave'),
   que no está en la lista de modalidades. Si se lo pasamos tal cual al
   desplegable, el navegador no encuentra esa opción y muestra la PRIMERA: la
   pantalla diría "Trotadora" mientras el registro dice remo. Encontrado
   probándolo, no leyéndolo. */
function modalidadCardio(tipo, sug){
  if(CARDIOS.includes(tipo)) return tipo;
  const t = String(tipo||'').toLowerCase();
  return CARDIOS.find(m=>t.includes(m.toLowerCase())) || sug;
}
function vHoy(){
  /* Red de seguridad: si el día guardado ya no existe en el PLAN, se cae al A
     CORRIGIENDO la variable, no solo la lista — dejar dia con un valor muerto
     haría que los botones, el mapa muscular y el guardado siguieran hablando
     de un día que no está. Hoy no debería dispararse (el F retirado conserva
     su PLAN), y está para el día que se retire otro. */
  if(!PLAN[dia]) dia = 'A';
  const lug = lugar();
  const list = planHoy(dia, lug);
  let h = `<h2>Sesión de hoy</h2>
  <p class="lede">Elige dónde estás y el día, abre cada ejercicio para ver la técnica y anota tus series. Se va guardando solo mientras escribes; al terminar, aprieta <b>Guardar sesión</b> abajo y ahí ves qué quedó registrado.</p>
  <div class="lugar" role="group" aria-label="Dónde entrenas hoy">${LUGARES.map(([id,txt])=>
    `<button class="lug" data-lugar="${id}" aria-pressed="${lug===id}">${txt}</button>`).join('')}</div>
  <div class="aviso-dia">${avisoDelDia()}</div>
  <div class="days">`;
  const hechos = diasHechosSemana();
  /* Los días retirados no se ofrecen, PERO sí se pintan si es el día en el que
     estás parado: si entrenaste el F antes de actualizar, tienes que poder
     terminarlo y ver dónde estás, no quedarte sin ningún botón marcado. */
  DAYS.filter(d=>!d.retirado || d.id===dia).forEach(d=>{
    const ok = hechos.has(d.id);
    h+=`<button class="day${ok?' hecho':''}" data-day="${d.id}" aria-pressed="${dia===d.id}">
      <b>Día ${d.id} · ${d.name}${ok?' ✓':''}</b><small>${d.sub}</small></button>`;
  });
  h+=`</div>`;
  h+= mapaMusDia(dia);

  list.forEach(({casilla, ops, e, por},idx)=>{
    const drawn = frames(e.d);
    const nSets = e.s||1;
    let done=0;
    for(let i=1;i<=nSets;i++){ if(nz(todaySet(e.n,i).reps)>0) done++; }
    h+=`<article class="ex${done===nSets?' done':''}" data-open="0" data-ex="${idx}">
      <button class="ex-head" data-toggle="${idx}">
        <span class="ex-idx">${e.tag||(e.cardio?'CAR':String(idx+1).padStart(2,'0'))}</span>
        <span class="ex-name">${e.n}<em>${((OPC[dia]||{})[casilla.n]||{}).t ? OPC[dia][casilla.n].t+' · ' : ''}${e.s>1?e.s+' series · ':''}${e.r}${e.rir!==undefined?' · RIR '+e.rir:''}${e.rest&&e.rest!=='—'?' · '+e.rest:''}${e.sug?' · sugerido: '+e.sug:''}</em></span>
        <span class="chev">▸</span>
      </button>
      <div class="ex-body">`;
    /* Las opciones para rotar, arriba de todo: lo primero que hay que decidir
       al abrir el ejercicio es CUÁL se hace, antes de mirar su técnica. */
    if(ops.length>1){
      h+=`<div class="opcs" role="group" aria-label="Opciones para esta casilla">${ops.map(o=>{
        const u = ultimaVez(o.n);
        const cuando = !u ? 'nunca' : u===hoy() ? 'hoy'
          : (()=>{ const n=Math.round((fechaMs(hoy())-fechaMs(u))/86400000); return n===1?'ayer':`hace ${n} días`; })();
        return `<button class="opc" data-opc="${idx}" data-opn="${esc(o.n)}" aria-pressed="${o.n===e.n}"><span>${o.n}</span><small>${cuando}</small></button>`;
      }).join('')}</div>`;
      if(por==='rota') h+=`<p class="toca">Te toca esta: es la que llevas más tiempo sin hacer. ${lug==='gym'?'Si la máquina está ocupada, toca otra.':'Si hoy prefieres otra, tócala.'}</p>`;
    }
    if(drawn){
      /* La leyenda (la silueta gris, la flecha, el punto de la cara) explica el
         dibujo de palitos. En una ilustración no hay nada de eso que explicar,
         así que ahí no se muestra. */
      const conImg = hayImg(e.d);
      if(drawn.length===1){
        h+=`<div class="frames one"><figure class="frame${conImg?' ilu':''}">
          <figcaption>${conImg?'La postura':'Posición'}</figcaption>${drawn[0]}</figure></div>`;
      }else if(conImg){
        /* Los cuadros van numerados y nada más: son los tres momentos de un
           recorrido que se repite, y cuál es "el inicio" depende de dónde
           partas, no del dibujo. */
        h+=`<div class="frames tres${imgAncha(e.d)?' apilada':''}">${drawn.map((sv,i)=>
          `<figure class="frame ilu"><figcaption>${i+1}</figcaption>${sv}</figure>`).join('')}</div>
        <p class="pieilu">Tres momentos del recorrido.</p>`;
      }else{
        h+=`<div class="frames">
        <figure class="frame"><figcaption>1 · Inicio</figcaption>${drawn[0]}</figure>
        <figure class="frame"><figcaption>2 · Final</figcaption>${drawn[1]}</figure>
      </div>
      <div class="legend">
        <span><i style="background:#9AA8A2"></i>la otra posición</span>
        <span><i style="background:var(--rust)"></i>recorrido del movimiento</span>
        <span><i style="background:var(--ink);width:6px;height:6px;border-radius:99px"></i>hacia dónde mira</span>
      </div>`;
      }
    }
    /* Tres ejercicios del día F no existen dibujados en la biblioteca. Sin
       este aviso, abrir uno y no encontrar el dibujo se lee como que la app
       falló; con él se lee como lo que es, y el botón de abajo lo resuelve. */
    /* Sin `sinDibujo` explícito también: varias opciones del gym no existen
       en la biblioteca, y abrir una y no encontrar nada se leería como falla. */
    if(!e.cardio && !e.sinPeso && (e.sinDibujo || !drawn)) h+=`<p class="pieilu">Este no tiene dibujo en la biblioteca — míralo en el video de aquí abajo.</p>`;
    h+= mapaMus(e.d);
    h+=`<p class="cue">${e.c}</p>`;
    /* En el cardio la modalidad la eliges tú, así que un video de "a tu
       elección" no lleva a ninguna parte. */
    if(!e.cardio) h+=`<a class="demo" target="_blank" rel="noopener"

    }else{
      /* Hay ejercicios donde no existe el peso ni el RIR (el suelo pélvico es

      h+=`<table class="sets"><thead><tr>
        <th style="width:38px">Serie</th>${e.sinPeso?`<th>Contracciones</th>`:`<th>Peso kg</th><th>Reps</th><th>RIR</th>`}</tr></thead><tbody>`;
      for(let i=1;i<=nSets;i++){

      const segs = segsDescanso(e.rest);

      h+=`<div class="fila-ex">`;

  const ses = S.sesiones.find(x=>x.f===hoy()) || {};
  h+=`<div class="card" style="margin-bottom:12px">

    <div class="grid g3">
      <div><label>Dormiste anoche (h)</label>
        <input type="number" inputmode="decimal" step="0.5" data-ses="sueno" value="${ses.sueno??''}"></div>
      <div><label>Molestia</label><select data-ses="zona">
        ${ZONAS.map(z=>`<option ${(ses.zona||'Ninguna')===z?'selected':''}>${z}</option>`).join('')}

      <div><label>Cuánto</label><select data-ses="dolor">
        ${['—','Leve','Media','Fuerte'].map(z=>`<option ${(ses.dolor||'—')===z?'selected':''}>${z}</option>`).join('')}

  h+=`<div class="guardar">

  </div>`;
  h+=`<div class="note"><b>Progresión.</b> Cuando completes el rango alto de repeticiones en todas las series con RIR 2, sube 2,5 a 5 kg la próxima sesión y vuelve al rango bajo. Cada 6 semanas, una semana de descarga con la mitad de las series.</div>`;
  h+=`<div class="note"><b>Cuando ya no puedas sumar peso.</b> Tienes 90 kg en total, así que en hip thrust y peso muerto vas a topar mucho antes que en el resto: ahí el peso deja de ser la palanca. Cuando pase, en este orden — <b>1)</b> sube al tope del rango de repeticiones; <b>2)</b> baja en 4 segundos y haz 2 de pausa en el punto difícil; <b>3)</b> alarga el recorrido: peso muerto y rumano parado sobre un disco, con la barra partiendo más abajo; <b>4)</b> pásalo a una pierna, que con el mismo peso vuelve a ser duro. Recién después de eso, más series.</div>`;
  return h;
}

/* ============================================================
   3f. LO QUE COMÍ — de texto a números
   ------------------------------------------------------------
   Escribe "2 huevos duros" o "una taza de arroz con un pedazo de
   carne" y esto lo convierte en gramos y macros usando ALIMENTOS.

   Lo que NO reconoce NO se inventa: queda guardado con el texto
   tal cual y marcado como sin estimar, y sale señalado en el
   export para completarlo después. Un cero silencioso sería peor
   que un hueco visible.
   ============================================================ */
/* @parser-inicio — desde acá hasta @parser-fin es el bloque que la suite de
   pruebas extrae y ejecuta fuera del navegador. NO borrar estas dos marcas:
   sin ellas la suite revienta, que es justo lo que tiene que pasar. */

/* Sin tildes, sin ñ y sin puntuación: así "plátano", "platano" y
   "PLÁTANOS" caen en la misma fila de la tabla. */
function normTxt(s){
  return String(s==null?'':s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\/.,+; ]/g,' ')
    .replace(/\s+/g,' ').trim();
}

/* Unidades que valen para CUALQUIER alimento, porque son de peso o de
   volumen y no medidas caseras. El resto sale de `med` de cada fila. */
const MED_GLOBAL = {g:1, kg:1000, ml:1, litro:1000};

/* índice nombre -> alimento, construido una sola vez */
let _IDX = null;
function idxAlimentos(){
  if(_IDX) return _IDX;
  _IDX = [];
  if(typeof ALIMENTOS === 'undefined') return _IDX;
  ALIMENTOS.forEach(a=>{
    const claves = [a.id, a.n].concat(a.alt||[]);
    claves.forEach(k=>{ const t=normTxt(k); if(t) _IDX.push({t, a}); });
  });
  /* de mayor a menor: "mantequilla de mani" tiene que ganarle a "mantequilla",
     o toda crema de maní se registraría como mantequilla */
  _IDX.sort((x,y)=>y.t.length-x.t.length);
  return _IDX;
}

/* singular tosco: solo para comparar, nunca para mostrar */
const sing = t => t.replace(/([a-z]{3,})es\b/g,'$1').replace(/([a-z]{3,})s\b/g,'$1');

/* `estricto` corta el match por CONTENIDO y deja solo el exacto y el plural.
   Sin eso, "una taza de arroz con un pedazo de carne" se daba por reconocida
   entera —porque contiene la palabra "carne"— y el arroz desaparecia. */
function buscarAlimento(txt, estricto){
  const t = normTxt(txt); if(!t) return null;
  const idx = idxAlimentos();
  let hit = idx.find(x=>x.t===t);                          /* exacto */
  if(!hit){ const s=sing(t); hit = idx.find(x=>sing(x.t)===s); }   /* plural */
  if(!hit && !estricto){
    /* contenido, pero solo con palabra completa y claves de 4+ letras:
       si no, "te" caza dentro de "tomate" y todo se vuelve un té */
    hit = idx.find(x=>x.t.length>=4 &&
      new RegExp('(^| )'+x.t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'( |$)').test(t));
    if(!hit){ const s=sing(t); hit = idx.find(x=>x.t.length>=4 &&
      new RegExp('(^| )'+sing(x.t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'( |$)').test(s)); }
  }
  return hit ? hit.a : null;
}

/* medida escrita -> clave de `med` */
let _MED = null;
function idxMedidas(){
  if(_MED) return _MED;
  _MED = {};
  if(typeof MEDIDAS !== 'undefined')
    Object.keys(MEDIDAS).forEach(k=>MEDIDAS[k].forEach(v=>{ _MED[normTxt(v)] = k; }));
  return _MED;
}

/* Parte una línea en varios registros.
   Los separadores duros son la coma, el punto y coma, el "+" y el " y ".
   El " con " TAMBIÉN separa, y es a propósito: "una taza de arroz con un
   pedazo de carne" son dos cosas. El costo es que "café con leche" se
   partiría en dos, así que ese va como fila propia en la tabla y se
   busca ENTERO antes de cortar nada. */
function trozosComida(linea){
  const t = normTxt(linea);
  if(!t) return [];
  /* Si lo que queda DESPUÉS de la cantidad es exactamente un alimento de la
     tabla, la línea es una sola cosa y no se corta: "2 cafe con leche" son
     dos cortados, no "2 cafe" y "leche". El match acá es ESTRICTO a
     propósito — con el de contenido, "arroz con carne" se quedaría entero
     y el arroz se perdería. */
  const q = partirCantidad(t);
  if(q.nombre && buscarAlimento(q.nombre, true)) return [t];
  return t.split(/\s*[,;+]\s*|\s+y\s+|\s+con\s+/)
          .map(x=>x.trim()).filter(Boolean);
}

/* "2 huevos duros" -> {n:2, unidad:null, nombre:'huevos duros'} */
function partirCantidad(t){
  let s = normTxt(t), n = null;
  let m = s.match(/^(\d+)\s*\/\s*(\d+)\s+(.*)$/);            /* 1/2 palta */
  if(m && +m[2]!==0){ n = +m[1]/+m[2]; s = m[3]; }
  if(n===null){
    m = s.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);               /* 2 huevos · 150 g */
    if(m){ n = parseFloat(m[1].replace(',','.')); s = m[2]; }
  }
  if(n===null){
    m = s.match(/^([a-z]+)\s+(.*)$/);                        /* dos huevos */
    if(m && typeof CANTIDADES!=='undefined' && CANTIDADES[m[1]]!==undefined){
      n = CANTIDADES[m[1]]; s = m[2];
    }
  }
  const implicita = n===null;
  if(implicita) n = 1;

  /* unidad, con el "de" opcional detrás: "taza de arroz" */
  const med = idxMedidas();
  let unidad = null;
  const p = s.split(' ');
  if(p.length>1 && med[p[0]]){ unidad = med[p[0]]; p.shift(); }
  if(p[0]==='de') p.shift();
  return {n, unidad, nombre:p.join(' ').trim(), implicita};
}

/* Un registro estimado. Devuelve SIEMPRE algo: si no reconoce el
   alimento, `ok:0` y los macros en null, nunca en cero. */
function estimarComida(texto){
  const {n, unidad, nombre} = partirCantidad(texto);
  const a = buscarAlimento(nombre);
  const base = {txt:String(texto).trim(), n, unidad, ok:0,
                id:'', kcal:null, p:null, c:null, g:null, agua:null};
  if(!a) return base;

  const porUnidad = (a.med && a.med[unidad]) ?? MED_GLOBAL[unidad] ??
                    (a.med ? a.med[a.def] : 1);
  /* unidad que esa fila no conoce ("una taza de huevo"): se usa su medida
     por defecto y se DICE que es aproximado, en vez de fingir precisión */
  const aprox = !!(unidad && !(a.med && a.med[unidad]) && !MED_GLOBAL[unidad]);
  const gramos = n * porUnidad;
  const f = gramos/100;
  return {...base, ok:1, id:a.id, nombre:a.n, gramos:Math.round(gramos), aprox,
          unidad: unidad || a.def,
          kcal:+(a.kcal*f).toFixed(0), p:+(a.p*f).toFixed(1),
          c:+(a.c*f).toFixed(1), g:+(a.gr*f).toFixed(1),
          agua: a.agua ? +(gramos/1000).toFixed(2) : null};
}

/* Una línea puede traer varias cosas: devuelve un registro por cada una. */
function estimarLinea(linea){
  const out = trozosComida(linea).map(estimarComida);
  /* Si la línea era UNA sola cosa, se guarda TAL COMO ÉL LA ESCRIBIÓ —con sus
     tildes y sus mayúsculas— y no la versión normalizada que se usó para
     buscarla: normalizar es para comparar, no para mostrar. Si traía varias,
     no hay forma de recortar el original y se queda la normalizada. */
  if(out.length===1) out[0].txt = String(linea).trim();
  return out;
}

/* @parser-fin */

/* ---- del texto al registro guardado ---- */
const horaAhora = () => { const d=new Date(), dos=n=>String(n).padStart(2,'0');
  return `${dos(d.getHours())}:${dos(d.getMinutes())}`; };
const ridCorto = () => 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* El texto lo escribe él y se pinta con innerHTML: un "<" suelto rompería la
   tabla entera. */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Recalcula un registro cuando cambia la cantidad. No toca los que no
   reconoció: esos llevan las kcal que él escribió a mano, si escribió alguna. */
function reestimar(r){
  if(!r.alim || typeof ALIMENTOS === 'undefined') return;
  const a = ALIMENTOS.find(x=>x.id===r.alim); if(!a) return;
  const porUnidad = (a.med && a.med[r.unidad]) ?? MED_GLOBAL[r.unidad] ?? a.med[a.def];
  const gramos = nz(r.n)*porUnidad, k = gramos/100;
  r.gramos = Math.round(gramos);
  r.kcal = +(a.kcal*k).toFixed(0); r.p = +(a.p*k).toFixed(1);
  r.c = +(a.c*k).toFixed(1);       r.g = +(a.gr*k).toFixed(1);
  r.agua = a.agua ? +(gramos/1000).toFixed(2) : null;
}

/* ---- lo que comió un día ----
   Si escribió un total a mano manda el suyo; si no, manda la suma de lo que
   registró. Nunca los dos a la vez: dos números para lo mismo es el defecto
   que ya costó caro con el peso, cuando `cfg.peso` y `medidas[].peso` no se
   hablaban y anotar el peso donde correspondía no recalculaba nada. */
function itemsDia(f){ return (S.alimentos||[]).filter(x=>x.f===f); }
/* Los días que tienen comida anotada, en orden y con su total. Sale de las DOS
   listas: un día puede tener solo una corrección a mano (S.comida) y ninguna
   fila en S.alimentos, o al revés. */
function diasComida(){
  return [...new Set((S.alimentos||[]).map(x=>x.f).concat(S.comida.map(x=>x.f)))]
    .filter(f=>fechaMs(f)).sort().map(comidaDia);
}
function comidaDia(f){
  const d = S.comida.find(x=>x.f===f) || {};
  const it = itemsDia(f);
  const suma = k => it.reduce((a,x)=>a+nz(x[k]),0);
  const calc = {kcal:Math.round(suma('kcal')), p:+suma('p').toFixed(1),
                c:+suma('c').toFixed(1), g:+suma('g').toFixed(1),
                agua:+suma('agua').toFixed(2)};
  const man = {};
  ['kcal','p','c','g','agua'].forEach(k=>{ if(nz(d[k])>0) man[k]=nz(d[k]); });
  const val = k => man[k]!==undefined ? man[k] : (it.length ? calc[k] : null);
  return {f, d, items:it, calc, man, hayMan:Object.keys(man).length>0,
          kcal:val('kcal'), p:val('p'), c:val('c'), g:val('g'), agua:val('agua'),
          sinEstimar: it.filter(x=>!x.ok).length};
}

/* ---- de una frase a registros del día que esté abierto ----
   ⚠La fecha es `comFecha`, NO hoy(): la pestaña Comida se quedó sin selector
   de día hasta el 31-ago y una cena que se te olvidara anotar no tenía dónde
   ir. `sem` sale de esa misma fecha, no de la semana en curso, o el resumen
   sumaría la cena de la semana pasada en ésta. */
function anotarFrase(txt, hora){
  txt = String(txt||'').trim();
  if(!txt) return null;
  const f = comFecha || (comFecha = hoy());
  const partes = (typeof estimarLinea === 'function') ? estimarLinea(txt) : [];
  /* Sin la tabla cargada igual se guarda: mejor un registro sin estimar que
     perder lo que escribió. */
  const filas = partes.length ? partes : [{txt, n:1, unidad:'', ok:0,
                    id:'', kcal:null, p:null, c:null, g:null, agua:null}];
  filas.forEach(x=>{
    S.alimentos.push({rid:ridCorto(), f, sem:semanaDe(f), hora:hora||horaAhora(),
      txt:x.txt, alim:x.id||'', nombre:x.nombre||'', n:x.n, unidad:x.unidad||'',
      gramos:(x.gramos===undefined?null:x.gramos), ok:x.ok, aprox:x.aprox?1:0,
      kcal:x.kcal, p:x.p, c:x.c, g:x.g, agua:x.agua});
  });
  return filas;
}
function avisarAnotado(filas){
  const sin = filas.filter(x=>!x.ok).length;
  const dia = comFecha===hoy() ? '' : ` el ${fechaCorta(comFecha)}`;
  toast(sin ? `Anotado${dia} — ${sin} sin estimar` :
              `Anotado${dia}: ${filas.map(x=>x.nombre||x.txt).join(' + ')}`);
}
function agregarComida(){
  const inp = document.getElementById('comeTxt');
  const hora = (document.getElementById('comeHora')||{}).value || horaAhora();
  const filas = anotarFrase(inp && inp.value, hora);
  if(!filas){ if(inp) inp.focus(); return; }
  saveNow(); render();
  avisarAnotado(filas);
  const i2 = document.getElementById('comeTxt'); if(i2) i2.focus();
}

/* ---- lo que repite ----
   Las frases que más ha escrito, para volver a anotarlas de un toque. Se
   agrupan por el texto NORMALIZADO ("Plátano" y "platano" son lo mismo) pero
   se muestra la última forma en que la escribió él, no la normalizada. */
function frecuentes(n){
  const lista = (S.alimentos||[]).filter(x=>String(x.txt||'').trim());
  const por = {};
  lista.forEach(x=>{
    const k = (typeof normTxt==='function' ? normTxt(x.txt) : String(x.txt).toLowerCase());
    if(!k) return;
    if(!por[k]) por[k] = {k, n:0, txt:x.txt, ult:''};
    por[k].n++;
    /* la forma más reciente: la lista está en orden de anotación */
    if(String(x.f) >= por[k].ult){ por[k].ult = String(x.f); por[k].txt = x.txt; }
  });
  /* con una sola aparición no es "lo de siempre", es lo que comió una vez */
  return Object.values(por).filter(x=>x.n>=2)
    .sort((a,b)=> b.n-a.n || b.ult.localeCompare(a.ult)).slice(0, n||8);
}
/* Guarda una comida suya. Si el campo trae texto, guarda ESO; si está vacío,
   guarda lo que anotó ese día, unido por comas — que es como lo escribiría. */
function guardarPlato(){
  const inp = document.getElementById('comeTxt');
  const escrito = (inp && inp.value || '').trim();
  const delDia = itemsDia(comFecha||hoy())
    .slice().sort((a,b)=>String(a.hora||'').localeCompare(String(b.hora||'')))
    .map(x=>x.txt);
  const txt = escrito || delDia.join(', ');
  if(!txt){ toast('Escribe la comida arriba, o anota primero lo del día'); return; }
  const nombre = (prompt('¿Cómo se llama esta comida?\n\n' + txt, '') || '').trim();
  if(!nombre) return;                       /* canceló: no se guarda nada */
  const ya = S.platos.find(p=>p.nombre.toLowerCase()===nombre.toLowerCase());
  if(ya){
    if(!confirm(`Ya tienes una comida llamada «${ya.nombre}»:\n\n${ya.txt}\n\n¿La reemplazo?`)) return;
    ya.txt = txt;
  }else{
    S.platos.push({pid:ridCorto(), nombre, txt});
  }
  saveNow(); render(); toast(`Guardada: ${nombre}`);
}


/* ---------- COMIDA ---------- */
/* Los botones de un toque. Van dentro de la misma tarjeta del campo de texto
   porque son la otra manera de hacer lo mismo: escribir una frase. */
function repetirHTML(){
  const pl = S.platos||[], fr = frecuentes(8);
  let h = `<div class="rep">`;
  /* ⚠El botón de guardar va SIEMPRE, también cuando no hay nada guardado
     todavía. Metido dentro del `if` de los chips quedaba un círculo cerrado:
     solo aparecía cuando ya tenías comidas guardadas, así que la primera no
     había manera de crearla. Se vio apretándolo, no leyéndolo. */
  if(!pl.length && !fr.length){
    return h + `<p class="prev" style="margin:0 0 9px">Cuando repitas una comida te va a aparecer acá para anotarla de un toque.</p>`
      + `<button class="act ghost peq" id="btnPlato">Guardar como comida mía</button>`
      + `<p class="prev" style="margin:7px 0 0">Guarda lo que tengas escrito arriba; si el campo está vacío, guarda todo lo que anotaste este día.</p></div>`;
  }
  if(pl.length){
    h += `<div class="rep-t">Tus comidas</div><div class="chips">` +
      pl.map(p=>`<span class="chip"><button data-plato="${p.pid}" title="${esc(p.txt)}">${esc(p.nombre)}</button>`
        + `<button class="x" data-platoborrar="${p.pid}" aria-label="Borrar ${esc(p.nombre)}">✕</button></span>`).join('') +
      `</div>`;
  }
  if(fr.length){
    h += `<div class="rep-t">Lo que más repites</div><div class="chips">` +
      fr.map(x=>`<span class="chip"><button data-frec="${esc(x.txt)}">${esc(x.txt)} <small>×${x.n}</small></button></span>`).join('') +
      `</div>`;
  }
  h += `<button class="act ghost peq" id="btnPlato">Guardar como comida mía</button>`;
  h += `<p class="prev" style="margin:7px 0 0">Guarda lo que tengas escrito arriba; si el campo está vacío, guarda todo lo que anotaste este día.</p>`;
  return h + `</div>`;
}

/* ---- el día es un SELECTOR, igual que en Medidas ----
   La pestaña mostraba SOLO hoy. Si se te olvidaba anotar la cena y te
   acordabas al día siguiente, no había dónde ponerla. Ahora eliges el día
   arriba y todo lo de la pestaña —lo que anotas, los totales, la corrección a
   mano y el tipo de día— es de ESE día. */
let comFecha = null;
function vComida(){
  const t=targets();
  const f = comFecha || (comFecha = hoy());
  const cd=comidaDia(f);

  let h=`<h2>Comida</h2>

  <div class="card">
    <div class="eyebrow" id="lblKcal">Calorías · objetivo ${objKcal}</div>

  }else{
    /* Filas de DOS líneas y no una tabla: con seis columnas en 414 px el

      h+=`<div class="com-item">
        <div class="com-l1">
          <span class="com-hora">${esc(x.hora||'—')}</span>

  [

/* ---------- MEDIDAS ---------- */
/* ---- la fecha es un SELECTOR, no un campo del registro ----
   Antes la pestaña se clavaba a la semana en curso y solo cabía UN registro por
   semana: pesarse el martes y el jueves guardaba un solo número, porque el
   segundo pisaba al primero. Y el peso de Ajustes no dejaba fecha ninguna.
   Ahora hay un registro POR DÍA: eliges el día arriba y editas ese día. */
let medFecha = null;
function filaMed(f, crear){
  let r = S.medidas.find(x=>x.f===f);
  if(!r && crear){ r={f, sem:semanaDe(f)}; S.medidas.push(r); }
  return r;
}
const CINTAS = [['cint','Cintura ombligo'],['cintE','Cintura estrecha'],['cad','Cadera'],
                ['pecho','Pecho'],['brazo','Brazo relajado'],['muslo','Muslo']];
const signoD = d => (d>0?'+':'')+coma(d);
const claseD = d => d<0?'baja':d>0?'sube':'';
function vMedidas(){
  const f = medFecha || (medFecha = hoy());
  const m = filaMed(f) || {};
  const sem = semanaDe(f);
  const t = tendenciaPeso();

  /* Δ de cintura: contra la medición anterior que la tenga, no contra "la
     semana pasada" — la cinta no sale todas las semanas. */
  const conCint = S.medidas.filter(x=>nz(x.cint)>0 && fechaMs(x.f) && x.f<f)
                           .sort((a,b)=>fechaMs(a.f)-fechaMs(b.f)).pop();
  const dC = (nz(m.cint)>0 && conCint) ? +(nz(m.cint)-nz(conCint.cint)).toFixed(1) : null;

  let statPeso, statPie;
  if(!t){
    statPeso = `<div class="stat"><b>—</b><small>todavía sin pesajes</small></div>`;
    statPie  = `<div class="stat"><b>—</b><small>anota tu peso y aparece la tendencia</small></div>`;
  }else{
    statPeso = `<div class="stat"><b>${coma(t.ult)} kg</b><small>último pesaje · ${fechaCorta(t.hasta)}</small></div>`;
    statPie  = (t.a && t.dif!==null)
      ? `<div class="stat"><b class="${claseD(t.dif)}">${signoD(t.dif)} kg</b><small>${(t.a.n>1||t.b.n>1)?`media 7 días (${coma(un(t.a.media))}) vs los 7 previos`:'vs tu pesaje anterior'}</small></div>`
      : t.a
        ? `<div class="stat"><b>${coma(un(t.a.media))} kg</b><small>media de ${t.a.n} pesaje${t.a.n===1?'':'s'} · faltan 7 días más para comparar</small></div>`
        : `<div class="stat"><b>—</b><small>sin pesajes en los últimos 7 días</small></div>`;
  }

  let h=`<h2>Peso y medidas</h2>
  <p class="lede">Pésate cuando quieras — todos los días si te sirve — <b>en ayunas y después del baño</b>. Cada día queda con su fecha. Las cintas son de una vez por semana, los lunes.</p>
  <div class="card">
    <div class="eyebrow">Semana ${sem}${f===hoy()?' · hoy':''}</div>
    <div class="grid g2" style="margin:10px 0 12px">
      <div><label>Día que estás anotando</label><input type="date" data-medfecha="1" value="${f}"></div>
      <div><label>Peso kg</label><input type="number" inputmode="decimal" step="0.1" data-med="peso" value="${m.peso??''}"></div>
    </div>
    <div class="grid g3">
      ${CINTAS.map(([k,lbl])=>`<div><label>${lbl}</label><input type="number" inputmode="decimal" step="0.1" data-med="${k}" value="${m[k]??''}"></div>`).join('')}
    </div>
    <div class="grid g2" style="margin-top:12px">
      ${statPeso}${statPie}
    </div>
    ${dC!==null?`<p class="lede" style="margin:10px 0 0">Cintura <b class="${claseD(dC)}">${signoD(dC)} cm</b> desde el ${fechaCorta(conCint.f)}.</p>`:''}
  </div>
  <div class="note"><b>La balanza sube y baja sola.</b> Entre dos mañanas seguidas puedes marcar un kilo de diferencia y es agua, sal y lo que quedó por digerir. Por eso acá lo que manda no es el número del día sino la <b>media de 7 días</b>: esa se mueve solo cuando cambia el cuerpo. Y en recomposición la cinta métrica manda sobre las dos.</div>
  <div class="note"><b>Cómo medir siempre igual.</b> Cintura al nivel del ombligo, cinta sin apretar, exhalando normal. Brazo a mitad entre hombro y codo, colgando. Muslo 15 cm sobre la rodilla — marca el punto con lápiz para repetirlo. Y saca fotos de frente, perfil y espalda cada 4 semanas: a los dos meses te dirán más que cualquier número.</div>`;

  h+=`<h2>Cómo vas</h2><div class="card">
    ${grafico(S.medidas.map(x=>({f:x.f,v:x.peso})),
        {titulo:'Peso', unidad:'kg', bajarEsBueno:true, media:7,
         vacio:'Con dos pesajes aparece la curva. En recomposición es la línea, no el número del día.'})}
    ${grafico(S.medidas.map(x=>({f:x.f,v:x.cint})),
        {titulo:'Cintura (ombligo)', unidad:'cm', bajarEsBueno:true,
         vacio:'Con dos mediciones de cintura aparece la curva.'})}
  </div>`;

  /* ---- lo que comió, día a día ----
     Es el par que dirige una recomposición: la proteína contra su objetivo y
     las calorías contra el suyo. Un día sin nada anotado NO es un cero: no
     tiene punto, porque un cero hundiría la media y diría que comió menos
     cuando lo que pasó es que no anotó. */
  const tg = targets();   /* `t` en esta vista es la TENDENCIA de peso, no los objetivos */
  const dcom = diasComida();
  h+=`<h2>Lo que comes</h2><div class="card">
    ${grafico(dcom.map(x=>({f:x.f, v:x.p})),
        {titulo:'Proteína', unidad:'g', objetivo:tg.p, media:7, cada:'día',
         vacio:'Con dos días anotados en Comida aparece la curva. Es la línea que más manda si estás en déficit.'})}
    ${grafico(dcom.map(x=>({f:x.f, v:x.kcal})),
        {titulo:'Calorías', unidad:'kcal', objetivo:tg.kcal, media:7, cada:'día', neutro:true,
         vacio:'Con dos días anotados en Comida aparece la curva.'})}
    ${dcom.length?`<p class="prev" style="margin:2px 0 0">${dcom.length} día${dcom.length===1?'':'s'} con comida anotada. Los días que no anotaste no aparecen: un cero diría que no comiste.</p>`:''}
  </div>`;

  const rs = S.medidas.filter(x=>fechaMs(x.f)).sort((a,b)=>fechaMs(a.f)-fechaMs(b.f));
  if(rs.length){
    /* El Δ se calcula en orden cronológico y recién después se da vuelta la
       tabla: calculado sobre la lista ya invertida, cada fila se compararía con
       el día SIGUIENTE y todos los signos saldrían al revés. */
    const ps = rs.filter(x=>nz(x.peso)>0);
    const dPrev = {};
    ps.forEach((x,k)=>{ if(k) dPrev[x.f] = +(nz(x.peso)-nz(ps[k-1].peso)).toFixed(1); });
    h+=`<h2>Historial</h2>
    <p class="lede">El más reciente arriba. Toca la fecha para corregir ese día; la ✕ lo borra.</p>
    <div class="scroll"><table class="tbl"><thead><tr>
      <th>Fecha</th><th>Sem</th><th>Peso</th><th>Δ</th><th>Cintura</th><th>Pecho</th><th>Brazo</th><th></th>
    </tr></thead><tbody>`;
    rs.slice().reverse().forEach(x=>{
      const d = dPrev[x.f];
      h+=`<tr${x.f===f?' class="sel"':''}>
        <td><button class="lnk" data-medir="${x.f}">${fechaCorta(x.f)}</button></td>
        <td>${semanaDe(x.f)}</td>
        <td>${coma(x.peso??'')}</td>
        <td>${d===undefined?'':`<span class="${claseD(d)}">${signoD(d)}</span>`}</td>
        <td>${coma(x.cint??'')}</td><td>${coma(x.pecho??'')}</td><td>${coma(x.brazo??'')}</td>
        <td><button class="lnk del" data-medborrar="${x.f}" aria-label="Borrar el registro del ${x.f}">✕</button></td>
      </tr>`;
    });
    h+=`</tbody></table></div>
    <p class="prev">${ps.length} pesaje${ps.length===1?'':'s'} anotado${ps.length===1?'':'s'}.</p>`;
  }
  return h;
}

/* ---------- RESUMEN ---------- */
/* ---- el respaldo ----
   Todo vive en el localStorage de UN teléfono y no hay copia en ninguna parte:
   cambiar de teléfono o que el navegador limpie los datos se lo lleva todo.
   La app no puede respaldar sola —no hay servidor a propósito— así que lo
   único que puede hacer es no dejar que se te olvide.

   ⚠Lo que se marca es el día en que GENERÓ el respaldo, no que lo haya
   guardado en alguna parte: eso la app no puede saberlo, y el texto lo dice
   así en vez de prometer algo que no comprueba. */
const DIAS_RESP = 14;
function marcarRespaldado(){ S.cfg.resp = hoy(); saveNow(); }
/* El nombre lleva la fecha: en Archivos quedan uno al lado del otro y se ve
   cuál es el último sin abrir ninguno. */
const nombreRespaldo = () => `entreno-${hoy()}.json`;

/* ---- guardar el respaldo como ARCHIVO ----
   Copiar y pegar el JSON deja de funcionar solo: un año de uso son 1,2 MB de
   texto, que no se seleccionan a mano en un teléfono ni caben en un correo
   escrito. Así que el respaldo pasa a ser un archivo.

   Se intenta en tres escalones, de mejor a peor, y NUNCA se marca como
   respaldado algo que no llegó a guardarse:
   1. La hoja de compartir del teléfono. Es la única puerta a iCloud Drive que
      tiene una página web en iPhone — no existe API para escribir ahí sola.
   2. La descarga directa, para el computador y para Android.
   3. El texto a la vista para copiarlo, que funciona siempre. */
async function guardarRespaldo(){
  /* el JSON se arma ANTES de marcar nada: el archivo que se lleva no debe
     venir diciendo que ya estaba respaldado */
  const json = JSON.stringify(S);
  const nombre = nombreRespaldo();
  let archivo = null;
  try{ archivo = new File([json], nombre, {type:'application/json'}); }catch(e){}

  if(archivo && navigator.canShare && navigator.canShare({files:[archivo]})){
    try{
      await navigator.share({files:[archivo], title:'Respaldo de entrenamiento'});
      marcarRespaldado(); render();
      toast('Guardado — elígelo en iCloud Drive, no en «En mi iPhone»');
      return;
    }catch(e){
      /* ⚠Cancelar NO es respaldar. Marcarlo acá dejaría el aviso apagado dos
         semanas por un respaldo que nunca existió, que es peor que no avisar:
         te haría confiar en algo que no está. */
      if(e && e.name==='AbortError'){ toast('Cancelado — no se guardó nada'); return; }
      /* cualquier otro fallo cae al escalón siguiente en vez de dejarte sin salida */
    }
  }

  try{
    const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    marcarRespaldado(); render();
    toast(`${nombre} descargado — guárdalo en iCloud Drive`);
    return;
  }catch(e){}

  /* último recurso: el texto. No se marca como respaldado hasta que lo copie
     con el otro botón. */
  const o=document.getElementById('respOut');
  if(o){ o.value=json; o.classList.remove('hide'); o.select(); }
  toast('Este navegador no deja guardar archivos — cópialo a mano');
}
/* ============================================================
   RESPALDO AUTOMÁTICO A UN REPOSITORIO PRIVADO
   ------------------------------------------------------------
   Todo lo de arriba depende de que se acuerde de apretar un botón. Esto sube
   el mismo JSON solo, a un repo privado de GitHub, donde cada subida queda
   como un commit — o sea, con historial: se puede volver a cualquier día.

   🔑EL TOKEN NO VIVE DENTRO DE `S`. Vive en su propia clave del
   localStorage, y por eso NO entra en el respaldo. Guardado en `S.cfg`
   habría viajado dentro de cada archivo que se manda a iCloud, a un correo o
   por WhatsApp: la llave de escritura del repo, repartida en cada respaldo.
   Por la misma razón la restauración no lo toca.
   ============================================================ */
const GH_KEY = 'entreno:gh';
const GH_HORAS = 3;        /* mínimo entre subidas automáticas */
const GH_CAIDA = 20;       /* cuántos registros puede bajar sin preguntar */

function ghCfg(){
  try{ return JSON.parse(localStorage.getItem(GH_KEY)||'null') || null; }
  catch(e){ return null; }
}
function ghGuardar(c){
  try{ localStorage.setItem(GH_KEY, JSON.stringify(c)); }catch(e){}
}
function ghApagar(){ try{ localStorage.removeItem(GH_KEY); }catch(e){} }
/* Nunca se muestra entero: prefijo y largo bastan para reconocerlo. */
const ghTapado = t => !t ? '' : `${String(t).slice(0,11)}…${String(t).length} caracteres`;

/* base64 de UTF-8, por trozos: `String.fromCharCode(...bytes)` de un tirón
   revienta la pila con más de ~100 KB, y acá el archivo llega a megas. */
function b64(txt){
  const b = new TextEncoder().encode(txt);
  let s = '';
  for(let i=0;i<b.length;i+=8192) s += String.fromCharCode.apply(null, b.subarray(i,i+8192));
  return btoa(s);
}
/* hash barato solo para saber si cambió algo desde la última subida */
function hashTxt(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return h.toString(36); }
const totalRegistros = () =>
  ['fuerza','cardio','comida','alimentos','medidas','sesiones']
    .reduce((a,k)=>a+((S[k]||[]).length),0);

const ghUrl = c => `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.ruta.split('/').map(encodeURIComponent).join('/')}`;
const ghCab = (c, accept) => ({Authorization:`Bearer ${c.token}`,
  Accept: accept||'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'});

/* El sha del archivo que ya está allá; null si todavía no existe. Sin él,
   GitHub rechaza la escritura sobre un archivo existente. */
async function ghSha(c){
  const r = await fetch(`${ghUrl(c)}?ref=${encodeURIComponent(c.rama)}&t=${Date.now()}`,
    {headers: ghCab(c), cache:'no-store'});
  if(r.status===404) return null;
  if(!r.ok) throw Object.assign(new Error(`GitHub respondió ${r.status}`), {status:r.status});
  const j = await r.json();
  return j.sha || null;
}

/* Sube el respaldo. `auto` = lo disparó la app sola, y ahí es más prudente:
   ante la duda no sube y deja el aviso encendido. */
async function ghSubir(auto){
  const c = ghCfg();
  if(!c || !c.token) return {estado:'off'};
  const json = JSON.stringify(S);
  const h = hashTxt(json), n = totalRegistros();

  if(auto && h === c.ultimoHash) return {estado:'sincambios'};
  if(auto && c.ultimaF){
    const horas = (Date.now() - c.ultimaF)/3600000;
    if(horas < GH_HORAS) return {estado:'muypronto', horas:+horas.toFixed(1)};
  }

  /* ⚠La compuerta que hace que esto no sea peligroso.
     Si la app sube sola, el día que los datos se pierdan localmente subiría
     el vacío ENCIMA del respaldo bueno. Con el historial de commits se podría
     recuperar, pero recuperar es peor que no romper: si el respaldo trae
     bastantes menos registros que el anterior, no sube solo y lo dice. */
  if(c.ultimoN > 0 && n < c.ultimoN - GH_CAIDA){
    const aviso = {estado:'encogio', n, antes:c.ultimoN};
    if(auto) return aviso;
    if(!confirm(`El respaldo que está en GitHub tiene ${c.ultimoN} registros y este tiene ${n}: ${c.ultimoN-n} menos.\n\n¿Subir igual y pisarlo?\n\nSi no estás seguro, cancela: lo que está allá no se toca y no pierdes nada.`))
      return aviso;
  }

  const cuerpo = {message:`Respaldo ${hoy()} · ${n} registros`,
                  content: b64(json), branch: c.rama};
  try{
    let sha = await ghSha(c);
    if(sha) cuerpo.sha = sha;
    let r = await fetch(ghUrl(c), {method:'PUT', headers:
      Object.assign(ghCab(c), {'Content-Type':'application/json'}), body: JSON.stringify(cuerpo)});
    /* 409: alguien más escribió entremedio. Se relee el sha y se reintenta
       UNA vez; si vuelve a chocar, no se insiste a ciegas. */
    if(r.status===409){
      cuerpo.sha = await ghSha(c);
      r = await fetch(ghUrl(c), {method:'PUT', headers:
        Object.assign(ghCab(c), {'Content-Type':'application/json'}), body: JSON.stringify(cuerpo)});
    }
    if(!r.ok){
      const j = await r.json().catch(()=>({}));
      const err = {estado:'error', status:r.status, msg:j.message||`respondió ${r.status}`};
      ghGuardar(Object.assign(c, {ultimoErr:`${err.status}: ${err.msg}`}));
      return err;
    }
    ghGuardar(Object.assign(c, {ultimoHash:h, ultimoN:n, ultimaF:Date.now(), ultimoErr:''}));
    /* subir SÍ es respaldar: apaga el aviso de los 14 días igual que el archivo */
    marcarRespaldado();
    return {estado:'ok', n};
  }catch(e){
    /* sin señal no es un error del que haya que avisar: se reintenta a la
       próxima. Se distingue del fallo de credenciales, que sí hay que decir. */
    const sinRed = !navigator.onLine || e.name==='TypeError';
    if(sinRed) return {estado:'sinred', msg:String(e.message||e)};
    /* el motivo tiene que ser accionable: «respondió 401» no le dice a nadie
       qué hacer, y lo que hay que hacer es sacarse un token nuevo */
    const msg = e.status===401 ? 'el token ya no sirve (lo más probable: caducó)'
              : e.status===403 ? 'GitHub rechazó el permiso — revisa que el token tenga Contents: Read and write'
              : e.status===404 ? 'no encuentro el repositorio, o el token perdió el acceso a él'
              : String(e.message||e);
    ghGuardar(Object.assign(c, {ultimoErr:msg}));
    return {estado:'error', status:e.status, msg};
  }
}

/* Traer el respaldo de allá: es lo que se usa al estrenar teléfono.
   `vnd.github.raw` porque el endpoint normal NO devuelve el contenido de
   archivos de más de 1 MB, y un año de uso pesa 1,2 MB. */
async function ghTraer(){
  const c = ghCfg();
  if(!c || !c.token){ toast('Primero conecta el respaldo automático'); return; }
  toast('Buscando el respaldo…');
  try{
    const r = await fetch(`${ghUrl(c)}?ref=${encodeURIComponent(c.rama)}&t=${Date.now()}`,
      {headers: ghCab(c, 'application/vnd.github.raw'), cache:'no-store'});
    if(r.status===404){ toast('Todavía no hay ningún respaldo allá'); return; }
    if(!r.ok){ toast(`GitHub respondió ${r.status}`); return; }
    importar(await r.text());
  }catch(e){ toast('Sin conexión con GitHub'); }
}

/* Comprueba de verdad que el token sirve PARA ESTE repo, en vez de dar por
   buena una cadena con la forma correcta. */
async function ghProbar(c){
  try{
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`,
      {headers: ghCab(c)});
    if(r.status===401) return {ok:false, msg:'El token no es válido o ya caducó.'};
    if(r.status===404) return {ok:false, msg:`No veo el repo ${c.owner}/${c.repo}. Revisa el nombre, y que el token tenga acceso a ESE repositorio.`};
    if(!r.ok) return {ok:false, msg:`GitHub respondió ${r.status}.`};
    const j = await r.json();
    if(!j.private) return {ok:false, msg:'⚠Ese repositorio es PÚBLICO. Tus medidas y comidas quedarían a la vista de cualquiera. Usa uno privado.'};
    if(j.permissions && j.permissions.push===false)
      return {ok:false, msg:'El token puede leer pero no escribir. Necesita permiso de Contents: Read and write.'};
    return {ok:true, rama:j.default_branch||'main'};
  }catch(e){ return {ok:false, msg:'No pude hablar con GitHub. ¿Hay señal?'}; }
}

/* Disparo automático: al abrir la app y al volver a ella. No en cada tecla —
   subiría megas por nada — y solo si algo cambió. */
/* Conectar: NO se guarda nada hasta que GitHub confirma que el token sirve
   para ese repo. Guardar primero y comprobar después dejaría el respaldo
   "conectado" y silenciosamente muerto. */
async function ghConectar(){
  const v = id => (document.getElementById(id)||{}).value || '';
  const c = {owner:v('ghOwner').trim(), repo:v('ghRepo').trim(),
             token:v('ghToken').trim(), rama:'main', ruta:'entreno.json',
             ultimoHash:'', ultimoN:0, ultimaF:0, ultimoErr:''};
  if(!c.owner || !c.repo || !c.token){ toast('Faltan el usuario, el repo o el token'); return; }
  const b = document.getElementById('btnGhOn');
  if(b){ b.disabled=true; b.textContent='Probando…'; }
  const r = await ghProbar(c);
  if(!r.ok){
    if(b){ b.disabled=false; b.textContent='Probar y activar'; }
    alert(r.msg);                      /* el motivo entero, no un toast que se va */
    return;
  }
  c.rama = r.rama;
  ghGuardar(c);
  const s = await ghSubir(false);      /* la primera subida, para que no quede a medias */
  render();
  toast(s.estado==='ok' ? `Conectado — ${s.n} registros subidos` : 'Conectado, pero la primera subida falló');
}

let ghEnCurso = false;
async function ghAuto(){
  if(ghEnCurso || !ghCfg()) return;
  ghEnCurso = true;
  try{
    const r = await ghSubir(true);
    if(r.estado==='ok' || r.estado==='error' || r.estado==='encogio') refrescarAjustes();
  } finally { ghEnCurso = false; }
}

function avisoRespaldo(){
  const fechas = [...S.fuerza,...S.cardio,...S.comida,...S.medidas,...(S.alimentos||[])]
    .map(x=>x.f).filter(f=>fechaMs(f)).sort();
  if(!fechas.length) return null;              /* sin datos no hay nada que perder */
  /* ⚠El automático conectado PERO fallando es el peor de los casos: la última
     subida buena estampó `resp`, así que el aviso de respaldar a mano quedaría
     apagado dos semanas mientras no se sube nada. Te dejaría sin ninguno de
     los dos respaldos, creyendo que tienes uno. */
  const gh = ghCfg();
  if(gh && gh.ultimoErr) return {estado:'roto', motivo:gh.ultimoErr};
  const hoyF = hoy();
  const dias = f => Math.round((fechaMs(hoyF)-fechaMs(f))/86400000);
  const resp = fechaMs(S.cfg.resp) ? S.cfg.resp : null;
  const nuevo = fechas[fechas.length-1];       /* el registro más reciente */
  if(!resp) return {estado:'nunca', desde:dias(fechas[0]), resp:null};
  /* si no anotó nada nuevo desde el último respaldo, no hay nada que perder
     todavía y no tiene sentido darle la lata */
  if(nuevo <= resp) return {estado:'aldia', dias:dias(resp), resp};
  const d = dias(resp);
  return {estado: d>=DIAS_RESP ? 'viejo' : 'aldia', dias:d, resp};
}
const hayQueRespaldar = () => { const a=avisoRespaldo();
  return !!a && (a.estado==='nunca' || a.estado==='viejo' || a.estado==='roto'); };
function avisoRespaldoHTML(){
  const a = avisoRespaldo();
  if(!a) return '';
  if(a.estado==='aldia')
    return `<p class="prev" style="margin:10px 0 0">Último respaldo: hace ${a.dias===0?'menos de un día':a.dias+(a.dias===1?' día':' días')}.</p>`;
  if(a.estado==='roto')
    return `<div class="aviso-resp"><b>El respaldo automático no está funcionando:</b> ${esc(a.motivo)}.
      Guarda uno a mano ahora con <b>Guardar respaldo</b>, y arregla la conexión en <b>Ajustes</b>.
      Mientras siga así no se sube nada, aunque la pantalla de Ajustes muestre una última subida con fecha.</div>`;
  const txt = a.estado==='nunca'
    ? `<b>Nunca has guardado un respaldo.</b> Llevas ${a.desde===0?'menos de un día':a.desde+(a.desde===1?' día':' días')} de registros que solo existen en este teléfono.`
    : `<b>Hace ${a.dias} días que no respaldas</b>, y desde entonces anotaste cosas nuevas.`;
  return `<div class="aviso-resp">${txt} Toca <b>Guardar respaldo</b> y elige <b>Archivos → iCloud Drive</b>. Son dos toques. Si se borran los datos del navegador o cambias de teléfono, sin eso no hay vuelta atrás.</div>`;
}
function weekAgg(w){
  const f=S.fuerza.filter(x=>semanaDe(x.f)===w);
  const vol=f.reduce((a,x)=>a+nz(x.kg)*nz(x.reps),0);
  const ses=new Set(f.filter(x=>nz(x.reps)>0).map(x=>x.f)).size;
  /* días con al menos una serie anotada en el gym; las series anteriores al
     25-oct no traen lugar y cuentan como casa, que es donde entrenaba */
  const gym=new Set(f.filter(x=>nz(x.reps)>0 && x.lugar==='gym').map(x=>x.f)).size;
  const c=S.cardio.filter(x=>semanaDe(x.f)===w);
  const min=c.reduce((a,x)=>a+nz(x.min),0);
  /* Los días con comida salen de las DOS listas: desde que las kcal se
     calculan, un día puede tener registros y ninguna fila en S.comida. */
  const diasCom=[...new Set([...S.comida.map(x=>x.f),...(S.alimentos||[]).map(x=>x.f)])]
                 .filter(x=>semanaDe(x)===w);
  const co=diasCom.map(comidaDia).filter(x=>nz(x.kcal)>0);
  const avg=(k)=>co.length?Math.round(co.reduce((a,x)=>a+nz(x[k]),0)/co.length):null;
  const m=medidaSemana(w);
  const se=S.sesiones.filter(x=>semanaDe(x.f)===w);
  const cs=se.filter(x=>nz(x.sueno)>0);
  const sueno = cs.length ? +(cs.reduce((a,x)=>a+nz(x.sueno),0)/cs.length).toFixed(1) : null;
  return {w,ses,gym,vol:Math.round(vol),min,dias:co.length,sueno,
          kcal:avg('kcal'),p:avg('p'),c:avg('c'),g:avg('g'),
          /* ⚠solo los días que TIENEN adherencia anotada. Promediando los
             vacíos como cero salía «0.0» y la Lectura avisaba «adherencia
             baja» sin que él hubiera anotado ninguna: una alerta falsa, y de
             las que hacen que se dejen de leer las verdaderas. Hasta que la
             comida se registró, esto no se veía porque no había días de
             comida y la Lectura nunca llegaba a mirarlo. */
          adh:(()=>{ const ca=co.filter(x=>nz(x.d.adh)>0);
            return ca.length?(ca.reduce((a,x)=>a+nz(x.d.adh),0)/ca.length).toFixed(1):null; })(),
          peso:m.peso, cint:m.cint, pesajes:m.pesajes};
}
/* Cuántas sesiones SEGUIDAS vienes arrastrando la misma molestia. Una sesión
   suelta con el hombro sensible es ruido; tres seguidas es una señal. */
function molestiaRepetida(){
  const todas = S.sesiones.filter(x=>!isNaN(fechaMs(x.f)))
                          .sort((a,b)=>fechaMs(a.f)-fechaMs(b.f));
  if(!todas.length) return null;
  const u = todas[todas.length-1];
  const zona = u.zona;
  if(!zona || zona==='Ninguna' || !u.dolor || u.dolor==='—') return null;
  let n=0;
  for(let i=todas.length-1;i>=0;i--){
    if(todas[i].zona===zona && todas[i].dolor && todas[i].dolor!=='—') n++; else break;
  }
  return n>=2 ? {zona, n, fuerte:u.dolor==='Fuerte'} : null;
}
function vResumen(){
  const weeks=[...new Set([...S.fuerza,...S.cardio,...S.comida,...S.medidas]
    .map(x=>semanaDe(x.f)).concat([semanaHoy()]))].filter(x=>x).sort((a,b)=>a-b);
  const rows=weeks.map(weekAgg);
  let h=`<h2>Resumen semanal</h2>
  <p class="lede">Se arma solo con lo que vas cargando. Exporta al final de cada semana y pásame el texto para ajustar el plan.</p>
  <div class="scroll"><table class="tbl"><thead><tr>
    <th>Sem</th><th>Ses.</th><th>Volumen kg</th><th>Cardio min</th><th>Días com.</th>
    <th>Kcal/día</th><th>Prot/día</th><th>Adher.</th><th>Sueño</th><th>Peso medio</th><th>Cintura</th>
  </tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const p=rows[i-1];
    const dp=(p&&r.peso&&p.peso)?(r.peso-p.peso).toFixed(1):'';
    const dc=(p&&r.cint&&p.cint)?(r.cint-p.cint).toFixed(1):'';
    h+=`<tr><td>${r.w}</td><td>${r.ses||''}${r.gym?` <small>(${r.gym} gym)</small>`:''}</td><td>${r.vol||''}</td><td>${r.min||''}</td>
      <td>${r.dias||''}</td><td>${r.kcal??''}</td><td>${r.p??''}</td><td>${r.adh??''}</td>
      <td>${r.sueno!=null?coma(r.sueno)+' h':''}</td>
      <td>${coma(un(r.peso)??'')}${dp?` <small>(${dp>0?'+':''}${coma(dp)})</small>`:''}</td>
      <td>${coma(r.cint??'')}${dc?` <small>(${dc>0?'+':''}${coma(dc)})</small>`:''}</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  if(rows.some(r=>r.pesajes>1))
    h+=`<p class="prev">El peso de cada semana es la <b>media</b> de los pesajes de esa semana, no el último. Día a día la balanza es agua.</p>`;

  /* La lectura mira la última semana CON DATOS y la compara con la anterior
     que también los tenga. Antes miraba rows[rows.length-1], que es la semana
     en curso y está vacía recién empezada: el diagnóstico decía "sin alertas"
     pasara lo que pasara. */
  const t=targets();
  const conDatos = rows.filter(r=>r.ses>0 || r.dias>0 || r.peso!=null);
  const last = conDatos[conDatos.length-1];
  const prev = conDatos[conDatos.length-2];
  if(last){
    let diag=[];
    const mol = molestiaRepetida();
    if(mol){
      const cuales = EJ_POR_ZONA[mol.zona];
      diag.push([mol.fuerte?'bad':'warn',
        `Llevas <b>${mol.n} sesiones seguidas</b> con molestia en ${mol.zona.toLowerCase()}${mol.fuerte?', y la última fuerte':''}. `
        + (cuales?`Baja la carga en ${cuales} un 20 % esta semana y sube el rango de repeticiones para compensar. `:'Baja la carga de lo que cargue esa zona. ')
        + `Entrenas solo: una molestia que se repite tres veces no se aguanta, se corrige.`]);
    }
    if(last.sueno!==null && last.sueno<7) diag.push(['warn',`Dormiste <b>${coma(last.sueno)} h</b> de media. Bajo 7 horas el músculo no alcanza a repararse: arreglar eso rinde más que cualquier ajuste de calorías o de series.`]);
    if(last.p!==null && last.p < t.p*0.9) diag.push(['bad','Proteína bajo el objetivo. Es el problema número uno: sin ella, el déficit se come el músculo.']);
    if(last.adh!==null && +last.adh<3) diag.push(['warn','Adherencia baja. Antes de exigirte más, hay que simplificar el plan.']);
    if(prev){
      if(last.peso&&prev.peso&&(prev.peso-last.peso)>1) diag.push(['warn','Bajaste más de 1 kg esta semana. Demasiado rápido: sube unas 250 kcal.']);
      if(last.vol&&prev.vol&&last.vol<prev.vol*0.95) diag.push(['warn','El volumen de fuerza cayó.'
        + (last.sueno!==null && last.sueno<7
           ? ' Con las horas de sueño que traes, la causa está ahí antes que en la comida.'
           : ' Suele ser déficit muy agresivo o poco sueño.')]);
      if(last.peso&&prev.peso&&Math.abs(last.peso-prev.peso)<0.2&&last.cint&&prev.cint&&last.cint<prev.cint) diag.push(['ok','Peso estable y cintura bajando: estás en plena recomposición. No cambies nada.']);
    }
    if(!diag.length) diag.push(['ok','Sin alertas con los datos cargados. Sigue así y revisamos en una semana.']);
    h+=`<h2>Lectura — semana ${last.w}</h2><div class="card">`;
    diag.forEach(d=>h+=`<p style="margin:0 0 10px"><span class="pill ${d[0]==='ok'?'':d[0]}">${d[0]==='ok'?'Bien':d[0]==='warn'?'Ojo':'Corregir'}</span> ${d[1]}</p>`);
    h+=`</div>`;
  }

  h+=`<h2>Respaldar</h2>
  <p class="lede">Guarda el archivo y <b>elige iCloud Drive</b>, no «En mi iPhone»: ahí sobrevive aunque pierdas el teléfono. Guardado solo en el teléfono te cubre igual si borras los datos de Safari o reinstalas la app, que es como esto se pierde casi siempre.</p>
  <div class="card">
    <button class="act" id="btnResp">Guardar respaldo</button>
    <button class="act ghost" id="btnJson" style="margin-left:8px">Copiarlo a mano</button>
    <textarea id="respOut" rows="6" class="hide" style="margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:12px"></textarea>
    ${avisoRespaldoHTML()}
  </div>

  <h2>Exportar para el chat</h2>
  <p class="lede">Copia este texto y pégamelo para que analicemos la semana y ajustemos cargas y calorías. <b>No es un respaldo</b>: es el resumen, no tus datos.</p>

function expText(){
  const t=targets();
  /* las medidas también hacen semana: si solo te pesaste, esa semana igual sale */
  const weeks=[...new Set([...S.fuerza,...S.cardio,...S.comida,...S.medidas].map(x=>semanaDe(x.f)))].sort((a,b)=>a-b);
  let o=`RESUMEN DE ENTRENAMIENTO\n`;
  const sinEst=(S.alimentos||[]).filter(x=>!x.ok).length;
  if(sinEst) o+=`OJO: hay ${sinEst} registros de comida SIN ESTIMAR, marcados más abajo. Estímalos y agrégalos a la tabla de alimentos.\n`;
  o+=`Perfil: ${S.cfg.alt} cm · ${coma(un(pesoActual()))} kg · ${S.cfg.edad} años\n`;
  o+=`Objetivos: ${t.kcal} kcal / ${t.p} g prot / ${t.ch} g carb / ${t.g} g grasa\n\n`;
  weeks.forEach(w=>{
    const r=weekAgg(w);
    o+=`--- SEMANA ${w} ---\n`;
    o+=`Sesiones: ${r.ses}${r.gym?` (${r.gym} en el gym)`:''} · Volumen: ${r.vol} kg · Cardio: ${r.min} min\n`;
    o+=`Nutrición (${r.dias} días): ${r.kcal??'-'} kcal · ${r.p??'-'} g prot · ${r.c??'-'} g carb · ${r.g??'-'} g grasa · adherencia ${r.adh??'-'}\n`;
    o+=`Peso: ${un(r.peso)??'-'} kg${r.pesajes>1?` (media de ${r.pesajes} pesajes)`:''} · Cintura: ${r.cint??'-'} cm · Sueño: ${r.sueno??'-'} h\n`;
    const mol=S.sesiones.filter(x=>semanaDe(x.f)===w && x.zona && x.zona!=='Ninguna' && x.dolor && x.dolor!=='—');
    if(mol.length) o+=`Molestias: ${mol.map(x=>`${fechaCorta(x.f)} ${x.zona} (${x.dolor})`).join(', ')}\n`;
    /* Los minutos totales ya van arriba; acá va QUÉ hizo, que desde que la
       modalidad la elige él es un dato y no un supuesto. */
    const car=S.cardio.filter(x=>semanaDe(x.f)===w && nz(x.min)>0);
    if(car.length) o+=`Cardio hecho: ${car.map(x=>`${fechaCorta(x.f)} ${x.tipo||'sin anotar'} ${nz(x.min)} min${nz(x.metros)?' · '+nz(x.metros)+' m':''}${nz(x.kcal)?' · '+nz(x.kcal)+' kcal':''}`).join(', ')}\n`;
    /* La comida, registro por registro. Lo SIN ESTIMAR va marcado: es
       exactamente lo que hay que completar desde el chat. */
    const dc=[...new Set((S.alimentos||[]).filter(x=>semanaDe(x.f)===w).map(x=>x.f))].sort();
    dc.forEach(fd=>{
      const cdd=comidaDia(fd);
      o+=`  Comida ${fechaCorta(fd)}: ${cdd.kcal??'-'} kcal · ${cdd.p??'-'} g prot · ${un(cdd.agua)??'-'} L agua${cdd.hayMan?' (total corregido a mano)':''}\n`;
      cdd.items.slice().sort((a,b)=>String(a.hora||'').localeCompare(String(b.hora||''))).forEach(x=>{
        o+=`    ${x.hora||'--:--'} ${x.txt}`;
        o+= x.ok ? ` [${x.nombre} ${x.gramos} g = ${x.kcal} kcal, ${x.p} g prot]\n`
                 : `   <-- SIN ESTIMAR${nz(x.kcal)>0?` (le puso ${x.kcal} kcal a mano)`:''}\n`;
      });
    });
    const ejs=[...new Set(S.fuerza.filter(x=>semanaDe(x.f)===w&&nz(x.reps)>0).map(x=>x.ej))];
    ejs.forEach(e=>{
      const st=S.fuerza.filter(x=>semanaDe(x.f)===w&&x.ej===e&&nz(x.reps)>0);
      o+=`  ${e}${st.some(x=>x.lugar==='gym')?' [gym]':''}: ${st.map(x=>`${nz(x.kg)>0?x.kg+'×':''}${x.reps}${x.rir!==''&&x.rir!==undefined?'@'+x.rir:''}`).join(', ')}\n`;
    });
    o+=`\n`;
  });
  return o;
}
