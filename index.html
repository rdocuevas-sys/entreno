<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de entrenamiento — casa</title>
<meta name="description" content="Plan de entrenamiento y alimentación — registro diario de cargas, comidas y medidas.">
<meta name="theme-color" content="#14201C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="mobile-web-app-capable" content="yes">

<style>
  /* ---- tipografías locales: van en el repo para que la app funcione sin señal ---- */
  @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;
    src:url(fonts/barlow-condensed-500.woff2) format('woff2')}
  @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;
    src:url(fonts/barlow-condensed-600.woff2) format('woff2')}
  @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;
    src:url(fonts/barlow-condensed-700.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;
    src:url(fonts/ibm-plex-mono-500.woff2) format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;
    src:url(fonts/ibm-plex-mono-600.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;
    src:url(fonts/inter-var.woff2) format('woff2')}
</style>

<style>
  :root{
    --paper:#EDF0EE;
    --card:#FFFFFF;
    --ink:#14201C;
    --ink-2:#4C5B55;
    --ink-3:#8896901a;
    --line:#D3DAD6;
    --pine:#1E5F4E;
    --pine-md:#7FB6A0;      /* el músculo que solo ayuda, en el mapa muscular */
    --pine-lt:#E4EFEA;
    --slate:#2C4A63;
    --amber:#B87614;
    --rust:#9E4B31;
    --r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.5;
    padding-bottom:40px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 14px}

  /* ---- header ---- */
  header{
    background:var(--ink);color:#EDF0EE;
    padding:18px 0 0;
    position:sticky;top:0;z-index:50;
    box-shadow:0 2px 14px rgba(20,32,28,.18);
  }
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:26px;letter-spacing:.04em;
    text-transform:uppercase;margin:0;
  }
  .brand span{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    color:#8FA79C;letter-spacing:.06em;
  }
  nav{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    background:none;border:0;color:#8FA79C;
    font-family:'Barlow Condensed',sans-serif;
    font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 14px;cursor:pointer;white-space:nowrap;
    border-bottom:3px solid transparent;
  }
  nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--pine)}
  nav button:focus-visible{outline:2px solid #6FB39C;outline-offset:-4px}

  /* ---- shared ---- */
  h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;letter-spacing:.03em;
     text-transform:uppercase;margin:22px 0 4px;font-weight:700}
  .lede{color:var(--ink-2);font-size:13.5px;margin:0 0 16px;max-width:62ch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
        padding:14px;margin-bottom:12px}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
           text-transform:uppercase;color:var(--ink-2)}
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  button.act{
    font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase;
    background:var(--pine);color:#fff;border:0;border-radius:8px;
    padding:10px 16px;cursor:pointer;
  }
  button.act:active{transform:translateY(1px)}
  button.ghost{background:none;color:var(--pine);border:1.5px solid var(--pine)}
  button.mini{padding:6px 10px;font-size:13px}
  input,select,textarea{
    font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:7px;
    padding:9px 10px;width:100%;
  }
  input[type=number]{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--pine);outline-offset:-1px;border-color:var(--pine)}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);
        text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:560px){.g4{grid-template-columns:1fr 1fr}}

  /* ---- day picker ---- */
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{
    flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:9px;
    padding:9px 13px;cursor:pointer;text-align:left;min-width:112px;
  }
  .day b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:17px;
         letter-spacing:.04em;text-transform:uppercase}
  .day small{color:var(--ink-2);font-size:11px}
  .day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .day[aria-pressed="true"] small{color:#8FA79C}
  /* días ya entrenados esta semana */
  .day.hecho{background:var(--pine-lt);border-color:var(--pine)}
  .day.hecho b{color:var(--pine)}
  .day.hecho[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
  .day.hecho[aria-pressed="true"] b{color:#fff}
  .aviso-dia{background:var(--pine-lt);border-left:3px solid var(--pine);
             padding:10px 13px;border-radius:0 8px 8px 0;font-size:13.5px;margin-bottom:12px}

  /* ---- exercise ---- */
  .ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      margin-bottom:10px;overflow:hidden}
  .ex-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;
           user-select:none;background:none;border:0;width:100%;text-align:left;font:inherit}
  .ex-idx{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2);
          border:1px solid var(--line);border-radius:5px;padding:3px 6px;flex:0 0 auto}
  .ex-name{flex:1;font-weight:600;font-size:15px;line-height:1.3}
  .ex-name em{display:block;font-style:normal;font-family:'IBM Plex Mono',monospace;
              font-size:11px;color:var(--pine);letter-spacing:.04em;margin-top:2px}
  .chev{color:var(--ink-2);font-size:13px;transition:transform .18s}
  .ex[data-open="1"] .chev{transform:rotate(90deg)}
  .ex-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
  .ex[data-open="1"] .ex-body{display:block}
  /* Casa / Gym */
  .lugar{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:3px;margin:0 0 10px}
  .lug{border:0;background:none;border-radius:7px;padding:9px 0;font:600 15px 'Inter',system-ui,sans-serif;
    color:var(--ink-2);cursor:pointer}
  .lug[aria-pressed="true"]{background:var(--pine);color:#fff}
  /* opciones de la casilla */
  .opcs{display:flex;flex-direction:column;gap:6px;margin:12px 0 4px}
  .opc{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
    font:400 14px 'Inter',system-ui,sans-serif;color:var(--ink)}
  .opc span{min-width:0}
  .opc small{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-2);white-space:nowrap}
  .opc[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-lt);font-weight:600;box-shadow:inset 0 0 0 1px var(--pine)}
  .toca{font-size:12.5px;color:var(--pine);margin:2px 0 6px}
  .ex.done .ex-idx{background:var(--pine);color:#fff;border-color:var(--pine)}

  .frames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}
  .frames.one{grid-template-columns:1fr;max-width:280px;margin-inline:auto}
  .frames.tres{grid-template-columns:repeat(3,1fr);gap:6px}
  .frames.tres.apilada{grid-template-columns:1fr;gap:6px;max-width:340px;margin-inline:auto}
  .frame.ilu{padding:2px;color:var(--ink)}
  .frame.ilu figcaption{padding:3px 0 0}
  .pieilu{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-2);
          margin:2px 0 4px}
  /* ---- mapa muscular ---- */
  .mus{display:flex;gap:14px;align-items:center;margin:12px 0 2px}
  .mus-cuerpos{display:flex;gap:2px;flex:0 0 auto}
  .mus-cuerpos svg{height:108px;width:auto;display:block}
  .mus-txt{min-width:0;font-size:12.5px;line-height:1.4}
  .mus-h{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;
         text-transform:uppercase;color:var(--pine);margin:0 0 6px}
  .mus-txt p{margin:0 0 5px;display:flex;gap:7px;align-items:baseline}
  .mus-txt p:last-child{margin-bottom:0}
  .mus-txt i{width:9px;height:9px;border-radius:2px;flex:0 0 auto;position:relative;top:1px}
  .mus-p{background:var(--pine)}
  .mus-s{background:var(--pine-md)}
  /* el mapa del día entero va arriba de la lista, separado de los ejercicios */
  .mus-dia{display:flex;gap:14px;align-items:center;
           border-top:1px solid var(--line);border-bottom:1px solid var(--line);
           padding:10px 0;margin:14px 0 2px}
  /* margin:0 NO es decorativo: el navegador le pone 1em/40px a todo <figure>,
     y con tres columnas en un teléfono esos 80 px se comían la mitad del cuadro
     — el dibujo quedaba en 55 px dentro de una celda de 139. */
  .frame{background:var(--pine-lt);border-radius:8px;padding:4px;position:relative;margin:0}
  .frame figcaption{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--pine);text-align:center;padding:2px 0 5px
  }
  .frame svg{display:block;width:100%;height:auto}
  .demo{display:inline-block;margin-top:10px;font-family:'IBM Plex Mono',monospace;
        font-size:11.5px;letter-spacing:.03em;color:var(--slate);text-decoration:none;
        border-bottom:1.5px solid var(--slate);padding-bottom:1px}
  .demo:hover{color:var(--pine);border-color:var(--pine)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;
          font-size:10.5px;color:var(--ink-2);margin:2px 0 4px}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
  .cue{font-size:13.5px;color:var(--ink-2);margin:6px 0 0;padding-left:12px;
       border-left:2px solid var(--pine)}

  table.sets{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  table.sets th{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;
                text-transform:uppercase;color:var(--ink-2);font-weight:500;
                text-align:center;padding:4px 2px}
  table.sets td{padding:3px 2px}
  table.sets input{padding:8px 4px;text-align:center}
  .prev{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate);
        background:#EAF0F5;border-radius:5px;padding:4px 8px;display:inline-block;margin-top:8px}

  /* ---- bars ---- */
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;background:var(--pine);border-radius:99px;transition:width .3s}
  .bar i.over{background:var(--amber)}
  .stat b{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;
          display:block;font-variant-numeric:tabular-nums}
  .stat small{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}

  table.tbl{width:100%;border-collapse:collapse;font-size:13px;
            font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  table.tbl th{background:var(--ink);color:#fff;font-size:10px;letter-spacing:.05em;
               text-transform:uppercase;padding:7px 5px;font-weight:600;text-align:right}
  table.tbl th:first-child,table.tbl td:first-child{text-align:left}
  table.tbl td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  .pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
        letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;
        background:var(--pine-lt);color:var(--pine)}
  .pill.warn{background:#FBF0DC;color:var(--amber)}
  .pill.bad{background:#F7E6E1;color:var(--rust)}
  .note{background:#FBF0DC;border-left:3px solid var(--amber);padding:11px 13px;
        border-radius:0 8px 8px 0;font-size:13.5px;margin-bottom:12px}
  /* ---- cierre de sesión: guardar y ver qué quedó guardado ---- */
  .guardar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
           background:var(--pine-lt);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .guardar button{flex:0 0 auto}
  .gstat{font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.5;
         color:var(--pine);flex:1 1 160px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);
         background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;
         opacity:0;transition:.25s;z-index:99;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .hide{display:none}
  /* ---- aviso de versión nueva ---- */
  .upd{position:fixed;left:12px;right:12px;bottom:14px;z-index:98;
       background:var(--pine);color:#fff;border-radius:var(--r);
       padding:12px 14px;display:flex;align-items:center;gap:12px;
       box-shadow:0 6px 22px rgba(20,32,28,.28);
       transform:translateY(120px);opacity:0;transition:.28s;pointer-events:none}
  .upd.on{transform:translateY(0);opacity:1;pointer-events:auto}
  .upd p{margin:0;font-size:13.5px;flex:1}
  .upd button{background:#fff;color:var(--pine);border:0;border-radius:8px;
              padding:9px 14px;font:600 13px 'Inter',sans-serif;cursor:pointer}
  @media(min-width:700px){.upd{left:auto;right:18px;width:380px}}
  /* ---- cronómetro de descanso ---- */
  /* El aviso de versión nueva vive en la misma esquina: si los dos aparecen
     juntos, el aviso sube y el cronómetro se queda abajo, a mano del pulgar. */
  .upd.subido{bottom:96px}
  .crono{position:fixed;left:12px;right:12px;bottom:14px;z-index:98;
         background:var(--ink);color:#fff;border-radius:var(--r);
         padding:10px 14px;display:flex;align-items:center;gap:10px;
         box-shadow:0 6px 22px rgba(20,32,28,.28);
         transform:translateY(120px);opacity:0;transition:.28s;pointer-events:none}
  .crono.on{transform:translateY(0);opacity:1;pointer-events:auto}
  .crono-t{font-family:'IBM Plex Mono',monospace;font-size:26px;font-variant-numeric:tabular-nums;
           letter-spacing:.02em;min-width:74px}
  .crono-e{flex:1;font-size:12px;line-height:1.35;opacity:.75}
  .crono button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;
                padding:8px 11px;font:600 12.5px 'Inter',sans-serif;cursor:pointer}
  .crono button:active{transform:translateY(1px)}
  /* al llegar a cero deja de ser un cronómetro y pasa a ser un aviso */
  .crono.listo{background:var(--rust)}
  .crono.listo .crono-e{opacity:.95}
  @media(min-width:700px){.crono{left:auto;right:18px;width:380px}}
  /* ---- descanso, sugerencia e historial dentro del ejercicio ---- */
  .fila-ex{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
  .sug{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--pine);
       background:var(--pine-lt);border-radius:6px;padding:5px 9px;line-height:1.5}
  .hist{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .hist table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
  .hist td{padding:3px 0;vertical-align:top;color:var(--ink-2)}
  .hist td:first-child{width:64px;color:var(--slate);white-space:nowrap}
  /* ---- gráficos ---- */
  /* el SVG escala también sus textos: sin tope, en pantalla ancha el gráfico
     se ve gigante y las etiquetas enormes */
  /* la fila de "qué comiste": el texto manda y se estira, la hora y el botón
     conservan su tamaño; bajo 380 px el botón cae solo a la línea siguiente */
  .addcom{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  /* cada cosa que comió, en dos líneas: arriba la hora y el texto suyo,
     abajo la cantidad, lo que se reconoció y el estimado */
  .com-item{border-top:1px solid var(--line);padding:9px 0}
  .com-item:first-child{border-top:0;padding-top:0}
  .com-l1{display:flex;gap:8px;align-items:baseline}
  .com-hora{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate);
            flex:0 0 40px}
  .com-txt{flex:1 1 auto;min-width:0;font-size:14.5px;overflow-wrap:anywhere}
  .com-l1 button{flex:0 0 auto}
  .com-l2{display:flex;gap:9px;align-items:center;flex-wrap:wrap;
          margin-top:5px;padding-left:48px}
  .com-cant{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-2)}
  .com-l2 input{width:52px;padding:4px 6px;font-size:13px}
  .com-det{font-size:11.5px;color:var(--ink-2)}
  .com-num{margin-left:auto;display:flex;gap:5px;align-items:center;
           font-family:'IBM Plex Mono',monospace;font-size:11.5px;
           color:var(--pine);font-weight:600}
  .addcom input[type=text]{flex:1 1 170px;min-width:0}
  .addcom input[type=time]{flex:0 0 112px}
  .addcom button{flex:0 0 auto}
  /* ---- lo que repite: botones de un toque ----
     El chip es DOS botones pegados (usar / borrar) y no uno con una ✕ encima,
     para que el área de toque de cada uno sea de verdad tocable con el pulgar. */
  .rep{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
  .rep-t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
         color:var(--ink-2);margin:2px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{display:inline-flex;align-items:stretch;border:1px solid var(--pine);
        border-radius:999px;overflow:hidden;max-width:100%}
  .chip button{background:var(--pine-lt);color:var(--pine);border:0;border-radius:0;
        font-size:12.5px;font-weight:600;padding:6px 11px;min-height:32px;
        max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip button small{font-weight:500;opacity:.7}
  .chip button.x{padding:6px 9px;border-left:1px solid var(--pine);font-weight:400}
  button.peq{font-size:12.5px;padding:7px 12px}
  .pasos{margin:10px 0 4px;padding-left:20px;font-size:13px;color:var(--ink-2);line-height:1.55}
  .pasos li{margin-bottom:7px}
  .pasos code,.card code{font-family:'IBM Plex Mono',monospace;font-size:12px;
       background:var(--pine-lt);color:var(--pine);padding:1px 5px;border-radius:4px}
  summary.lnk{cursor:pointer;font-size:13px;font-weight:600;color:var(--pine);margin-bottom:4px}
  /* aviso de respaldo: el recuadro en Resumen y el punto en la pestaña */
  .aviso-resp{background:#FDF3E3;border-left:3px solid #B4722A;color:#5A3C12;
              border-radius:8px;padding:11px 13px;margin-top:12px;font-size:13px;line-height:1.45}
  .punto{display:inline-block;width:6px;height:6px;border-radius:50%;
         background:#B4722A;vertical-align:super;margin-left:4px}
  .graf{margin:4px 0 14px;max-width:430px}
  .graf svg{width:100%;height:auto;display:block}
  .graf-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
          font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--slate)}

   1. DIBUJO DE EJERCICIOS  (SVG generado, sin imágenes externas)
   ============================================================ */
const VB = '0 0 200 152';
const I = 'var(--ink)';
const R = 'var(--rust)';
function ln(a,b,w,c,op){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c||I}" stroke-width="${w||5}" stroke-linecap="round"${op?` opacity="${op}"`:''}/>`}
function cir(c,r,fill,w,st){return `<circle cx="${c[0]}" cy="${c[1]}" r="${r}" fill="${fill||'none'}" stroke="${st||I}" stroke-width="${w===undefined?3.5:w}"/>`}
function box(x,y,w,h,fill,rot,cx,cy){
  const t = rot?` transform="rotate(${rot} ${cx} ${cy})"`:'';
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${fill||'#fff'}" stroke="${I}" stroke-width="3"${t}/>`}
function floor(y){y=y||142;return ln([6,y],[194,y],2.5,I,.4)}
function mat(){return box(24,136,152,7,'#fff')}
function bench(x,y,w){return box(x,y,w,9,'#fff')+ln([x+9,y+9],[x+9,142],4)+ln([x+w-9,y+9],[x+w-9,142],4)}
function guide(a,b){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${R}" stroke-width="2" stroke-dasharray="5 4" opacity=".7"/>`}

/* --- flecha de recorrido --- */
function arrow(a,b,bend){
  bend=bend||0;
  const mx=(a[0]+b[0])/2+bend, my=(a[1]+b[1])/2;
  const ang=Math.atan2(b[1]-my,b[0]-mx), h=7.5;
  const p1=[b[0]-h*Math.cos(ang-.45), b[1]-h*Math.sin(ang-.45)];
  const p2=[b[0]-h*Math.cos(ang+.45), b[1]-h*Math.sin(ang+.45)];
  return `<path d="M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}" fill="none" stroke="${R}" stroke-width="2.8" stroke-linecap="round"/>`
       + `<path d="M${p1[0]} ${p1[1]} L${b[0]} ${b[1]} L${p2[0]} ${p2[1]}" fill="none" stroke="${R}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`;
}

/* --- equipamiento --- */
function plate(c){return cir(c,11,'var(--pine)',3)+cir(c,3,'#fff',0)}
function dbS(c){return box(c[0]-6,c[1]-9,12,18,'var(--pine)')}
function dbF(c){return box(c[0]-8,c[1]-5,16,10,'var(--pine)')}
function barF(a,b){return ln(a,b,6)+box(a[0]-4,a[1]-11,8,22,'var(--pine)')+box(b[0]-4,b[1]-11,8,22,'var(--pine)')}
function equip(kind,p,view){
  if(!kind) return '';
  if(view==='F'){
    if(kind==='dbF') return dbF(p.hL)+dbF(p.hR);
    if(kind==='barF') return barF(p.hL,p.hR);
    return '';
  }
  if(kind==='plate') return plate(p.hn);
  if(kind==='dbS')   return dbS(p.hn);
  if(kind==='dbS2')  return dbS(p.hn)+dbS([p.hn[0]+24,p.hn[1]]);
  /* De perfil, una mancuerna con agarre neutro (palma hacia adentro) se ve
     a lo largo, no de canto: por eso va la forma horizontal. */
  if(kind==='dbH')   return dbF(p.hn);
  /* Las dos manos dibujadas por separado, cada una con su mancuerna. */
  if(kind==='dbDual')return dbS(p.hn)+(p.hn2?dbS(p.hn2):'');
  return '';
}

/* --- figuras --- */
function figS(j,ghost){
  const op = ghost?.22:null, c = ghost?'#9AA8A2':I, w=ghost?1:undefined;
  let s = ln(j.hp,j.sh,7,c,op)+ln(j.sh,j.hd,4.5,c,op)
        + ln(j.sh,j.el,5,c,op)+ln(j.el,j.hn,5,c,op)
        + ln(j.hp,j.kn,6,c,op)+ln(j.kn,j.ft,6,c,op);
  if(j.kn2) s += ln(j.hp,j.kn2,6,c,op)+ln(j.kn2,j.ft2,6,c,op);
  if(j.el2) s += ln(j.sh,j.el2,5,c,op)+ln(j.el2,j.hn2,5,c,op);
  s += ghost ? cir(j.hd,8.5,'none',2,'#9AA8A2') : cir(j.hd,8.5,'#fff');
  if(!ghost && j.fc) s += cir([j.hd[0]+j.fc[0]*5.5, j.hd[1]+j.fc[1]*5.5],2,I,0);
  return ghost?`<g opacity=".55">${s}</g>`:s;
}
function figF(j,ghost){
  const op = ghost?.22:null, c = ghost?'#9AA8A2':I;
  let s = ln(j.hp,j.sh,7,c,op)+ln(j.sh,j.hd,4.5,c,op)+ln(j.sL,j.sR,6,c,op)
        + ln(j.sL,j.eL,5,c,op)+ln(j.eL,j.hL,5,c,op)
        + ln(j.sR,j.eR,5,c,op)+ln(j.eR,j.hR,5,c,op)
        + ln(j.hp,j.kL,6,c,op)+ln(j.kL,j.fL,6,c,op)
        + ln(j.hp,j.kR,6,c,op)+ln(j.kR,j.fR,6,c,op);
  s += ghost ? cir(j.hd,8.5,'none',2,'#9AA8A2') : cir(j.hd,8.5,'#fff');
  if(!ghost) s += cir([j.hd[0]-3,j.hd[1]-1],1.7,I,0)+cir([j.hd[0]+3,j.hd[1]-1],1.7,I,0);
  return ghost?`<g opacity=".55">${s}</g>`:s;
}
function svg(inner){return `<svg viewBox="${VB}" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`}

/* --- render de un cuadro --- */
function frame(key,idx){
  const e=EX[key]; if(!e) return '';
  const solo = e.p.length===1;
  let s = e.bg?e.bg():'';
  if(idx===0 && e.bgA) s+=e.bgA();
  if(idx===1 && e.bgB) s+=e.bgB();
  if(e.custom) return svg(s+e.custom()+(e.guideTop?e.guideTop():''));
  const me=e.p[idx], other=solo?null:e.p[1-idx];
  if(other){
    s += (e.v==='F'?figF(other,1):figS(other,1));
  }
  s += equip(e.eq,me,e.v);
  s += (e.v==='F'?figF(me):figS(me));
  if(e.post) s += e.post(me);
  if(e.ar) e.ar.forEach(a=>{ s+=arrow(a[0],a[1],a[2]); });
  return svg(s);
}
/* ---- ilustraciones ----
   Cada cuadro es UNA ruta sobre un lienzo de 512x512, pintada con
   currentColor: por eso toma el color de la app y no hay que tener dos
   versiones para el modo claro y el oscuro.
   Dos ejercicios NO tienen ilustración a propósito y se quedan con el dibujo
   de palitos: el pull-over, que no existe en la biblioteca, y la elevación de
   talones, cuyas versiones traen todas una máquina o una barra al hombro —
   y acá se hace con mancuernas y sin rack. */
const hayImg = k => typeof EJ_IMG !== 'undefined' && Array.isArray(EJ_IMG[k]) && EJ_IMG[k].length > 0;
/* El lienzo original es 512x512 y la figura ocupa como la mitad: usada tal cual
   sale minuscula. EJ_VB trae el recorte, UNO por ejercicio y no por cuadro,
   para que la persona no cambie de tamano entre un cuadro y el siguiente. */
function imgEj(k){
  const vb = (typeof EJ_VB!=='undefined' && EJ_VB[k]) || '0 0 512 512';
  return EJ_IMG[k].map(d =>
    `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">`
    + `<path fill="currentColor" fill-rule="evenodd" d="${d}"/></svg>`);
}
/* Una postura tumbada (plancha, hollow, puente) es mucho mas ancha que alta:
   en tres columnas quedaria una franja de 40 px. Esas van una debajo de otra. */
function imgAncha(k){
  const vb = (typeof EJ_VB!=='undefined' && EJ_VB[k]) || '';
  const p = vb.split(' ').map(Number);
  return p.length===4 && p[3]>0 && p[2]/p[3] > 1.6;
}
/* ---- mapa muscular ----
   El cuerpo de frente y de espalda con lo que trabaja el ejercicio pintado.
   Va SIEMPRE con los nombres escritos al lado: un polígono de color sin
   nombre no enseña qué músculo es. */
function mapaMus(k){
  if(!k || typeof EJ_MUS === 'undefined') return '';
  return dibujoMus(EJ_MUS[k], 'Qué trabaja', 'mus');
}
/* La suma del DÍA entero, arriba de la lista: qué te toca hoy de un vistazo,
   sin abrir los ejercicios uno por uno.
   Un músculo que es principal en CUALQUIER ejercicio del día es principal del
   día: si algo se entrena directo aunque sea una sola vez, el día lo entrena
   directo, y degradarlo a "ayuda" porque los otros ocho no lo tocan diría lo
   contrario de lo que pasa. El cardio y el suelo pélvico no tienen entrada en
   EJ_MUS, así que se quedan fuera solos. */
function mapaMusDia(id){
  const p = new Set(), s = new Set();
  /* con la opción que toca hoy, no con la del PLAN: en el gym el día puede
     trabajar otra cosa que en la casa */
  planHoy(id).map(x=>x.e).forEach(e=>{
    const m = (typeof EJ_MUS!=='undefined' && EJ_MUS[e.d]) || null;
    if(!m) return;
    (m.p||[]).forEach(x=>p.add(x));
    (m.s||[]).forEach(x=>s.add(x));
  });
  return dibujoMus({p:[...p], s:[...s].filter(x=>!p.has(x))}, `Todo el día ${id}`, 'mus mus-dia');
}
function dibujoMus(m, titulo, cls){
  if(!m || typeof CUERPO === 'undefined') return '';
  const pri = new Set(m.p), sec = new Set(m.s);
  const vista = v => {
    let g = '';
    Object.keys(CUERPO[v]).forEach(mus=>{
      const c = pri.has(mus) ? 'var(--pine)' : sec.has(mus) ? 'var(--pine-md)' : 'var(--line)';
      CUERPO[v][mus].forEach(pol=>{
        g += `<polygon points="${pol}" fill="${c}" stroke="var(--card)" stroke-width=".5"/>`;
      });
    });
    return `<svg viewBox="0 0 100 220" role="img" aria-hidden="true">${g}</svg>`;
  };
  /* dos músculos del modelo pueden compartir nombre (los dos hombros, el
     tríceps que sale de frente y de espalda): se nombran una sola vez */
  const nom = l => [...new Set(l.map(x=>MUS_NOMBRE[x]).filter(Boolean))].join(', ');
  const p1 = nom(m.p), p2 = nom(m.s);
  if(!p1 && !p2) return '';
  return `<div class="${cls}">
    <div class="mus-cuerpos">${vista('anterior')}${vista('posterior')}</div>
    <div class="mus-txt">
      <p class="mus-h">${titulo}</p>
      ${p1?`<p><i class="mus-p"></i><b>${p1}</b></p>`:''}
      ${p2?`<p><i class="mus-s"></i>${p2}<span class="prev" style="margin-left:4px">(ayudan)</span></p>`:''}
    </div>
  </div>`;
}
function frames(key){
  if(hayImg(key)) return imgEj(key);
  const e=EX[key]; if(!e) return null;
  return e.p.length===1?[frame(key,0)]:[frame(key,0),frame(key,1)];
}

  c:'Va en lugar de la plancha frontal: la plancha no tenía cómo ponerse más difícil y esto se sube de a 2,5 kg. Acostado, rodillas dobladas y pies en el suelo, el disco abrazado contra el pecho. Sube enrollando la columna —cabeza, hombros, espalda alta— hasta despegar los omóplatos, aprieta un segundo arriba y baja en 3 segundos. La espalda baja no se despega del suelo: no es un sit-up. Trabaja el abdomen de arriba del ombligo. Parte con 5 kg; cuando saques 15 limpias con RIR 1, pasa al disco siguiente. Más adelante, con el disco por detrás de la cabeza y los brazos estirados pesa mucho más sin cambiar de disco. Ojo con el dibujo: ahí es con una kettlebell; tú abrazas un disco, y el recorrido es el mismo.'},

 {n:'Crunch inverso con mancuerna',s:3,r:'12-15',rir:1,rest:'45 s',d:'crunchInv',
  c:'Va en lugar del dead bug, y es el que apunta al abdomen de ABAJO del ombligo. Acostado, manos a los costados con las palmas en el suelo, una mancuerna apretada entre los pies y las rodillas dobladas en 90°. Lleva las rodillas hacia el pecho hasta que la cadera se despegue del suelo y se enrolle hacia arriba: ese último tramo, cuando la pelvis se mete, es el que trabaja el abdomen bajo; solo subir las piernas es flexor de cadera. Baja en 3 segundos hasta que los pies casi toquen el suelo, sin arquear la lumbar. No va colgado de la barra porque viene después del peso muerto y el agarre ya llega gastado. Parte con 5 kg; cuando saques 15 limpias, sube la mancuerna. Si se te resbala, cruza los tobillos alrededor del mango.'},
 {n:'CARDIO — a tu elección',cardio:1,s:1,r:'12 min',sug:'Trotadora',rest:'—',

 {n:'Dominada en la barra',s:3,r:'6-8',rir:2,rest:'2 min',d:'dominada',

/* ---- Día E: core con kettlebell + barra ----
   FUSIÓN del 14-sep-2026. El E era "cardio + core" con core isométrico y sin
   carga; el F era el día de kettlebell, suelto y fuera de la rueda. Se juntan

   al reemplazar a uno que ya estaba, deja de serlo.
   Criterio de la fusión: donde dos ejercicios ocupaban la misma casilla del
   core se queda el que tiene CARGA y con qué subirla, porque el isométrico no
   tiene escalón. Por eso el halo reemplaza al hollow (anti-extensión), la
   marcha cargada a la plancha lateral (anti-inclinación) y el crunch con
   kettlebell al crunch bicicleta (flexión). El puente de glúteo se queda: es
   lo único de cadena posterior y no se pisa con nada.
   La elevación de piernas sube de escalón y pasa a colgada de la barra.
   ⚠14-sep, más tarde: pidió un SEGUNDO abdominal en la barra. Entró la
   elevación de rodillas OBLICUA, que cubre la única casilla que al día le

   (aguantar la rotación, no producirla) y por eso no se pisan. Se descartaron
   el toes-to-bar, que es el mismo patrón que la elevación de piernas con más
   rango, y el limpiaparabrisas, que exige sostener las piernas estiradas
   arriba colgado y todavía no puede.
   🔑Los dos colgados van SEGUIDOS para no repartir el agarre por todo el día,
   y la marcha cargada queda después, avisada de que llega con el agarre más
   gastado que antes. */
E:[
 {n:'Halo de rodillas con kettlebell',s:4,r:'10',rest:'60 s',d:'halo',sinDibujo:1,
  busca:'kneeling halo kettlebell exercise',
  c:'De rodillas, las dos apoyadas y el cuerpo recto desde la rodilla hasta la cabeza — nada de sentarse sobre los talones. La kettlebell agarrada por los cuernos y boca abajo, a la altura del pecho. Das una vuelta completa alrededor de la cabeza, pegada al cráneo, y vuelves por el otro lado; 10 son 5 para cada sentido. Lo que entrena no es el hombro, es lo que NO se mueve: cuando la pesa pasa por detrás de la cabeza te tira hacia atrás, y el abdomen y el glúteo tienen que apretar para que la lumbar no se arquee. Si te vas de espaldas o se te sale la costilla, bajaste la guardia y ahí se acabó la serie. Estar de rodillas es a propósito: te saca las piernas de la ecuación y el trabajo no se puede escapar a otro lado. Con la de 8 sobra — acá no se busca peso, se busca que nada se mueva. La de 20 es demasiado para esto: el salto entre tus dos kettlebells es de 12 kg, y cuando la de 8 te quede corta el paso intermedio es un disco de 10 kg tomado con las dos manos. Ocupa el lugar que tenía el hollow hold: los dos aguantan que la espalda no se arquee, pero este lo hace con peso en las manos y el hollow no tenía cómo ponerse más difícil.'},
 {n:'Iron trident con kettlebell',s:4,r:'10',rest:'60 s',d:'trident',sinDibujo:1,
  busca:'iron trident kettlebell core exercise',
  c:'Es el del reel que me mandaste, de Iestyn Williams. Sentado en el suelo, piernas estiradas y abiertas en V, pecho arriba y espalda recta — no echado hacia atrás. La kettlebell tomada por el asa. Una repetición son TRES toques: la apoyas en el suelo al costado de la cadera derecha, la levantas, la pasas entre las piernas y la apoyas ahí con una pausa, y la llevas al costado de la cadera izquierda. Y de vuelta. Va LENTO y apoyándola de verdad cada vez: si se convierte en un giro rápido de lado a lado dejaste de entrenar el core y empezaste a usar el impulso. Lo que trabaja es AGUANTAR la rotación, no hacerla. Empieza con la de 8, porque lo que se te va a cansar primero es la espalda baja sosteniendo el torso y la tuya es lo más flojo que tienes; cuando aguantes las 4 series con el pecho arriba de principio a fin, no saltes directo a la de 20, que son 12 kg más: el paso del medio es una mancuerna de 12,5 o 15 kg tomada por un extremo.'},
 {n:'Crunch con kettlebell en el pecho',s:4,r:'10-12',rir:1,rest:'60 s',d:'crunchKB',
  c:'Tu único abdominal con CARGA y con manera de subirla, que es justo lo que no tenías. Acostado, rodillas dobladas, la kettlebell abrazada contra el pecho. Sube enrollando la columna de a poco —primero la cabeza, después los hombros, después la espalda alta— hasta despegar los omóplatos, y baja en 3 segundos sin soltarte de golpe. No es un sit-up: la espalda baja no se despega del suelo en ningún momento. Parte con la de 8; cuando saques 12 limpias con RIR 1, pasa a una mancuerna de 12,5 o 15 kg abrazada igual, y recién después a la de 20. Y cuando la de 20 también te quede corta, no busques otra pesa — súbela por detrás de la cabeza con los brazos estirados: la palanca se alarga y pesa mucho más sin cambiar de kettlebell. Ocupa el lugar del crunch bicicleta, que hacía lo mismo sin peso y sin escalón.'},
 {n:'Elevación de piernas colgado',s:3,r:'10-15',rest:'60 s',d:'piernasColgado',
  c:'Este es el que destraba tu barra nueva. Colgado es bastante más duro que en el suelo, porque abajo la colchoneta te aguantaba media espalda y acá no te aguanta nada. Cuélgate con agarre prono y los hombros ACTIVOS —hundidos, alejando las orejas de las manos—: colgando flojo, el trabajo se te va a los hombros y a la espalda baja. Sube las piernas hasta que la cadera se enrolle un poco hacia arriba; el truco es justo ese, si solo levantas las piernas hasta la horizontal estás usando el flexor de la cadera y casi nada de abdomen, y lo que hace trabajar al abdomen de abajo es el último tramo, cuando la pelvis se mete hacia dentro. Baja en 3 segundos, controlado, hasta quedar estirado del todo. Lo que arruina el ejercicio es el balanceo: si vuelves columpiándote, el rebote hace el trabajo. Si te pasa, para, espera a quedarte quieto y arranca de nuevo. PARTE CON LAS RODILLAS DOBLADAS hacia el pecho; cuando saques 15 así en las tres series, estira las piernas y vuelves a empezar con menos repeticiones. A 90 kg el agarre te va a fallar antes que el abdomen las primeras semanas — no es que lo estés haciendo mal, es que colgarse entero es agarre, y eso también se entrena. Ojo con el dibujo: el cuadro del medio es la versión con las piernas estiradas, que es a donde vas; tú empiezas como el primero, con las rodillas dobladas.'},
 {n:'Elevación de rodillas oblicua colgado',s:3,r:'10-12 total',rest:'45 s',d:'oblicuoColgado',sinDibujo:1,
  busca:'hanging oblique knee raise exercise',
  c:'El segundo de la barra, y va pegado al anterior a propósito: los dos colgados juntos, para no repartir el agarre por todo el día. Cuelga igual que en el de arriba —agarre prono, hombros hundidos y activos— pero ahora, en vez de subir las rodillas al frente, las subes hacia un COSTADO, apuntando el par de rodillas juntas hacia la axila del mismo lado; bajas controlado y repites hacia el otro. Alternas, y 10-12 son el total contando los dos lados. Lo que entrena es lo único que al día le faltaba: los oblicuos ACORTÁNDOSE bajo carga. Ojo con la diferencia, porque es toda la gracia de tenerlo junto al iron trident: en el trident aguantas para que el tronco NO gire, y acá giras a propósito y controlas la vuelta. Son las dos caras de la misma moneda y por eso no se pisan. Tres avisos. Uno: sube las rodillas, no te descuelgues de lado — si el torso se va para el lado contrario haciendo contrapeso, dejaste de usar el oblicuo y te estás columpiando. Dos: LENTO, sobre todo la bajada; si vuelves de golpe el rebote hace el trabajo y además te sacude la espalda baja. Tres: si empiezas a girar con el cuerpo entero en vez de con la cintura, se acabó la serie. Empieza con las rodillas dobladas, igual que el anterior. El escalón, para dentro de varios meses, es el limpiaparabrisas: piernas estiradas arriba y bajarlas de lado a lado — no lo intentes hasta que sostengas las piernas estiradas arriba sin que se te caigan, porque antes de eso no es una progresión, es una forma de hacerte daño en la lumbar.'},
 {n:'Marcha cargada a una mano',s:4,r:'12',rest:'45 s',d:'marchaCargada',sinDibujo:1,
  busca:'farmer carry march single arm kettlebell',
  c:'La kettlebell en UNA mano, colgando al costado como una maleta, y marchas en el sitio subiendo la rodilla hasta la altura de la cadera; 12 son 6 por pierna. Terminas, cambias de mano y repites — esa es una serie. Es el paseo del maletero con una vuelta de tuerca: al levantar una pierna te quedas en apoyo simple, y el costado tiene que trabajar mucho más para que la cadera no se te caiga hacia el lado libre. Hombros parejos y atrás, mirada al frente, y la rodilla sube LENTO: no es trotar en el sitio. Si te inclinas hacia el lado del peso, la pesa es mucho. Carga oblicuos, el glúteo de la pierna que apoya, antebrazo y agarre. Ocupa el lugar de la plancha lateral: las dos impiden que la cadera se caiga de lado, pero esta lo hace con peso, de pie y en movimiento. Un aviso de orden: vienes de DOS ejercicios colgado, así que el agarre llega bastante cansado — si se te escapa la pesa antes de las 12, termina la serie con la mancuerna de 15 en vez de acortarla. La de 8 es demasiado poco: no le pide nada al costado. Es la primera que va a notar el ejercicio nuevo.'},
 {n:'Puente de glúteo',s:3,r:'15',rest:'30 s',d:'puente',
  c:'El único superviviente del día E viejo, y se queda porque no se pisa con nada de lo de arriba: todo lo demás del día te dobla o te aguanta el tronco por delante y por los lados, y esto es lo único que empuja la cadera por detrás. Acostado, rodillas dobladas y pies plantados cerca del glúteo. Empuja con los TALONES, no con la punta, y sube hasta que el cuerpo quede recto del hombro a la rodilla; aprieta el glúteo un segundo arriba y baja controlado. Si lo sientes en la espalda baja en vez del glúteo, estás subiendo de más: arquear la lumbar no es más rango, es otro ejercicio. Mete un poco el ombligo antes de empujar y se acomoda solo.'},
 {n:'Press de tríceps sobre la cabeza con kettlebell',s:3,r:'10-12',rir:1,rest:'75 s',d:'tricepsCabeza',
  c:'De pie o sentado en la banca, la kettlebell agarrada por los cuernos —los dos lados del asa— con las dos manos y subida sobre la cabeza. Codos apuntando al techo y pegados a las orejas: solo se mueve el antebrazo. Baja la pesa por detrás de la nuca todo lo que puedas y sube estirando el codo. Es distinto del press francés del día A: acá el brazo está vertical, así que el tríceps se estira entero, y esa posición estirada bajo carga es la que deja agujetas. Aprieta glúteo y abdomen para que la lumbar no se arquee con el peso arriba. Parte con la de 8. Ojo con el dibujo: ahí la pesa es una mancuerna tomada por la punta; tú agarras la kettlebell por los cuernos, pero la postura y el recorrido son exactamente esos.'},
 {n:'Curl a dos manos con kettlebell',s:3,r:'10-12',rir:1,rest:'75 s',d:'curlKB',
  c:'Los 20 kg de la kettlebell son más carga de la que puedes ponerle a un curl: tus mancuernas topan en 15. Agárrala por el asa con las dos manos, codos pegados al costado y quietos, y sube sin balancear el tronco. La campana cuelga por debajo de las manos, así que te tira hacia adelante más que una mancuerna y te obliga a fijar el codo de verdad. Baja en 2 segundos. Ojo con el dibujo: ahí van dos mancuernas, una en cada mano y alternando; tú llevas UNA kettlebell con las dos manos juntas y subes las dos a la vez.'},
 {n:'CARDIO — a tu elección',cardio:1,s:1,r:'20 min',sug:'Bicicleta estática',rest:'—',
  c:'Veinte minutos, que es el punto medio entre los 30 que tenía el día E y los 10 que tenía el de kettlebell: el día ya trae ocho bloques cargados y con 30 terminabas saltándotelo, pero bajar a 10 te costaba veinte minutos de cardio a la semana justo en lo que más te importa. Continuo y tranquilo, o en bloques de 90 segundos fuertes con 60 de pausa. Una advertencia de orden: hoy NO elijas cuerda ni remo. Te acabas de colgar de la barra y de marchar con la pesa en la mano, así que tienes el antebrazo y el agarre cocidos, y los dos dependen justo de eso — te va a fallar la mano antes que las piernas y vas a cortar el cardio por el motivo equivocado. Bicicleta, trotadora o caminata: piernas, que están frescas.'}
],

 {n:'Elevación de piernas acostado',s:3,r:'12-15',rest:'45 s',d:'piernasArriba',

/* Suelo pélvico. Va en TODOS los días (Object.keys, así entra solo en los
   que se agreguen después) porque el protocolo es diario, no por
   grupo muscular — y en los días que no entrena, el propio texto se lo dice.
   Sin dibujo a propósito: es una contracción interna, un monigote no enseña
   nada acá; lo enseña el texto. Y sin columna de peso, porque no hay peso. */
const SUELO = {
  n:'Suelo pélvico (Kegels)', s:3, r:'10 contracciones', rest:'45 s', sinPeso:1, tag:'SP',
  c:'Contrae el músculo que usarías para cortar el chorro de orina, o para subir los testículos hacia adentro. No aprietes glúteo, abdomen ni muslos, y no aguantes la respiración: si algo se mueve por fuera, estás usando el músculo equivocado. Cada serie son 10 contracciones aguantando 6-8 segundos, descansando el doble de lo que aguantaste; al terminar la última serie, remata con 10 contracciones rápidas de 1 segundo. Empieza acostado, que es lo fácil; cuando te salgan limpias, hazlas sentado, y después de pie. Es lo único con evidencia real para una erección más firme — el músculo comprime la base del pene y es lo que sostiene la presión una vez que ya hay erección — y de paso te cuida la continencia para más adelante. Hazlo TAMBIÉN los días que no entrenas: el protocolo es diario y los resultados aparecen entre la semana 4 y la 6, no antes. Dos avisos: corta el chorro de verdad una sola vez, solo para ubicar el músculo (hacerlo seguido deja la vejiga a medio vaciar), y no andes apretando todo el día — un suelo pélvico permanentemente tenso empeora las cosas en vez de mejorarlas.'
};
Object.keys(PLAN).forEach(k=>PLAN[k].push({...SUELO}));

   {n:'Curl inverso con barra',d:'curlInverso',
    c:'La barra tomada con las palmas hacia abajo. Codos pegados al costado; sube y baja en 2 segundos. Carga el músculo de encima del codo y el antebrazo, igual que el martillo. Vas a mover bastante menos que en el curl normal.'}],
  gym:['=',
   {n:'Curl martillo en polea con cuerda',d:'martilloCuerda',
    c:'Polea abajo con la cuerda, palmas enfrentadas. Codos pegados al costado; sube la cuerda hasta el pecho y baja lento. Es el martillo con tensión en todo el recorrido.'},
   {n:'Curl inclinado con mancuernas',d:'curlIncl',
    c:'Sentado en un banco inclinado a unos 45°, los brazos colgando hacia atrás. Sube las mancuernas sin adelantar los codos y baja hasta estirar del todo. Empezar con el brazo detrás del cuerpo estira el bíceps más que de pie: vas a usar menos peso.'}]},
 'Pájaros con mancuernas':{t:'Hombro de atrás',
  casa:[
   {n:'Pájaros boca abajo en la banca',d:'pajarosBanca',busca:'chest supported rear delt fly',
    c:'Acostado boca abajo en la banca, una mancuerna liviana en cada mano colgando. Abre los brazos hacia los costados con los codos un poco doblados hasta la línea de la espalda, aprieta 1 segundo y baja. Con el pecho apoyado no hay forma de usar el impulso de la cadera.'}],
  gym:[
   {n:'Contractor inverso',d:'pecDeckInv',
    c:'El pec deck sentado al revés, con el pecho contra el respaldo. Manijas a la altura de los hombros; abre los brazos hacia atrás con los codos un poco doblados hasta la línea del cuerpo y vuelve lento. Sin encoger los hombros. Ojo con el dibujo: ahí está sentado con la espalda en el respaldo; tú vas con el pecho contra el respaldo.'},
   {n:'Face pull en polea',d:'facePull',
    c:'Polea a la altura de la cara con la cuerda. Tira hacia la frente separando las puntas de la cuerda, codos altos, hasta que las manos queden a los lados de las orejas. Aprieta las escápulas y vuelve lento. Además del hombro de atrás, cuida el hombro de todo el empuje del día A.'},
   '=']}
},
C:{
 'Sentadilla búlgara con mancuernas':{t:'Pierna, a una pierna',
  casa:[
   {n:'Zancada atrás con mancuernas',d:'zancadaAtras',
    c:'De pie con una mancuerna en cada mano. Da un paso largo atrás y baja hasta que la rodilla de atrás quede a un palmo del suelo, torso vertical; empuja con el talón de adelante para volver. Alterna o haz todas de un lado: 10-12 son POR PIERNA. No necesita la banca.'}],
  gym:['=',
   {n:'Sentadilla búlgara en máquina Smith',d:'bulgaraSmith',
    c:'La búlgara con la barra guiada sobre los hombros y el pie de atrás en un banco. Como la barra no se cae para ningún lado, puedes cargar mucho más que con tus mancuernas. Baja hasta que la rodilla de atrás quede a un palmo del suelo y empuja con la pierna de adelante.'},
   {n:'Zancada atrás en máquina Smith',d:'zancadaSmith',
    c:'La barra guiada sobre los hombros. Da un paso atrás y baja hasta que la rodilla trasera quede cerca del suelo, empuja con el talón de adelante y vuelve. 10-12 por pierna. La barra guiada te deja cargar sin preocuparte del equilibrio.'}]},
 'Peso muerto convencional':{t:'Peso muerto',
  casa:[
   {n:'Peso muerto sumo',d:'sumoDL',
    c:'Pies bastante más abiertos que los hombros, puntas hacia afuera, y las manos tomando la barra por DENTRO de las piernas. Pecho arriba, cadera más baja que en el convencional, y empuja el suelo separando las rodillas. Con el torso más vertical le pide menos a la espalda baja y más a los aductores y al glúteo.'}],
  gym:['=',
   {n:'Peso muerto con barra hexagonal',d:'hexDL',
    c:'Te paras DENTRO de la barra y la tomas por las manijas de los costados. Pecho arriba, espalda neutra y empuja el suelo hasta quedar de pie. El peso queda al lado del cuerpo y no adelante, así que la espalda baja sufre mucho menos que en el convencional: es la opción más amable con tu lumbar.'},
   {n:'Peso muerto sumo',d:'sumoDL',
    c:'Pies bastante más abiertos que los hombros, puntas hacia afuera, y las manos tomando la barra por DENTRO de las piernas. Pecho arriba, cadera más baja que en el convencional, y empuja el suelo separando las rodillas. Con el torso más vertical le pide menos a la espalda baja y más a los aductores y al glúteo.'}]},
 'Sentadilla goblet con mancuerna':{t:'Cuádriceps, volumen',
  casa:[
   {n:'Sentadilla goblet con kettlebell',d:'goblet',
    c:'La goblet con la kettlebell de 20 tomada por los cuernos contra el pecho: son 5 kg más que tu mancuerna más pesada, y en esta casilla es lo que más carga en la casa. Profundidad completa, torso vertical, bajada de 3 segundos.'},
   {n:'Sentadilla goblet con talones elevados',d:'gobletTalon',
    c:'Los talones sobre un disco delgado. Con el talón arriba la rodilla puede ir más adelante y el torso queda más vertical, así que el cuádriceps trabaja más con el mismo peso. Baja en 3 segundos hasta el fondo.'}],
  gym:[
   {n:'Prensa de piernas',d:'prensa',
    c:'Lo que no tienes en la casa: cuádriceps cargado con las dos piernas. Espalda y glúteo pegados al respaldo, pies al ancho de los hombros en el centro de la plataforma. Baja hasta que las rodillas lleguen a unos 90° sin que la cadera se despegue del asiento, y empuja sin bloquear las rodillas arriba. Si al bajar el glúteo se levanta, bajaste de más.'},
   {n:'Sentadilla hack',d:'hack',
    c:'Espalda pegada al respaldo, hombros bajo los cojines, pies al ancho de los hombros en el centro de la plataforma. Baja controlado hasta que el muslo quede paralelo a la plataforma y sube empujando con todo el pie. Carga el cuádriceps de verdad sin que la espalda tenga que aguantar la barra. Ojo con el dibujo: sale de lado e inclinado; la máquina te sostiene la espalda.'},
   {n:'Extensión de cuádriceps',d:'extCuad',
    c:'Sentado, el eje de la máquina alineado con la rodilla y el cojín sobre el tobillo. Estira las piernas hasta arriba, aprieta 1 segundo y baja en 2-3 segundos. Es el único ejercicio que trabaja el cuádriceps solo: va bien con muchas repeticiones y poco descanso.'}]},
 'Puente de glúteo con barra':{t:'Glúteo',
  gym:[
   {n:'Hip thrust en máquina',d:'hipMaq',busca:'hip thrust machine',
    c:'Espalda alta contra el respaldo, el cinturón o el cojín de la máquina sobre la cadera, pies plantados al ancho de la cadera. Empuja con los talones hasta que el cuerpo quede recto del hombro a la rodilla, aprieta el glúteo un segundo arriba y baja controlado. Mentón hacia el pecho. Acá no topas en 90 kg: sube hasta el tope del rango con RIR 1 y entonces agrega peso.'},
   {n:'Hip thrust con barra',d:'hipthrust',
    c:'Espalda alta apoyada en un banco firme del gym, barra sobre la cadera con un cojín. Aprieta el glúteo un segundo arriba, mentón hacia el pecho. Es el ejercicio que tenías en la casa, con el mismo nombre para que siga su historial.'},
   {n:'Patada de glúteo en máquina',d:'patadaMaq',
    c:'Apoyado en la máquina, empuja la plataforma hacia atrás y arriba con el talón, estirando la cadera hasta la línea del cuerpo, y aprieta el glúteo arriba. Vuelve lento. Sin arquear la lumbar al final: la pierna sube con el glúteo, no con la espalda. Las repeticiones son POR PIERNA. Ojo con el dibujo: ahí es con una polea en el tobillo, no con la máquina; el gesto de la cadera es el mismo.'}]},
 'Elevación de talones con mancuernas':{t:'Gemelos',
  casa:[
   {n:'Gemelos a una pierna con mancuerna',d:'gem1p',
    c:'De pie sobre una pierna en el borde de un escalón, la mancuerna en la mano del mismo lado y la otra mano afirmada en la pared. Baja el talón todo lo que puedas y sube hasta la punta con pausa arriba. Con una pierna sola tus mancuernas sí cargan. Las repeticiones son POR PIERNA. Ojo con el dibujo: ahí está en el suelo; tú vas en el borde de un escalón para que el talón baje más.'}],
  gym:[
   {n:'Gemelos en prensa',d:'gemPrensa',
    c:'En la prensa, la punta de los pies en el borde de abajo de la plataforma y las piernas estiradas. Empuja con la punta hasta arriba, pausa, y deja que el talón baje todo lo que pueda. Sin doblar las rodillas.'},
   {n:'Gemelos sentado en máquina',d:'gemSent',
    c:'Sentado, el cojín sobre los muslos cerca de la rodilla y la punta de los pies en el escalón. Sube los talones hasta arriba, pausa, y baja todo el recorrido. Con la rodilla doblada trabaja el músculo de abajo del gemelo, el que de pie casi no se usa.'},
   '=']},
 'Crunch con disco':{t:'Abdomen alto, con carga',
  gym:[
   {n:'Crunch en polea de rodillas',d:'crunchPolea',
    c:'De rodillas frente a la polea alta, la cuerda tomada a los lados de la cabeza. La cadera queda quieta: enrolla la columna llevando los codos hacia los muslos, apretando el abdomen, y vuelve lento. Si te sientas sobre los talones o tiras con los brazos, el abdomen deja de trabajar. Es el abdominal con más carga que existe, y se sube de a un escalón de la pila.'},
   '=',
   {n:'Crunch en máquina',d:'crunchMaq',sinDibujo:1,busca:'ab crunch machine',
    c:'Sentado en la máquina de abdominales, los pies trabados y las manos en las manijas o el pecho contra el cojín según el modelo. Enrolla el tronco hacia adelante apretando el abdomen y vuelve lento sin soltarte de golpe. No tires con los brazos: ellos solo sostienen.'}]},
 'Plancha lateral':{t:'Costado',
  casa:[
   {n:'Plancha lateral con elevación de cadera',d:'planchaDip',
    c:'En plancha lateral, baja la cadera hasta casi rozar el suelo y súbela hasta pasar la línea del cuerpo; esa es una repetición. El costado ya no solo aguanta, también trabaja acortándose. 12 por lado.'}],
  gym:['=',
   {n:'Plancha lateral con disco en la cadera',d:'planchaLat',
    c:'La plancha lateral de siempre con un disco apoyado sobre la cadera de arriba, sostenido con la mano. El disco es el escalón que a la plancha le faltaba. Parte con 5 kg; si la cadera se te cae, se acabó la serie.'},
   {n:'Pallof en polea',d:'pallof',busca:'pallof press cable',
    c:'De pie de costado a la polea, a la altura del pecho, la manija en las dos manos contra el esternón. Empuja las manos al frente hasta estirar los brazos y aguanta 2 segundos sin dejar que la polea te gire, y vuelve. Es anti-rotación: el tronco no se mueve. 12 por lado.'}]},
 'Crunch inverso con mancuerna':{t:'Abdomen bajo, con carga',
  gym:[
   {n:'Silla romana (rodillas al pecho)',d:'sillaRomana',
    c:'Antebrazos en los apoyos, espalda pegada al respaldo y las piernas colgando. Sube las rodillas hacia el pecho y, en el último tramo, enrolla la pelvis hacia arriba: ese es el gesto que trabaja el abdomen bajo. Baja lento sin balancearte. A diferencia de la barra, acá no te cuelgas de las manos, así que el agarre no te limita después del peso muerto.'},
   {n:'Crunch inverso en banco declinado',d:'crunchInv',
    c:'Acostado en el banco declinado con la cabeza arriba, tomado del borde detrás de la cabeza. Sube las rodillas hacia el pecho hasta despegar la cadera del banco y baja en 3 segundos. Cuanto más inclinado el banco, más difícil: ese es el escalón.'},
   '=']}
},

   {n:'Press de pecho en máquina',d:'pechoMaq',
    c:'Moderado y limpio: hoy es volumen, no récord. Manijas a la altura de la mitad del pecho, espalda pegada al respaldo, empuja sin bloquear los codos y vuelve lento.'}]},

 'Superman en colchoneta':{t:'Lumbar',

   {n:'Hiperextensión en banco romano',d:'hiper',
    c:'Cadera en el cojín y tobillos trabados. Baja con la espalda neutra y sube hasta la línea del cuerpo, no más. Es la versión con escalón del superman: cuando 15 te queden fáciles, abraza un disco.'},

 'Bird dog':{t:'Anti-rotación',
  casa:[
   {n:'Plancha con toque de hombro',d:'toqueHombro',
    c:'En plancha alta con las manos bajo los hombros y los pies un poco abiertos. Toca el hombro contrario con una mano, vuélvela al suelo y cambia. La cadera NO se mece: imagina un vaso de agua en la espalda baja. 12 por lado.'}],
  gym:['=',

   {n:'Pallof de rodillas',d:'pallofRod',busca:'half kneeling pallof press',

},
E:{
 'Halo de rodillas con kettlebell':{t:'Anti-extensión',
  casa:[
   {n:'Halo de rodillas con disco',d:'haloDisco',sinDibujo:1,busca:'kneeling plate halo exercise',
    c:'El halo con un disco de 10 kg tomado con las dos manos por los bordes, en vez de la kettlebell. Es el escalón que falta entre la de 8 y la de 20: misma vuelta alrededor de la cabeza, de rodillas, cuerpo recto y sin dejar que la lumbar se arquee cuando el peso pasa por detrás.'}],
  gym:[
   {n:'Rueda abdominal',d:'rueda',
    c:'De rodillas sobre una colchoneta, la rueda en el suelo bajo los hombros. Rueda hacia adelante estirando el cuerpo hasta donde puedas sin que la lumbar se hunda, y vuelve tirando con el abdomen, no con los brazos. Parte con un recorrido corto y alárgalo semana a semana: ese es el escalón. Si sientes la espalda baja, fuiste demasiado lejos. Ojo con el dibujo: el tercer cuadro sale raro; guíate por el del medio, de rodillas.'},
   {n:'Halo de rodillas con disco',d:'haloDisco',sinDibujo:1,busca:'kneeling plate halo exercise',
    c:'El halo con un disco de 10 o 15 kg tomado con las dos manos por los bordes. En el gym hay discos de todos los pesos, así que acá se tapa el salto de 12 kg entre tus dos kettlebells. Misma vuelta alrededor de la cabeza, de rodillas y sin que la lumbar se arquee.'},
   '=']},
 'Iron trident con kettlebell':{t:'Anti-rotación cargada',
  casa:[
   {n:'Iron trident con mancuerna',d:'tridentDB',sinDibujo:1,busca:'iron trident kettlebell core exercise',
    c:'El trident con una mancuerna de 12,5 o 15 kg tomada por un extremo, en vez de la kettlebell. Es el paso del medio entre la de 8 y la de 20. Mismos tres toques por repetición, lento y apoyándola de verdad cada vez, con el pecho arriba.'}],
  gym:[
   {n:'Pallof en polea',d:'pallof',busca:'pallof press cable',

   {n:'Iron trident con mancuerna',d:'tridentDB',sinDibujo:1,busca:'iron trident kettlebell core exercise',
    c:'El trident con una mancuerna del peso que necesites, tomada por un extremo. Mismos tres toques por repetición, lento y con el pecho arriba.'},
   '=']},
 'Crunch con kettlebell en el pecho':{t:'Flexión cargada',
  casa:[
   {n:'Crunch con disco',d:'crunchKB',
    c:'El crunch con un disco abrazado en vez de la kettlebell: con los discos puedes subir de a 2,5 kg, y así no hay que saltar de la de 8 a la de 20. Enrolla la columna hasta despegar los omóplatos y baja en 3 segundos, con la espalda baja pegada al suelo. Ojo con el dibujo: es el del crunch con kettlebell; el recorrido es el mismo.'}],
  gym:[
   {n:'Crunch en polea de rodillas',d:'crunchPolea',
    c:'De rodillas frente a la polea alta, la cuerda a los lados de la cabeza. La cadera quieta: enrolla la columna llevando los codos hacia los muslos y vuelve lento. Si te sientas sobre los talones o tiras con los brazos, el abdomen deja de trabajar.'},
   '=',
   {n:'Crunch declinado con disco',d:'crunchDecl',
    c:'En el banco declinado con los pies trabados, un disco abrazado contra el pecho. Enrolla el tronco hasta despegar la espalda alta y baja lento, sin llegar a apoyar la cabeza. Más inclinación del banco es más difícil. Ojo con el dibujo: ahí sube hasta sentarse; tú solo despegas la espalda alta.'}]},
 'Elevación de piernas colgado':{t:'Abdomen bajo',
  gym:['=',
   {n:'Silla romana (rodillas al pecho)',d:'sillaRomana',
    c:'Antebrazos en los apoyos y espalda contra el respaldo. Sube las rodillas al pecho y enrolla la pelvis hacia arriba en el último tramo. Sin colgarte de las manos: el agarre descansa para la marcha cargada.'},
   {n:'Crunch inverso en banco declinado',d:'crunchInv',
    c:'Acostado en el banco declinado con la cabeza arriba, tomado del borde. Sube las rodillas hasta despegar la cadera y baja en 3 segundos. Más inclinación, más difícil.'}]},
 'Elevación de rodillas oblicua colgado':{t:'Oblicuos acortándose',
  casa:[
   {n:'Giro ruso con disco',d:'giroRuso',
    c:'Sentado con las rodillas dobladas, el torso inclinado atrás unos 45° y la espalda recta. El disco frente al pecho: llévalo a un costado de la cadera girando el tronco entero, no solo los brazos, y después al otro. LENTO; si se vuelve un vaivén rápido, el impulso hace el trabajo. 10-12 en total. Si te molesta la espalda baja, apoya los talones en el suelo.'}],
  gym:['=',
   {n:'Leñador en polea, de arriba abajo',d:'lenador',
    c:'Polea alta, de costado a la máquina, la manija en las dos manos. Lleva la manija en diagonal hacia la cadera contraria girando el tronco y pivotando el pie de atrás, con los brazos casi estirados, y vuelve lento. El giro sale del tronco, no de los brazos. 10-12 en total, la mitad por lado.'},
   {n:'Giro ruso con disco',d:'giroRuso',
    c:'Sentado con el torso inclinado atrás y la espalda recta, el disco frente al pecho. Llévalo de un costado de la cadera al otro girando el tronco entero, lento. 10-12 en total.'}]},
 'Marcha cargada a una mano':{t:'Anti-inclinación',

const LUGARES = [['casa','Casa'],['gym','Gym']];
const lugar = () => S.cfg.lugar==='gym' ? 'gym' : 'casa';
const fijaDeCasilla = e => !!(e.cardio || e.sinPeso);
/* Las opciones de una casilla en un lugar, ya armadas como ejercicios
   completos: heredan de la casilla lo que es de la casilla (series,
   repeticiones, RIR, descanso) y NADA del ejercicio original (ni dibujo, ni
   texto, ni video), o una opción sin dibujo propio mostraría el del PLAN. */
function opcionesDe(d, e, lug){
  const o = !fijaDeCasilla(e) && OPC[d] && OPC[d][e.n];
  if(!o) return [e];
  const lista = lug==='gym' ? (o.gym||['=']) : ['=', ...(o.casa||[])];
  return lista.map(x => x==='=' ? e : {s:e.s, r:e.r, rir:e.rir, rest:e.rest, ...x});
}
/* Última fecha en que hizo ese ejercicio (con repeticiones anotadas). */
function ultimaVez(n){
  let u = '';
  S.fuerza.forEach(x=>{ if(x.ej===n && nz(x.reps)>0 && x.f>u) u=x.f; });
  return u;
}
const claveElec = (d, e, lug) => `${d}|${e.n}|${lug}`;
/* Cuál opción toca hoy, en este orden:
   1) la que eligió él hoy a mano (la máquina estaba ocupada);
   2) la que ya tiene series anotadas hoy — si no, al volver a abrir la app a
      media sesión la rotación le cambiaría el ejercicio bajo los dedos;
   3) la que lleva más tiempo sin hacer, y entre las nunca hechas, la primera
      de la lista. Eso es "rotar". */
function eleccion(d, e, ops, lug){
  if(ops.length===1) return {e:ops[0], por:'unica'};
  const m = (S.elec && S.elec.f===hoy() && S.elec.m) || {};
  const man = ops.find(x=>x.n===m[claveElec(d,e,lug)]);
  if(man) return {e:man, por:'mano'};
  const hecha = ops.find(x=>S.fuerza.some(r=>r.f===hoy() && r.ej===x.n && nz(r.reps)>0));
  if(hecha) return {e:hecha, por:'hecha'};
  let mejor = ops[0], uMejor = ultimaVez(ops[0].n);
  ops.slice(1).forEach(x=>{ const u=ultimaVez(x.n); if(u<uMejor){ mejor=x; uMejor=u; } });
  return {e:mejor, por:'rota'};
}
/* El día tal como se entrena HOY en el lugar elegido: una fila por casilla,
   con sus opciones y la que toca. Todo lo que pinta o cuenta el día pasa por
   acá, para que la lista, el mapa muscular, el historial y el guardado hablen
   del mismo ejercicio. */
function planHoy(d, lug){
  lug = lug || lugar();
  return (PLAN[d]||[]).map(e=>{
    const ops = opcionesDe(d, e, lug);
    const el = eleccion(d, e, ops, lug);
    return {casilla:e, ops, e:el.e, por:el.por};
  });
}
/* Todos los nombres que pueden anotarse en un día, en casa o en el gym: lo
   que cuenta el guardado tiene que ver las series aunque haya cambiado de
   opción o de lugar a media sesión. */
function nombresDelDia(d){
  const s = new Set();
  (PLAN[d]||[]).forEach(e=>LUGARES.forEach(([l])=>opcionesDe(d,e,l).forEach(x=>s.add(x.n))));
  return s;
}

  medidas:[],  // {sem,f,peso,cint,cintE,cad,pecho,brazo,muslo,nota} — UNO POR FECHA
  sesiones:[], // {f,sem,dia,lugar,sueno,zona,dolor,nota} — cómo llegaste a entrenar

};
/* La molestia sirve si es accionable: por eso cada zona sabe qué ejercicios
   la cargan, y la alerta dice cuáles bajar en vez de un "cuidado" genérico. */

let S = JSON.parse(JSON.stringify(DEF));

function toast(m){
