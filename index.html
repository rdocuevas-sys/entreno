/* ============================================================
   4b. REFRESCOS EN EL SITIO
   ------------------------------------------------------------
   No se puede llamar a render() mientras alguien está escribiendo:
   rehacer el HTML destruye el campo, se pierde el foco y el número
   queda a medias (escribir 2380 kcal terminaba guardando 32, y 89,4
   de peso terminaba en 8 kg). Estas funciones actualizan solo lo
   que depende del dato, sin tocar los campos.
   ============================================================ */
function refrescarCabecera(){
  const t=targets();
  document.getElementById('hdrTargets').textContent =
    `${t.kcal} kcal · ${t.p} g proteína · semana ${semanaHoy()}`;
}
function refrescarComida(){
  const lk=document.getElementById('lblKcal'); if(!lk) return;
  const t=targets();
  const cd=comidaDia(comFecha||hoy());
  const pct=(v,o)=>Math.min(100,Math.round(nz(v)/o*100));
  const objKcal = cd.d.tipo==='Alto'?t.alto : cd.d.tipo==='Bajo'?t.bajo : t.kcal;
  lk.textContent = `Calorías · objetivo ${objKcal}`;
  const bk=document.getElementById('barKcal');
  bk.style.width = pct(cd.kcal,objKcal)+'%';
  bk.className = nz(cd.kcal)>objKcal*1.05?'over':'';
  document.getElementById('lblProt').textContent = `Proteína · objetivo ${t.p} g`;
  document.getElementById('barProt').style.width = pct(cd.p,t.p)+'%';
}
function refrescarAjustes(){
  const c=document.getElementById('statsAjustes');
  if(c) c.innerHTML = statsAjustesHTML();
  const p=document.getElementById('pesoSemana');
  if(p) p.innerHTML = pesoSemanaTxt();
  refrescarCabecera();
}
/* Qué hay anotado HOY en el día que está abierto. Cuenta solo lo que tiene
   repeticiones (o minutos): un peso escrito sin reps todavía no es una serie. */
function resumenSesion(){
  const f = hoy();
  const nombres = nombresDelDia(dia);
  const series = S.fuerza.filter(x=>x.f===f && nombres.has(x.ej) && nz(x.reps)>0);
  /* El cardio ya no se puede buscar por nombre prescrito: ahora la modalidad
     la elige él. Se busca el bloque del día. */
  const c = filaCardio();
  return {series:series.length, ejercicios:new Set(series.map(x=>x.ej)).size,
          cardio:nz(c.min), cardioTipo:modalidadCardio(c.tipo, cardioSugerido(dia))};
}
function textoGuardado(){
  const r = resumenSesion();
  if(!r.series && !r.cardio) return `Día ${dia} · nada anotado todavía`;
  const partes = [];
  if(r.series) partes.push(`${r.series} serie${r.series===1?'':'s'} en ${r.ejercicios} ejercicio${r.ejercicios===1?'':'s'}`);
  if(r.cardio) partes.push(`${r.cardio} min de ${r.cardioTipo ? r.cardioTipo.toLowerCase() : 'cardio'}`);
  return `${saveT?'Guardando…':'Guardado ✓'} Día ${dia} · ${partes.join(' · ')}`;
}
function refrescarGuardado(){
  const el=document.getElementById('gStat');
  if(el) el.textContent = textoGuardado();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  /* al entrar a Medidas siempre se aterriza en HOY, no en el día que quedó
     seleccionado la última vez que se abrió */
  if(b.dataset.tab){ tab=b.dataset.tab;
    /* al entrar se aterriza en HOY, no en el día que quedó seleccionado la
       última vez: si no, anotas el almuerzo de hoy en el martes pasado */
    if(tab==='medidas') medFecha=hoy();
    if(tab==='comida') comFecha=hoy();
    render(); window.scrollTo(0,0); return; }
  if(b.dataset.medir){ medFecha=b.dataset.medir; tab='medidas'; render(); window.scrollTo(0,0); return; }
  if(b.dataset.medborrar){
    const f=b.dataset.medborrar, r=S.medidas.find(x=>x.f===f);
    if(!confirm(`¿Borrar el registro del ${f}${r&&nz(r.peso)>0?` (${coma(r.peso)} kg)`:''}?`)) return;
    S.medidas = S.medidas.filter(x=>x.f!==f);
    if(medFecha===f) medFecha=hoy();
    saveNow(); render(); toast('Registro borrado');
    return;
  }
  if(b.dataset.day){ dia=b.dataset.day; render(); return; }
  if(b.dataset.lugar){
    S.cfg.lugar = b.dataset.lugar;
    /* la sesión de hoy queda marcada con el lugar solo si ya existe; mirar
       las opciones del gym desde la casa no crea una sesión */
    const ses = S.sesiones.find(x=>x.f===hoy());
    if(ses) ses.lugar = lugar();
    saveNow(); render(); return;
  }
  if(b.dataset.opc!==undefined){
    const idx = +b.dataset.opc, fila = planHoy(dia)[idx];
    if(!fila) return;
    if(!S.elec || S.elec.f!==hoy()) S.elec = {f:hoy(), m:{}};
    S.elec.m[claveElec(dia, fila.casilla, lugar())] = b.dataset.opn;
    saveNow();
    /* render() rehace la lista cerrada; el ejercicio que estabas mirando se
       vuelve a abrir, o elegir una opción te lo cerraría en la cara */
    render();
    const a = document.querySelector(`.ex[data-ex="${idx}"]`);
    if(a) a.dataset.open = '1';
    return;
  }
  if(b.dataset.toggle!==undefined){
    const a=b.closest('.ex'); a.dataset.open = a.dataset.open==='1'?'0':'1'; return;
  }
  if(b.id==='btnCome'){ agregarComida(); return; }
  if(b.id==='btnManual'){ document.getElementById('manualBox').classList.toggle('hide'); return; }
  if(b.id==='btnAuto'){
    /* volver al calculado = BORRAR la corrección, no escribir un cero:
       un cero seguiría siendo un total escrito a mano, y de 0 kcal */
    const row=S.comida.find(x=>x.f===(comFecha||hoy()));
    if(row){ ['kcal','p','c','g','agua'].forEach(k=>{ delete row[k]; }); saveNow(); }
    render(); toast('Vuelve a mandar la suma del día'); return;
  }
  if(b.dataset.comir){ comFecha=b.dataset.comir; render(); window.scrollTo(0,0); return; }
  if(b.id==='btnPlato'){ guardarPlato(); return; }
  if(b.dataset.plato){
    const p=(S.platos||[]).find(x=>x.pid===b.dataset.plato); if(!p) return;
    const filas=anotarFrase(p.txt, (document.getElementById('comeHora')||{}).value);
    if(!filas) return;
    saveNow(); render(); avisarAnotado(filas); return;
  }
  if(b.dataset.platoborrar){
    const p=(S.platos||[]).find(x=>x.pid===b.dataset.platoborrar); if(!p) return;
    if(!confirm(`¿Borrar la comida «${p.nombre}»?\n\n${p.txt}\n\nNo borra nada de lo que ya anotaste.`)) return;
    S.platos=S.platos.filter(x=>x.pid!==p.pid);
    saveNow(); render(); toast('Comida borrada'); return;
  }
  if(b.dataset.frec!==undefined){
    const filas=anotarFrase(b.dataset.frec, (document.getElementById('comeHora')||{}).value);
    if(!filas) return;
    saveNow(); render(); avisarAnotado(filas); return;
  }
  if(b.dataset.comeborrar){
    const r=(S.alimentos||[]).find(x=>x.rid===b.dataset.comeborrar);
    if(!r) return;
    if(!confirm(`¿Borrar «${r.txt}» de las ${r.hora||'—'}?`)) return;
    S.alimentos = S.alimentos.filter(x=>x.rid!==r.rid);
    saveNow(); render(); toast('Registro borrado'); return;
  }
  if(b.id==='btnExp'){ const o=document.getElementById('expOut');
    o.value=expText(); o.classList.remove('hide'); o.select(); toast('Listo — copia y pégalo en el chat'); return; }
  if(b.id==='btnResp'){ guardarRespaldo(); return; }
  if(b.id==='btnGhOn'){ ghConectar(); return; }
  if(b.id==='btnGhOff'){
    if(!confirm('¿Desconectar el respaldo automático?\n\nBorra el token de este teléfono. Lo que ya está subido en GitHub NO se toca.')) return;
    ghApagar(); render(); toast('Respaldo automático desconectado'); return;
  }
  if(b.id==='btnGhSubir'){
    b.disabled=true; b.textContent='Subiendo…';
    ghSubir(false).then(r=>{
      render();
      toast(r.estado==='ok' ? `Subido — ${r.n} registros a salvo`
        : r.estado==='encogio' ? 'No se subió: el respaldo de allá tiene más registros'
        : r.estado==='sinred' ? 'Sin señal — se sube sola cuando vuelvas a abrirla'
        : r.estado==='off' ? 'No hay respaldo automático conectado'
        : `No se pudo subir: ${r.msg||''}`);
    });
    return;
  }
  if(b.id==='btnGhTraer'){
    if(!confirm('Traer el último respaldo de GitHub REEMPLAZA lo que tienes en este teléfono.\n\n¿Seguir?')) return;
    ghTraer(); return;
  }
  if(b.id==='btnJson'){
    /* El JSON se arma ANTES de marcar la fecha, para que el respaldo que se
       lleva no venga diciendo que ya estaba respaldado. Después se redibuja,
       que apaga el aviso y la marca de la pestaña, y recién ahí se rellena el
       cuadro: render() lo reconstruye vacío. */
    const json = JSON.stringify(S);
    marcarRespaldado(); render();
    const o = document.getElementById('respOut');
    o.value = json; o.classList.remove('hide'); o.select();
    toast('Cópialo y guárdalo — es tu respaldo'); return; }
  /* el input de archivo va oculto y lo dispara este botón: el control nativo
     se ve de una forma distinta en cada navegador y trunca su propio texto */
  if(b.id==='btnFile'){ const i=document.getElementById('impFile'); if(i) i.click(); return; }
  if(b.id==='btnImp'){ document.getElementById('impBox').classList.toggle('hide');
    document.getElementById('impIn').focus(); return; }
  if(b.id==='btnImpGo'){ importar(); return; }
  if(b.id==='btnReset'){
    if(confirm('¿Borrar todos los registros? No se puede deshacer.')){
      S=Object.assign(JSON.parse(JSON.stringify(DEF)),{cfg:S.cfg}); save(); render(); toast('Registros borrados');
    } return;
  }
  /* prepararAudio() va DENTRO del click a propósito: el navegador solo deja
     sonar audio nacido de un gesto del usuario. */
  if(b.dataset.serie){ prepararAudio(); iniciarCrono(+b.dataset.serie, b.dataset.serieej, 'serie'); return; }
  if(b.dataset.rest){ prepararAudio(); iniciarCrono(+b.dataset.rest, b.dataset.restej, 'descanso'); return; }
  if(b.dataset.hist!==undefined){
    const caja = b.closest('.ex').querySelector(`[data-histbox="${b.dataset.hist}"]`);
    const abierta = !caja.classList.contains('hide');
    if(abierta){ caja.classList.add('hide'); b.textContent='Historial'; return; }
    /* se arma al abrirla para que muestre lo de recién, no lo del render */
    caja.innerHTML = historialHTML(planHoy(dia)[+b.dataset.hist].e.n);
    caja.classList.remove('hide'); b.textContent='Ocultar historial';
    return;
  }
  if(b.id==='btnCrono30'){ cronoFin += 30000; cronoAviso=false;
    document.getElementById('crono').classList.remove('listo');
    if(!cronoTick) cronoTick=setInterval(pintarCrono,250);
    pintarCrono(); return; }
  if(b.id==='btnCronoX'){ cerrarDescanso(); return; }
  if(b.id==='btnGuardar'){
    saveNow();                       /* sin esperar los 600 ms del guardado automático */
    const r=resumenSesion();
    toast(r.series||r.cardio
      ? `Día ${dia} guardado — ${r.series} serie${r.series===1?'':'s'}`
      : 'Todavía no hay nada anotado para guardar');
    return;
  }
  if(b.id==='btnUpd'){ aplicarActualizacion(); return; }
});

/* ---- restaurar respaldo ---- */
/* Con `texto` viene de un archivo elegido; sin él, de lo pegado a mano. Las
   dos puertas pasan por la MISMA validación y la misma confirmación: si el
   archivo se saltara los avisos, cargar el respaldo equivocado borraría todo
   sin preguntar. */
function importar(texto){
  const txt = (texto!==undefined ? String(texto) : document.getElementById('impIn').value).trim();
  if(!txt){ toast('Pega primero el JSON del respaldo'); return; }
  let d;
  try{ d = JSON.parse(txt); }
  catch(e){ toast('Eso no es un JSON válido — cópialo completo'); return; }
  /* `alimentos` va en la cuenta: con el registro por comidas es la lista más
     larga de todas, y sin ella el aviso decía «vas a cargar 0 registros»
     restaurando un respaldo con dos meses de comida adentro. */
  const listas = ['fuerza','cardio','comida','alimentos','medidas','sesiones'];
  if(!d || typeof d!=='object' || Array.isArray(d) || !listas.some(k=>Array.isArray(d[k]))){
    toast('El respaldo no tiene la forma esperada'); return;
  }
  const n = listas.reduce((a,k)=>a+(Array.isArray(d[k])?d[k].length:0),0);
  const tengo = listas.reduce((a,k)=>a+S[k].length,0);
  const aviso = `Vas a cargar ${n} registro${n===1?'':'s'} (${listas.map(k=>`${Array.isArray(d[k])?d[k].length:0} ${k}`).join(', ')}).`
    + (tengo ? `\n\nEsto REEMPLAZA ${tengo===1?'el registro':'los '+tengo+' registros'} que tienes ahora. No se puede deshacer.` : '')
    + '\n\n¿Continuar?';
  if(!confirm(aviso)) return;
  const base = JSON.parse(JSON.stringify(DEF));
  S = Object.assign(base, d);
  listas.forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
  /* un respaldo anterior a las comidas guardadas no trae la lista */
  if(!Array.isArray(S.platos)) S.platos=[];
  if(!S.elec || typeof S.elec!=='object' || !S.elec.m) S.elec={f:'',m:{}};
  S.cfg = Object.assign(JSON.parse(JSON.stringify(DEF.cfg)), d.cfg||{});
  S.semana = +d.semana || 1;
  if(isNaN(fechaMs(S.cfg.inicio))){
    /* respaldo viejo, sin fecha de inicio: se toma el registro más antiguo */
    const fechas = [...S.fuerza,...S.cardio,...S.comida,...S.medidas]
      .map(x=>x.f).filter(f=>!isNaN(fechaMs(f))).sort();
    S.cfg.inicio = fechas[0] || hoy();
  }
  saveNow(); render(); toast(`Restaurados ${n} registros`);
}

/* La fecha de Medidas se atiende en 'change' y no en 'input': cambiarla
   redibuja la pestaña entera, y redibujar desde 'input' destruye el campo que
   estás tocando a media edición — que es exactamente el defecto del 10-ago. */
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='impFile'){
    const f = el.files && el.files[0];
    if(!f) return;
    f.text().then(t=>importar(t))
     .catch(()=>toast('No pude leer ese archivo'))
     /* el input se vacía SIEMPRE: si no, volver a elegir el mismo archivo no
        dispara 'change' y parecería que el botón dejó de funcionar */
     .finally(()=>{ el.value=''; });
    return;
  }
  /* ⚠Estos van en `change` y NO en `input`: cambiarlos redibuja la tabla, y
     redibujar desde el handler de `input` destruye el campo que se está
     escribiendo — es el defecto del 10-ago que borraba lo tecleado. */
  if(el.dataset.comen){
    const r=(S.alimentos||[]).find(x=>x.rid===el.dataset.comen);
    if(r){ r.n = el.value===''?0:+el.value; reestimar(r); saveNow(); render(); }
    return;
  }
  if(el.dataset.comekcal || el.dataset.comep){
    const cual = el.dataset.comekcal ? 'kcal' : 'p';
    const rid = el.dataset.comekcal || el.dataset.comep;
    const r=(S.alimentos||[]).find(x=>x.rid===rid);
    if(r){ r[cual] = el.value===''?null:+el.value; saveNow(); render(); }
    return;
  }
  if(el.dataset.comfecha!==undefined){
    if(isNaN(fechaMs(el.value))) return;   /* fecha a medio escribir */
    comFecha = el.value; render(); window.scrollTo(0,0); return;
  }
  if(el.dataset.medfecha===undefined) return;
  if(isNaN(fechaMs(el.value))) return;   /* fecha a medio escribir */
  medFecha = el.value; render(); window.scrollTo(0,0);
});

document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target && e.target.id==='comeTxt'){ e.preventDefault(); agregarComida(); }
});

document.addEventListener('input',e=>{
  const el=e.target; const v=el.value;
  if(el.dataset.ej){
    const {ej,s,fld}=el.dataset;
    let row=S.fuerza.find(x=>x.f===hoy()&&x.ej===ej&&x.serie===+s);
    if(!row){ row={f:hoy(),sem:semanaHoy(),dia,lugar:lugar(),ej,serie:+s,kg:'',reps:'',rir:''}; S.fuerza.push(row); }
    row[fld]=v; row.sem=semanaHoy(); save();
    const art=el.closest('.ex');
    const total=art.querySelectorAll('table.sets tbody tr').length;
    let done=0; art.querySelectorAll('input[data-fld=reps]').forEach(i=>{if(nz(i.value)>0)done++});
    art.classList.toggle('done',done===total);
    refrescarGuardado();
    return;
  }
  if(el.dataset.ses){
    let row=S.sesiones.find(x=>x.f===hoy());
    if(!row){ row={f:hoy(),sem:semanaHoy(),dia}; S.sesiones.push(row); }
    row[el.dataset.ses]=v; row.dia=dia; row.lugar=lugar(); save(); return;
  }
  if(el.dataset.car){
    const fld=el.dataset.car;
    let row=filaCardio();
    /* El tipo arranca en el sugerido del día: si anota los minutos y nunca
       toca el desplegable, el registro tiene que decir igual lo que hizo —
       era justo lo que se veía en pantalla. */
    if(!row.f){ row={f:hoy(),sem:semanaHoy(),dia,tipo:cardioSugerido(dia),min:'',metros:'',kcal:''}; S.cardio.push(row); }
    row.tipo = modalidadCardio(row.tipo, cardioSugerido(dia));   /* deja el viejo en el formato nuevo */
    row[fld]=v; row.dia=dia; row.sem=semanaHoy(); save(); refrescarGuardado(); return;
  }
  if(el.dataset.com){
    /* del día que está abierto en la pestaña, no de hoy */
    const fc = comFecha || hoy();
    let row=S.comida.find(x=>x.f===fc);
    if(!row){ row={f:fc,sem:semanaDe(fc)}; S.comida.push(row); }
    row[el.dataset.com]=v; row.sem=semanaDe(fc); save();
    if(['kcal','p','tipo'].includes(el.dataset.com)) refrescarComida();
    return;
  }
  if(el.dataset.med){
    /* El registro es el del día que está seleccionado arriba. Se crea recién
       cuando escribes algo: entrar a mirar un día viejo no debe dejar una fila
       vacía con esa fecha. */
    const row = filaMed(medFecha || hoy(), true);
    row[el.dataset.med] = (v===''?'':+v);
    row.sem = semanaDe(row.f);
    save();
    if(el.dataset.med==='peso') refrescarCabecera();   /* el peso mueve kcal y proteína */
    return;
  }
  if(el.dataset.hoypeso!==undefined){
    if(v==='') return;              /* campo a medio borrar: no se guarda un 0 */
    const row = filaMed(hoy(), true);
    row.peso = +v; row.sem = semanaDe(row.f);
    save(); refrescarAjustes(); return;
  }
  if(el.dataset.cfg){
    if(v==='') return;              /* campo a medio borrar: no se guarda un 0 */
    S.cfg[el.dataset.cfg]=+v; save(); refrescarAjustes(); return;
  }
  if(el.dataset.inicio){
    if(isNaN(fechaMs(v))) return;      /* fecha a medio escribir: no se guarda */
    S.cfg.inicio = v; save(); refrescarAjustes(); return;
  }
});

/* ============================================================
   9. SERVICE WORKER — instalación offline y actualizaciones
   ============================================================ */
let swEnEspera = null;

function mostrarActualizacion(w){
  swEnEspera = w;
  document.getElementById('upd').classList.add('on');
}
function aplicarActualizacion(){
  const b = document.getElementById('btnUpd');
  b.textContent = 'Actualizando…'; b.disabled = true;
  if(swEnEspera) swEnEspera.postMessage({type:'SKIP_WAITING'});
  else location.reload();
}

async function registrarSW(){
  if(!('serviceWorker' in navigator)) return;
  /* si ya había un controlador, un cambio de controlador significa versión nueva.
     En la primera instalación no lo hay, y ahí NO hay que recargar. */
  const habiaControlador = !!navigator.serviceWorker.controller;
  try{
    const reg = await navigator.serviceWorker.register('sw.js');

    if(reg.waiting && habiaControlador) mostrarActualizacion(reg.waiting);

    reg.addEventListener('updatefound', ()=>{
      const nuevo = reg.installing; if(!nuevo) return;
      nuevo.addEventListener('statechange', ()=>{
        if(nuevo.state === 'installed' && navigator.serviceWorker.controller){
          mostrarActualizacion(nuevo);
        }
      });
    });

    let recargando = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(!habiaControlador || recargando) return;
      recargando = true; location.reload();
    });

    /* busca versión nueva al volver a la app, como mucho una vez cada 5 minutos */
    let ultima = Date.now();
    const buscar = ()=>{
      if(document.visibilityState !== 'visible') return;
      if(Date.now() - ultima < 5*60*1000) return;
      ultima = Date.now(); reg.update().catch(()=>{});
    };
    document.addEventListener('visibilitychange', buscar);
    setInterval(buscar, 30*60*1000);
  }catch(e){ /* sin service worker la app funciona igual, solo que sin modo sin conexión */ }
}

(async function init(){ await load(); dia = diaSugerido(); render(); registrarSW(); ghAuto(); })();
/* y al volver a la app: es cuando acaba de anotar algo y cierra */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') ghAuto(); });
</script>
